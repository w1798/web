<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>網頁程式集</title>
    <link rel="icon" type="image/png" href="nextime.png">
    <link rel="apple-touch-icon" href="nextime.png">
    
<script>
    // 1. 版本控制：修改此處可強制使用者瀏覽器更新快取
    const APP_VER = "1.00f";

    // 2. 資源清單：要增減檔案改這裡即可，不需要請註解即可
    const resources = {
        styles: [
            "style.css"
        ], 
        scripts: [
            "counter.js",
            "script.js"
        ]
    };

    /**
     * 核心邏輯：將資源標籤注入到 <head>
     */
    function injectResource(type, url) {
        const isCSS = type === 'css';
        const el = document.createElement(isCSS ? 'link' : 'script');
        const attr = isCSS ? 'href' : 'src';
        
        if (isCSS) {
            el.rel = 'stylesheet';
        } else {
            // 關鍵：確保 script 按照注入順序執行
            el.async = false;
        }

        // 加上版本號以解決 Cache 問題
        el[attr] = `${url}?ver=${APP_VER}`;
        
        // 成功與失敗的追蹤
        el.onload = () => console.log(`%c[已載入] ${type.toUpperCase()}: ${url}`, "color: #00b894");
        el.onerror = () => console.error(`[載入失敗] ${url}`);

        document.head.appendChild(el);
    }

    /**
     * 主程序：解析配置並執行載入
     */
    function loadApp() {
        console.log(`%c[Loader] 開始初始化資源 (版本: ${APP_VER})`, "color: #3498db; font-weight: bold;");

        const configs = [
            { data: resources.styles, type: 'css', label: 'CSS' },
            { data: resources.scripts, type: 'js', label: 'JS' }
        ];

        configs.forEach(config => {
            if (config.data && config.data.length > 0) {
                config.data.forEach(url => injectResource(config.type, url));
            } else {
                // 當陣列為空時，優雅地顯示提示
                console.log(`%c[Notice] 無外部 ${config.label} 資源需要載入`, "color: #e67e22");
            }
        });
    }

    // 啟動！
    loadApp();
</script>

</head>
<body>

    <aside class="sidebar">
        <div class="nav-group">
            <div id="nav-all" class="nav-item active" onmouseenter="filterLinks('all', this)">全部彙整</div>
            <div id="nav-fav" class="nav-item" onmouseenter="filterLinks('fav', this)">我的最愛</div>
            <div id="nav-daily" class="nav-item" onmouseenter="filterLinks('daily', this)">教學日常</div>
            <div id="nav-milestone" class="nav-item" onmouseenter="filterLinks('milestone', this)">階段任務</div>
            <div id="nav-doc" class="nav-item" onmouseenter="filterLinks('doc', this)">文件相關</div>
            <div id="nav-game" class="nav-item" onmouseenter="filterLinks('game', this)">教學遊戲</div>
            <div id="nav-tool" class="nav-item" onmouseenter="filterLinks('tool', this)">其他軟體</div>
        </div>
    </aside>

    <main class="main-container">
        <header>
            <a href="https://nextime5.blogspot.com" target="_blank" class="main-title">Charles Nextime 網頁程式集</a>
            <div class="toolbar">
                <button class="view-btn" onclick="scrollToComments()" style="border-color: #00b894; color: #fff894;">留言</button>
                <button id="btn-detail" class="view-btn" onclick="changeView('detail', this)">詳細</button>
                <button id="btn-simple" class="view-btn active" onclick="changeView('simple', this)">精簡</button>
                <button class="view-btn" onclick="resetAllData()" style="border-color: #ff7675; color: #ffbcbc;">重置</button>
            </div>
        </header>
        <div id="link-container" class="simple-view"></div>
        <div id="comment-area" class="giscus-container" style="margin-top: 50px; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 30px; padding-bottom: 150px; padding-left: 20px; padding-right: 20px;">
            <div class="giscus"></div>
        </div>
        
        <script src="https://giscus.app/client.js"
            data-repo="w1798/my-comments"
            data-repo-id="R_kgDORJxfpw"
            data-category="General"
            data-category-id="DIC_kwDORJxfp84C18p5"
            data-mapping="url"
            data-strict="0"
            data-reactions-enabled="1"
            data-emit-metadata="0"
            data-input-position="top"
            data-theme="preferred_color_scheme"
            data-lang="zh-TW"
            crossorigin="anonymous"
            async>
        </script>
    </main>

    <footer class="footer-mini"></footer>

    <button id="backToTop" onclick="scrollToTop()" title="回到頂端">
        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="18 15 12 9 6 15"></polyline>
        </svg>
    </button>

</body>
</html>
