<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charles Nextime 的網頁程式</title>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --card-bg: rgba(255, 255, 255, 0.9);
            --text-color: #2d3436;
        }

        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background: var(--primary-gradient);
            background-attachment: fixed;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .main-content {
            width: 100%;
            max-width: 1200px;
            padding: 40px 20px 120px 20px; /* 底部增加間距防止 Footer 遮擋 */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: white;
            margin-bottom: 30px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.2);
            font-size: 1.8rem;
            text-align: center;
        }

        #link-container {
            display: grid;
            /* 使用 grid 並配合 align-items 確保卡片高度一致 */
            grid-template-columns: repeat(5, 1fr); 
            gap: 20px;
            width: 100%;
        }

        /* 響應式佈局調整 */
        @media (max-width: 1100px) { #link-container { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 768px) { #link-container { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 480px) { #link-container { grid-template-columns: 1fr; } }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            text-decoration: none;
            color: inherit;
            border: 1px solid rgba(255,255,255,0.3);
            backdrop-filter: blur(10px);
            
            /* 讓卡片內容能垂直延伸 */
            display: flex;
            flex-direction: column;
            height: 100%; 
            box-sizing: border-box;
        }

        .card:hover {
            transform: translateY(-5px);
            background: #ffffff;
            box-shadow: 0 12px 20px rgba(0,0,0,0.2);
        }

        .card h2 {
            margin: 0 0 12px 0;
            font-size: 1.1rem;
            color: #4834d4;
            /* 移除強制單行，改為自然換行 */
            line-height: 1.3;
        }

        .card p {
            margin: 0;
            font-size: 0.9rem;
            line-height: 1.6;
            color: #636e72;
            /* 關鍵修正：移除 -webkit-line-clamp 以顯示完整文字 */
            display: block; 
            overflow: visible;
            text-align: justify;
        }

        /* --- Footer 設定 --- */
        .author-info {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            text-align: center;
            padding: 15px 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            z-index: 1000;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .author-link {
            text-decoration: none;
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }

        .author-link:hover {
            color: #fff;
            text-decoration: underline;
        }

        /* 標題連結樣式 */
        .title-link {
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="main-content">
        <a href="https://nextime5.blogspot.com" target="_blank" class="title-link">
            <h1>Charles Nextime 的網頁程式</h1>
        </a>
        <div id="link-container"></div>
    </div>

    <footer class="author-info">
        <a href="https://nextime5.blogspot.com" target="_blank" class="author-link">
            Completed by Charles Nextime with AI assistance, 2026
        </a>
    </footer>

    <script>
        // 連結資料陣列
        const links = [
            { 
                title: "Charles Nextime 的程式", 
                desc: "一些好用的 Windows 獨立軟體，開放程式碼自由使用。", 
                url: "https://nextime5.blogspot.com/" 
            },
            { 
                title: "評語提詞架構師", 
                desc: "提供高自由度，讓您自定義類別與特質，並透過視覺化操作輕鬆完成評語提詞。介面風格時尚美觀，兼具實用與設計感，是追求效率與極簡美學者的最佳選擇。", 
                url: "https://w1798.github.io/web/evalprompt" 
            },
            { 
                title: "教學清點小幫手", 
                desc: "快速處理學生各項任務或作業訂正流程，讓課堂管理變得輕鬆高效。", 
                url: "https://w1798.github.io/web/markit" 
            },
            { 
                title: "數位考場看板", 
                desc: "即時顯示考試資訊、播放聽力測驗和當前進度，並提醒注意事項，幫助學生掌握考試時間。", 
                url: "https://w1798.github.io/web/examboard" 
            },
            { 
                title: "Puti-AI學生期末評語提示詞生成器 V8 加強版(修改)", 
                desc: "強化後，功能佳，但「評語提詞架構師」更直觀、功能更強大。", 
                url: "https://w1798.github.io/web/comment" 
            }
        ];

        function renderLinks() {
            const container = document.getElementById('link-container');
            container.innerHTML = links.map(item => `
                <a href="${item.url}" target="_blank" class="card">
                    <h2>${item.title}</h2>
                    <p>${item.desc}</p>
                </a>
            `).join('');
        }
        
        renderLinks();
    </script>
</body>
</html>
