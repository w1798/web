<!DOCTYPE html>
<html lang="zh-TW">
<head>

<script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charles Nextime 的網頁程式</title>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --card-bg: rgba(255, 255, 255, 0.9);
            --text-color: #2d3436;
        }

body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background: var(--primary-gradient);
            background-attachment: fixed;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* 確保內容從頂部開始，不因 flex 居中 */
            justify-content: flex-start; 
            min-height: 100vh;
        }

        .main-content {
            width: 97%;
            max-width: 1400px; 
            /* 減少頂部 padding (原 40px -> 15px) */
            padding: 15px 20px 120px 20px; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: white;
            /* 強制移除頂部邊距，並縮小底部邊距 (原 40px -> 20px) */
            margin: 0 0 20px 0; 
            text-shadow: 0 4px 10px rgba(0,0,0,0.2);
            font-size: 2.5rem;
            text-align: center;
        }

        #link-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr); 
            gap: 25px;
            width: 100%;
            /* 確保 container 本身沒有額外外距 */
            margin-top: 0; 
        }

        /* 響應式佈局：螢幕變小時自動調整列數 */
        @media (max-width: 1100px) { #link-container { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 850px) { #link-container { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 550px) { #link-container { grid-template-columns: 1fr; } }

        .card {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            text-decoration: none;
            color: inherit;
            border: 1px solid rgba(255,255,255,0.3);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            height: 100%; 
            box-sizing: border-box;
        }

        .card:hover {
            transform: translateY(-8px);
            background: #ffffff;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
        }

        .card h2 {
            margin: 0 0 15px 0;
            font-size: 1.4rem; /* 調大的標題 */
            color: #4834d4;
            line-height: 1.4;
        }

        .card p {
            margin: 0;
            font-size: 1.0rem; /* 調大的內文 */
            line-height: 1.4;
            color: #444;
            display: block; 
            text-align: justify;
        }

        .author-info {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            text-align: center;
            padding: 18px 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            z-index: 1000;
        }

        .author-link {
            text-decoration: none;
            color: rgba(255, 255, 255, 0.9);
            font-size: 1rem;
            transition: all 0.3s ease;
        }


#busuanzi_container_site_pv {
    color: rgba(255, 255, 255, 0.7); /* 讓顏色跟作者資訊一致 */
    font-size: 0.9rem;
    margin-left: 15px; /* 與左邊文字隔開 */
    border-left: 1px solid rgba(255, 255, 255, 0.3); /* 加一條細細的分隔線 */
    padding-left: 15px;
}

#busuanzi_value_site_pv {
    color: #00d2ff; /* 給數字一個亮眼的水藍色 */
    font-weight: bold;
}

    </style>
</head>
<body>




    <div class="main-content">
        <a href="https://nextime5.blogspot.com" target="_blank" style="text-decoration: none;">
            <h1>Charles Nextime 的網頁程式</h1>
        </a>
        <div id="link-container"></div>
    </div>

    <footer class="author-info">
        <a href="https://nextime5.blogspot.com" target="_blank" class="author-link">
            Completed by Charles Nextime with AI assistance, 2026
        </a>
<span id="busuanzi_container_site_pv">本站總訪問量 <span id="busuanzi_value_site_pv"></span> 次</span>
    </footer>

    <script>
        // 這裡放 8 個連結資料
        const links = [
            { title: "Charles Nextime 的程式", desc: "　一些好用的 Windows 軟體，程式碼公開透明，不僅安全免費、無廣告干擾，更能自由使用。<br>　邀您體驗純粹、強大且不受限的數位工作流。", url: "https://nextime5.blogspot.com/" },
            { title: "★ 作業動態曆", desc: "　解放雙手的智慧作業排程助手。<br>　採「智慧動態推移」技術，讓相同作業自動遞延、精準避開假日。結合直覺的視覺化編輯與全面客製化風格，讓功課管理告別壓力，轉化為一場極簡高效的視覺享受。", url: "https://w1798.github.io/web/homework" },

            { title: "★ 評語提詞自造佳", desc: "　自訂模組，造視操作，佳句生成！<br>　提供高自由度，讓您「視覺化」自定義類別與特質，並透過簡單操作輕鬆完成評語提詞，是追求效率與流暢美學者的最佳選擇。", url: "https://w1798.github.io/web/evalprompt" },

            { title: "★ 教學清點小幫手", desc: "　快速處理學生任務與作業訂正，簡化繁瑣流程。<br>　即時掌握學習狀況，讓課堂管理變得輕鬆有感，騰出更多時間回歸教學本質。", url: "https://w1798.github.io/web/markit" },

            { title: "★ 數位考場看板", desc: "　即時顯示考試資訊、當前進度和播放聽力測驗，並提醒注意事項，幫助學生掌握考試時間。<br>　設定方便快速，各科可單獨設定個別試場人數，讓監考老師掌握試場人數。", url: "https://w1798.github.io/web/examboard" },
            { title: "★ 專業JSON編輯器", desc: "　能自動解析各種複雜的 JSON 結構檔並視覺化編修。<br>　可以資料模組化為直觀的卡片，支援動態拖拽排序與即時編輯，任何配置檔都能輕鬆修改。", url: "https://w1798.github.io/web/jsonEditor" }
        ];

        function renderLinks() {
            const container = document.getElementById('link-container');
            container.innerHTML = links.map(item => `
                <a href="${item.url}" target="_blank" class="card">
                    <h2>${item.title}</h2>
                    <p>${item.desc}</p>
                </a>
            `).join('');
        }
        
        renderLinks();
    </script>
</body>
</html>
