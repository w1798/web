<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>ClassKudox 專用備份工具</title>
    <style>
        :root {
            --primary: #4a90e2;
            --bg: #f8f9fa;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h2 { color: #333; margin-bottom: 0.5rem; }
        p { color: #666; font-size: 0.9rem; margin-bottom: 1.5rem; }
        .status-tag { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; margin-bottom: 1rem; }
        .status-ok { background: #e3f9e5; color: #1f7a26; }
        .status-err { background: #ffe9e9; color: #d32f2f; }
        button { background: var(--primary); color: white; border: none; padding: 12px 24px; border-radius: 6px; font-size: 1rem; cursor: pointer; width: 100%; transition: opacity 0.2s; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .info { margin-top: 1rem; font-size: 0.75rem; color: #999; }
    </style>
</head>
<body>

<div class="card">
    <h2>數據備份系統</h2>
    <p>針對 classKudox_backup 量身優化</p>
    
    <div id="statusTag" class="status-tag">檢查中...</div>
    
    <button id="btnDownload" disabled>建立 Gzip 備份檔</button>
    
    <div class="info" id="dataInfo">待命</div>
</div>

<script>
    const STORAGE_KEY = 'classKudox_backup';
    const btn = document.getElementById('btnDownload');
    const statusTag = document.getElementById('statusTag');
    const dataInfo = document.getElementById('dataInfo');

    // 1. 偵測 localStorage
    function checkData() {
        const rawData = localStorage.getItem(STORAGE_KEY);
        if (rawData) {
            statusTag.textContent = "✅ 已偵測到核心數據";
            statusTag.className = "status-tag status-ok";
            btn.disabled = false;
            
            // 計算原始大小
            const sizeKB = (new Blob([rawData]).size / 1024).toFixed(2);
            dataInfo.textContent = `原始數據大小: ${sizeKB} KB`;
            return rawData;
        } else {
            statusTag.textContent = "❌ 找不到 classKudox 資料";
            statusTag.className = "status-tag status-err";
            dataInfo.textContent = "請確保您在正確的網域下開啟此檔案";
            return null;
        }
    }

    // 2. 執行壓縮與下載
    async function performBackup() {
        const rawData = localStorage.getItem(STORAGE_KEY);
        if (!rawData) return;

        try {
            btn.textContent = "正在壓縮...";
            btn.disabled = true;

            // 準備備份包 (封裝 metadata)
            const backupPackage = {
                timestamp: new Date().toISOString(),
                source: "ClassKudox_Manual_Backup",
                payload: rawData // 直接保留原始字串（可能是 script.js 產生的壓縮碼）
            };

            const jsonString = JSON.stringify(backupPackage);
            const uint8Array = new TextEncoder().encode(jsonString);

            // 使用瀏覽器原生 Gzip 串流
            const cs = new CompressionStream('gzip');
            const writer = cs.writable.getWriter();
            writer.write(uint8Array);
            writer.close();

            const compressedBlob = await new Response(cs.readable).blob();
            
            // 下載檔案
            const url = URL.createObjectURL(compressedBlob);
            const a = document.createElement('a');
            const dateStr = new Date().toISOString().slice(0, 10);
            
            a.href = url;
            a.download = `Kudox_Backup_${dateStr}.json.gz`;
            document.body.appendChild(a);
            a.click();
            
            // 清理
            setTimeout(() => {
                URL.revokeObjectURL(url);
                document.body.removeChild(a);
                btn.textContent = "建立 Gzip 備份檔";
                btn.disabled = false;
                alert("備份成功！檔案已導出為 .json.gz");
            }, 1000);

        } catch (err) {
            console.error(err);
            alert("壓縮失敗: " + err.message);
            btn.disabled = false;
        }
    }

    btn.addEventListener('click', performBackup);
    window.addEventListener('load', checkData);
</script>

</body>
</html>
