<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClassKudox 全資料打包救援工具</title>
    <style>
        body { font-family: sans-serif; padding: 2rem; background: #f0f4f8; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #1e293b; margin-top: 0; }
        button { background: #4f46e5; color: white; border: none; padding: 1rem 2rem; font-size: 1.1rem; border-radius: 8px; cursor: pointer; transition: background 0.3s; width: 100%; box-sizing: border-box; }
        button:hover { background: #4338ca; }
        p { color: #64748b; line-height: 1.5; }
        .alert { background: #fffbeb; color: #d97706; padding: 1rem; border-radius: 8px; font-size: 0.9rem; margin-bottom: 1.5rem; border-left: 4px solid #fbbf24; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📦 ClassKudox 資料救援</h1>

        <p>此工具將會掃描您瀏覽器目前的 localStorage，並將所有的 ClassKudox 資料打包匯出為 JSON 檔。</p>
        <p>匯出後，您可以將這份 JSON 檔傳送到另一台裝置，並使用主程式系統設定裡的<strong>「📥 匯入 JSON 檔」</strong>功能來復原您的資料。</p>
        
        <button id="exportBtn">立即打包匯出資料</button>
        <div id="status" style="margin-top: 1rem; font-weight: bold; text-align: center;"></div>
    </div>

    <script>
        const downloadFile = (blob, filename) => {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        };

        document.getElementById('exportBtn').addEventListener('click', async () => {
            const backup = {};
            let count = 0;
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && (key.startsWith('CD_') || ['BId', 'Key', 'aSyn', 'sVer'].includes(key))) {
                    try {
                        const val = localStorage.getItem(key);
                        try {
                            backup[key] = JSON.parse(val);
                        } catch(e) {
                            backup[key] = val;
                        }
                        count++;
                    } catch(err) {
                        console.error('讀取發生錯誤:', key);
                    }
                }
            }
            
            const statusEl = document.getElementById('status');
            if (count === 0) {
                statusEl.textContent = "未找到任何資料！請確認您的網址是否與當初使用系統的網址相同。";
                statusEl.style.color = "#ef4444";
                return;
            }

            const dataStr = JSON.stringify(backup, null, 2);
            const dateStr = new Date().toISOString().slice(0,10).replace(/-/g, '');
            
            try {
                if ('CompressionStream' in window) {
                    statusEl.textContent = "正在壓縮中...";
                    const stream = new Blob([dataStr], { type: "application/json" }).stream();
                    const compressedStream = stream.pipeThrough(new CompressionStream("gzip"));
                    const blob = await new Response(compressedStream).blob();
                    downloadFile(blob, `ClassKudox_Rescue_${dateStr}.json.gz`);
                    statusEl.textContent = `✅ 成功打包並以 Gzip 壓縮匯出 ${count} 筆資料 (.json.gz)！`;
                } else {
                    const blob = new Blob([dataStr], { type: "application/json" });
                    downloadFile(blob, `ClassKudox_Rescue_${dateStr}.json`);
                    statusEl.textContent = `✅ 成功打包匯出 ${count} 筆資料！(此瀏覽器不支援 Gzip，已匯出原始 JSON)`;
                }
                statusEl.style.color = "#10b981";
            } catch (err) {
                console.error('匯出失敗:', err);
                statusEl.textContent = "匯出失敗，請查看控制台錯誤訊息。";
                statusEl.style.color = "#ef4444";
            }
        });
    </script>
</body>
</html>
