<!DOCTYPE html>
<html lang="zh-TW">
<head>

    <script>
        const APP_VER = "1.00f";

        function loadApp() {
            console.log(`%c[Loader] 開始載入資源 (版本: ${APP_VER})`, "color: #3498db; font-weight: bold;");


            // 2. 定義要載入的 JS 清單
            const scripts = [
                "../counter.js"
            ];

            scripts.forEach(src => {
                const s = document.createElement('script');
                s.src = `${src}?ver=${APP_VER}`;
                s.async = false; 

                // 成功載入訊息
                s.onload = () => {
                    console.log(`%c[JS] 載入成功: ${src}`, "color: #00b894;");
                };

                // 失敗報錯訊息
                s.onerror = () => {
                    console.error(`[JS] 載入失敗!!! 請檢查路徑: ${src}`);
                };

                document.head.appendChild(s);
            });
        }

        loadApp();
    </script>
    
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>姓名格式轉換工具</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px; /* 縮小邊距 */
            font-size: 18px;
        }
        .container {
            background: white;
            padding: 20px 30px; /* 緊湊內距 */
            border-radius: 12px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 800px;
        }
        /* 標題與連結放在同一列 */
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }
        h2 { margin: 0; font-size: 24px; color: #333; }
        
        .external-link {
            color: #1976d2;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
        }
        .external-link:hover { text-decoration: underline; }

        p { color: #666; font-size: 16px; margin: 8px 0; }

        textarea {
            width: 100%;
            height: 120px; /* 縮小高度防止跨頁 */
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 18px;
            margin-bottom: 10px;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }
        .btn-paste { background-color: #e3f2fd; color: #1976d2; }
        .btn-clear { background-color: #ffebee; color: #d32f2f; }
        .btn-copy { background-color: #4caf50; color: white; }

        .output-label { font-weight: bold; font-size: 16px; margin-bottom: 5px; display: block; }
        .output-area {
            background: #f9f9f9;
            padding: 12px;
            border-radius: 8px;
            border: 2px dashed #bbb;
            word-break: break-all;
            min-height: 40px;
            font-size: 20px;
            font-family: monospace;
            line-height: 1.2;
        }

        footer {
            margin-top: 15px;
            font-size: 14px;
            color: #888;
            text-align: center;
        }
        footer a { color: #666; text-decoration: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-row">
        <h2>姓名中譯英格式轉換器</h2>
        <a href="https://www.boca.gov.tw/sp-natr-batchform-1.html" target="_blank" class="external-link">
            🔗 外文姓名中譯英系統(外交部領事事務局)
        </a>
    </div>

    <p>輸入姓名（一列一個）：</p>
    <textarea id="inputNames" placeholder="王小明&#10;歐陽小美"></textarea>

    <div class="button-group">
        <button class="btn-paste" onclick="pasteText()">貼上</button>
        <button class="btn-clear" onclick="clearAll()">清除</button>
        <button class="btn-copy" onclick="copyResult()">複製結果</button>
    </div>

    <span class="output-label">轉換結果：</span>
    <div id="output" class="output-area">...</div>
</div>

<footer></footer>

<script>

    const inputEl = document.getElementById('inputNames');
    const outputEl = document.getElementById('output');

    inputEl.addEventListener('input', transformNames);

    function transformNames() {
        const text = inputEl.value.trim();
        if (!text) {
            outputEl.innerText = "...";
            return;
        }
        const lines = text.split(/\r?\n/).filter(line => line.trim() !== "");
        const formattedList = lines.map(name => {
            const cleanName = name.replace(/\s+/g, '');
            if (cleanName.length === 2) return `${cleanName[0]},${cleanName[1]}`;
            if (cleanName.length === 3) return `${cleanName[0]},${cleanName[1]},${cleanName[2]}`;
            if (cleanName.length >= 4) return `${cleanName.substring(0,2)},${cleanName[2]},${cleanName[3]}`;
            return cleanName; 
        });
        outputEl.innerText = formattedList.join(';');
    }

    async function pasteText() {
        try {
            inputEl.value = await navigator.clipboard.readText();
            transformNames();
        } catch (err) { alert('請手動貼上'); }
    }

    function clearAll() {
        inputEl.value = '';
        outputEl.innerText = '...';
    }

    function copyResult() {
        const result = outputEl.innerText;
        if (result === "...") return;
        navigator.clipboard.writeText(result).then(() => alert('已複製！'));
    }
</script>




</body>
</html>
