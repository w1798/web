<!DOCTYPE html>
<html lang="zh-TW">
<head>

<script>
    // 1. 版本控制
    const APP_VER = "1.00f";

    // 2. 資源清單：要增減檔案改這裡即可，不需要請刪除或註解即可
    const resources = {
        styles: [
//            "style.css"
        ], 
        scripts: [
            "../counter.js"
        ]
    };

    // --- 立即隱藏頁面 ---
    document.documentElement.style.visibility = 'hidden';

    /**
     * 核心邏輯：將資源標籤注入到 <head>
     */
    function injectResource(type, url, onCssLoaded) {
        const isCSS = type === 'css';
        const el = document.createElement(isCSS ? 'link' : 'script');
        const attr = isCSS ? 'href' : 'src';
        
        if (isCSS) {
            el.rel = 'stylesheet';
        } else {
            el.async = false;
        }

        el[attr] = `${url}?ver=${APP_VER}`;
        
        el.onload = () => {
            console.log(`%c[已載入] ${type.toUpperCase()}: ${url}`, "color: #00b894");
            // 若為 CSS，載入成功後執行進度檢查
            if (isCSS && onCssLoaded) onCssLoaded();
        };

        el.onerror = () => {
            console.error(`[載入失敗] ${url}`);
            // 若為 CSS，即便失敗也要解鎖，避免畫面永久白屏
            if (isCSS && onCssLoaded) onCssLoaded();
        };

        document.head.appendChild(el);
    }

    /**
     * 主程序：解析配置並執行載入
     */
    function loadApp() {
        console.log(`%c[Loader] 開始初始化資源 (版本: ${APP_VER})`, "color: #3498db; font-weight: bold;");

        const cssList = resources.styles || [];
        let cssLoadedCount = 0;

        // 【新增】檢查 CSS 載入進度
        const checkCssProgress = () => {
            cssLoadedCount++;
            if (cssLoadedCount >= cssList.length) {
                document.documentElement.style.visibility = 'visible';
                console.log("%c[Display] 樣式套用完成，解除頁面鎖定", "color: #9b59b6; font-weight: bold;");
            }
        };

        // 如果完全沒有 CSS，直接顯示
        if (cssList.length === 0) {
            document.documentElement.style.visibility = 'visible';
        }

        // 執行載入
        const configs = [
            { data: cssList, type: 'css', label: 'CSS' },
            { data: resources.scripts, type: 'js', label: 'JS' }
        ];

        configs.forEach(config => {
            if (config.data && config.data.length > 0) {
                config.data.forEach(url => {
                    // 只有 CSS 傳入回調函式
                    injectResource(config.type, url, config.type === 'css' ? checkCssProgress : null);
                });
            } else {
                console.log(`%c[Notice] 無外部 ${config.label} 資源需要載入`, "color: #e67e22");
            }
        });
    }

    // 啟動！
    loadApp();
</script>
    
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>姓名格式轉換工具</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px; /* 縮小邊距 */
            font-size: 18px;
        }
        .container {
            background: white;
            padding: 20px 30px; /* 緊湊內距 */
            border-radius: 12px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 800px;
        }
        /* 標題與連結放在同一列 */
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }
        h2 { margin: 0; font-size: 24px; color: #333; }
        
        .external-link {
            color: #1976d2;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
        }
        .external-link:hover { text-decoration: underline; }

        p { color: #666; font-size: 16px; margin: 8px 0; }

        textarea {
            width: 100%;
            height: 120px; /* 縮小高度防止跨頁 */
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 18px;
            margin-bottom: 10px;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }
        .btn-paste { background-color: #e3f2fd; color: #1976d2; }
        .btn-clear { background-color: #ffebee; color: #d32f2f; }
        .btn-copy { background-color: #4caf50; color: white; }

        .output-label { font-weight: bold; font-size: 16px; margin-bottom: 5px; display: block; }
        .output-area {
            background: #f9f9f9;
            padding: 12px;

        footer {
            margin-top: 15px;
            font-size: 14px;
            color: #888;
            text-align: center;
        }
        footer a { color: #666; text-decoration: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-row">
        <h2>姓名中譯英格式轉換器</h2>
        <a href="https://www.boca.gov.tw/sp-natr-batchform-1.html" target="_blank" class="external-link">
            🔗 外文姓名中譯英系統(外交部領事事務局)
        </a>
    </div>

    <p>輸入姓名（一列一個）：</p>
    <textarea id="inputNames" placeholder="王小明&#10;歐陽小美"></textarea>

    <div class="button-group">
        <button class="btn-paste" onclick="pasteText()">貼上</button>
        <button class="btn-clear" onclick="clearAll()">清除</button>
        <button class="btn-copy" onclick="copyResult()">複製結果</button>
    </div>

    <span class="output-label">轉換結果：</span>
    <div id="output" class="output-area">...</div>
</div>

<footer></footer>

<script>

    const inputEl = document.getElementById('inputNames');
    const outputEl = document.getElementById('output');

    inputEl.addEventListener('input', transformNames);

    function transformNames() {
        const text = inputEl.value.trim();
        if (!text) {
            outputEl.innerText = "...";
            return;
        }
        const lines = text.split(/\r?\n/).filter(line => line.trim() !== "");
        const formattedList = lines.map(name => {
            const cleanName = name.replace(/\s+/g, '');
            if (cleanName.length === 2) return `${cleanName[0]},${cleanName[1]}`;
            if (cleanName.length === 3) return `${cleanName[0]},${cleanName[1]},${cleanName[2]}`;
            if (cleanName.length >= 4) return `${cleanName.substring(0,2)},${cleanName[2]},${cleanName[3]}`;
            return cleanName; 
        });
        outputEl.innerText = formattedList.join(';');
    }

    async function pasteText() {
        try {
            inputEl.value = await navigator.clipboard.readText();
            transformNames();
        } catch (err) { alert('請手動貼上'); }
    }

    function clearAll() {
        inputEl.value = '';
        outputEl.innerText = '...';
    }

    function copyResult() {
        const result = outputEl.innerText;
        if (result === "...") return;
        navigator.clipboard.writeText(result).then(() => alert('已複製！'));
    }
</script>




</body>
</html>
