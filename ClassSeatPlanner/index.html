<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧班級排座家</title>
    <link rel="stylesheet" href="style.css?ver=1.00b">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- 左側控制面板 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>智慧班級排座家</h1>
                <p>Class Seat Planner</p>
                <div style="display: flex; gap: 8px;">
                    <button id="btn-open-config" class="btn primary" style="flex: 0 0 100px; margin-top: 16px; display: flex; align-items: center; justify-content: center; gap: 8px;">
                        <span>⚙️設定</span>
                    </button>
                    <button id="btn-reset-all" class="btn danger" style="flex: 1; margin-top: 16px; display: flex; align-items: center; justify-content: center;">
                        <span>重置系統</span>
                    </button>
                </div>
            </div>

            <div class="control-section">
                <h2>自動排位</h2>
                <div class="btn-group">
                    <button id="btn-random-sidebar" class="btn primary" style="font-size: 13px;">🎲 隨機排位</button>
                    <button id="btn-sequential-sidebar" class="btn secondary" style="font-size: 13px;">🔢 依序排位</button>
                </div>
                <div style="margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; gap: 8px;">
                    <button id="btn-gender-interleave" class="btn secondary" style="font-size: 13px; background: rgba(59, 130, 246, 0.2); border: 1px solid var(--accent-color);">👫 男女間隔排</button>
                    <button id="btn-clear-sidebar" class="btn danger" style="width: 100%; font-size: 13px;">🗑️ 清空所有座位</button>
                </div>
            </div>
            
            <div class="control-section" style="flex: 1; min-height: 0; display: flex; flex-direction: column;">
                <h2>學生名單</h2>
                <p class="hint">拖曳入座</p>
                <div class="student-list" id="student-list">
                    <!-- 學生名單 -->
                </div>
            </div>
        </aside>

        <!-- 右側主要排位區 -->
        <main class="main-content">
            <div class="blackboard-area">
                <div class="blackboard">
                    <span>黑板 / 講台</span>
                </div>
            </div>
            
            <div class="seating-grid-container" id="seating-grid-container">
                <div class="seating-grid" id="seating-grid">
                    <!-- Grid will be generated here -->
                </div>
            </div>
        </main>
    </div>

    <!-- Modal for Batch Student Import (Original) -->
    <div id="student-modal" class="modal-overlay" style="display:none;">
        <!-- ... keeping it for separate batch edit if needed, or we can merge into central config ... -->
        <div class="modal-content">
            <h2>批次修改名單</h2>
            <p style="margin-bottom: 12px; color: var(--text-secondary); font-size: 14px;">請輸入學生名單 (每一行一位學生)</p>
            <textarea id="modal-student-textarea" rows="12" placeholder="01&#10;02&#10;03..."></textarea>
            <div class="modal-actions" style="margin-top: 16px; display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap;">
                <button id="btn-modal-clear" class="btn danger" style="width: auto; padding: 10px 16px;">清空名單</button>
                <button id="btn-modal-reset" class="btn secondary" style="width: auto; padding: 10px 16px;">恢復預設碼</button>
                <div style="flex-basis: 100%; height: 0; margin: 4px 0;"></div>
                <button id="btn-modal-cancel" class="btn secondary" style="width: auto; padding: 10px 24px;">取消</button>
                <button id="btn-modal-save" class="btn primary" style="width: auto; padding: 10px 24px;">儲存並套用</button>
            </div>
        </div>
    </div>

    <!-- Main Config Modal (New) -->
    <div id="config-modal" class="modal-overlay" style="display:none;">
        <div class="modal-content config-modal-content">
            <div class="modal-header">
                <h2>系統設定與排位操作</h2>
                <span id="btn-close-config" class="close-btn">&times;</span>
            </div>
            
            <div class="modal-body">
                <div class="config-grid">
                    <!-- Section 1: Group Constraints (Now at the top) -->
                    <div class="config-sec full-width">
                        <h3>群組衝突避讓</h3>
                        <div class="group-flex">
                            <div class="group-form" style="width: 100%;">
                                <div class="form-group">
                                    <label>群組學生 (點擊欄位進行選擇):</label>
                                    <input type="text" id="group-members" placeholder="點擊展開學生名單..." readonly style="cursor: pointer; background: rgba(59, 130, 246, 0.1);">
                                </div>
                                <div class="form-group">
                                    <label>避讓模式:</label>
                                    <select id="group-mode">
                                        <option value="left_right">左右相鄰</option>
                                        <option value="front_back">前後相鄰</option>
                                        <option value="cross">小十字 (前後左右)</option>
                                        <option value="grid">九宮格 (周圍8格)</option>
                                    </select>
                                </div>
                                <div style="display: flex; gap: 12px; margin-bottom: 16px;">
                                    <button id="btn-add-group" class="btn primary" style="flex: 1;">建立規則</button>
                                    <button id="btn-clear-groups" class="btn danger" style="flex: 1;">清空規則</button>
                                </div>

                                <div style="border-top: 1px solid var(--border-color); padding-top: 16px;">
                                    <label>已啟用規則:</label>
                                    <div class="active-groups" id="active-groups">
                                        <!-- 群組列表 -->
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Section 2: Grid & Batch (Now below) -->
                    <div class="config-sec full-width">
                        <h3>網格與名單</h3>
                        <div style="display: flex; gap: 24px; align-items: flex-start;">
                            <div style="flex: 1;">
                                <div class="form-group" style="display:flex; gap:12px;">
                                    <div style="flex:1;">
                                        <label>直列 (行):</label>
                                        <input type="number" id="grid-cols" value="6" min="1" max="7">
                                    </div>
                                    <div style="flex:1;">
                                        <label>橫排 (列):</label>
                                        <input type="number" id="grid-rows" value="5" min="1" max="7">
                                    </div>
                                </div>
                                <button id="btn-resize" class="btn secondary" style="width: 100%;">更新網格尺寸</button>
                            </div>
                            <div style="flex: 1;">
                                <div class="form-group">
                                    <label>男生前幾位 (名單前 N 位):</label>
                                    <input type="number" id="boy-count" value="15" min="0" max="49" style="padding: 6px;">
                                </div>
                                <button id="btn-open-student-modal-from-config" class="btn secondary" style="width: 100%;">批次修改名單內容</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <footer class="app-footer">
      <a href="https://w1798.github.io/web/" target="_blank">&copy; 2026<script>const y=new Date().getFullYear(); if(y>2026)document.write("-"+y);</script> Charles Nextime</a> · 
      <a href="https://www.gnu.org/licenses/gpl-3.0.html" target="_blank">GPLv3</a>
      <span id="busuanzi_container_page_pv">
    本頁使用量 <span id="busuanzi_value_page_pv"></span> 次
</span>
    </footer>

    <!-- Student Picker Modal (New) -->
    <div id="picker-modal" class="modal-overlay" style="display:none; z-index:1200;">
        <div class="modal-content" style="width: 500px;">
            <h2>選擇群組學生</h2>
            <p style="margin-bottom: 12px; color: var(--text-secondary); font-size: 14px;">點選以下學生加入群組避讓規則</p>
            <div id="picker-student-grid" class="student-list" style="grid-template-columns: repeat(5, 1fr); gap: 8px; max-height: 400px; overflow-y: auto; padding: 10px; background: rgba(0,0,0,0.2); border-radius: 8px;">
                <!-- Checkboxes will be here -->
            </div>
            <div class="modal-actions" style="margin-top: 16px; display: flex; gap: 8px; justify-content: flex-end;">
                <button id="btn-picker-cancel" class="btn secondary" style="width: auto; padding: 10px 24px;">取消</button>
                <button id="btn-picker-confirm" class="btn primary" style="width: auto; padding: 10px 24px;">確認</button>
            </div>
        </div>
    </div>

<style>
#busuanzi_container_page_pv {
    color: #888;
    font-size: 0.9rem;
    margin-left: 15px;
    border-left: 1px solid rgba(128, 128, 128, 0.5); /* 計數器加一條細細的分隔線 */
    padding-left: 15px;
}

#busuanzi_value_page_pv {
    color: #00b894;
    font-weight: bold;
}
</style>


<script>
(function() {
    // return; // 取消此行可停止計數，直接在這裡回傳，後面的代碼完全不執行
    
    // 計數器這樣無論是 /web/ 還是 /web 都會統一變成 /web 
    const path = window.location.pathname.replace(/\/$/, ""); 
    const TIME_KEY = `VERCOUNT_TIME_${path}`; // 每個分頁獨立計算冷卻時間
    const VAL_KEY = `VERCOUNT_VAL_${path}`;   // 每個分頁獨立存儲 PV 數
    
    const COOL_DOWN = 30 * 60 * 1000; 
    const now = Date.now();
    const lastVisit = localStorage.getItem(TIME_KEY);
    
    // 計算剩餘秒數
    const timeLeft = lastVisit ? Math.ceil((parseInt(lastVisit) + COOL_DOWN - now) / 1000) : 0;

    if (timeLeft <= 0) {
        console.log(`%c[Vercount]%c 路徑 ${path} 冷卻結束，更新數據...`, "color:#00b894;font-weight:bold", "color:inherit");
        
        const script = document.createElement('script');
        script.src = "https://events.vercount.one/js";
        script.defer = true;
        
        script.onload = () => {
            setTimeout(() => {
                const pvVal = document.getElementById('busuanzi_value_page_pv')?.innerText;
                if (pvVal) {
                    localStorage.setItem(VAL_KEY, pvVal);
                    localStorage.setItem(TIME_KEY, now); // 成功抓到才更新時間
                }
            }, 1500);
        };
        document.head.appendChild(script);
    } else {
        const lastVal = localStorage.getItem(VAL_KEY) || "--";
        console.log(`%c[Vercount]%c ${path} 冷卻中（剩 ${timeLeft} 秒）。顯示舊值：${lastVal}`, "color:#f1c40f;font-weight:bold", "color:inherit");

        window.addEventListener('load', () => {
            const pvSpan = document.getElementById('busuanzi_value_page_pv');
            if (pvSpan) pvSpan.innerText = lastVal;
        });
    }
})();
</script>



    <script src="script.js?ver=1.00b"></script>
</body>
</html>
