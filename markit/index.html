<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教學清點小幫手 by Charles Nextime</title>

    <script>
        const APP_VER = "1.00f";

        function loadApp() {
            console.log(`%c[Loader] 開始載入資源 (版本: ${APP_VER})`, "color: #3498db; font-weight: bold;");

            // 1. 載入 CSS
            const link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = `style.css?ver=${APP_VER}`;
            document.head.appendChild(link);
            console.log(`%c[CSS] style.css 已標記下載`, "color: #9b59b6;");

            // 2. 定義要載入的 JS 清單
            const scripts = [
                "../counter.js", 
                "script.js"
            ];

            scripts.forEach(src => {
                const s = document.createElement('script');
                s.src = `${src}?ver=${APP_VER}`;
                s.async = false; 

                // 成功載入訊息
                s.onload = () => {
                    console.log(`%c[JS] 載入成功: ${src}`, "color: #00b894;");
                };

                // 失敗報錯訊息
                s.onerror = () => {
                    console.error(`[JS] 載入失敗!!! 請檢查路徑: ${src}`);
                };

                document.head.appendChild(s);
            });
        }

        loadApp();
    </script>
    
    <style>
        .quick-select-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 15px; 

}
        .tag-btn { background: var(--primary); opacity: 0.8; color: white; padding: 6px 

12px; border-radius: 15px; cursor: pointer; font-size: 0.9rem; border: none; transition: 

0.2s; }
        .tag-btn:hover { opacity: 1; transform: scale(1.05); }
        .clickable-task { text-decoration: underline; cursor: pointer; color: var(--

primary); font-weight: bold; }
        .clickable-task:hover { filter: brightness(0.8); }
        .empty-hint { grid-column: 1 / -1; text-align: center; padding: 100px 20px; 

color: #888; font-size: 1.5rem; font-weight: bold; }

50px 0; font-weight: bold; }
