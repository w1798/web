<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教學清點小幫手 by Charles Nextime</title>
    <link rel="stylesheet" href="style.css?ver=1.09">
    <style>
        .quick-select-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 15px; 

}
        .tag-btn { background: var(--primary); opacity: 0.8; color: white; padding: 6px 

12px; border-radius: 15px; cursor: pointer; font-size: 0.9rem; border: none; transition: 

0.2s; }
        .tag-btn:hover { opacity: 1; transform: scale(1.05); }
        .clickable-task { text-decoration: underline; cursor: pointer; color: var(--

primary); font-weight: bold; }
        .clickable-task:hover { filter: brightness(0.8); }
        .empty-hint { grid-column: 1 / -1; text-align: center; padding: 100px 20px; 

color: #888; font-size: 1.5rem; font-weight: bold; }
        /* 總名單全完成樣式 */
        .all-done-msg { text-align: center; font-size: 1.8rem; color: #28a745; padding: 

50px 0; font-weight: bold; }
    </style>
</head>
<body data-theme="soft">

<header>
    <div class="logo">教學清點小幫手</div>



<div class="nav-buttons">
    <div class="nav-group">
        <button class="nav-btn" onclick="exportData()">匯出</button>
        <button class="nav-btn" onclick="triggerImport()">匯入</button>
        <input type="file" id="importInput" style="display:none" accept=".json" onchange="importData(event)">
    <button class="nav-btn" onclick="cloudSync('UPLOAD')">上傳</button>
    <button class="nav-btn" onclick="cloudSync('DOWNLOAD')">下載</button>
    </div>

    <div class="nav-group danger-zone">
        <button class="nav-btn" onclick="resetSystem()">重置</button>
    </div>

    <div class="nav-group">
        <button class="nav-btn" onclick="openModal('settingsModal')">設定</button>
        <button class="nav-btn" onclick="openReportModal()">個人查詢</button>
        <button class="nav-btn" onclick="openTotalListModal()">總清單</button>
        <button class="nav-btn btn-primary" onclick="openAddModal()">新增任務</button>
    </div>
</div>


</header>

<main id="assignmentContainer" class="main-layout"></main>





<div id="settingsModal" class="modal">
    <div class="modal-content modal-full modal-fixed-70">
        <div class="modal-header-btns">
            <button class="nav-btn" onclick="closeModal('settingsModal')">取消</button>
            <button class="btn-confirm" onclick="saveSettings()">確定儲存</button>
        </div>
        <h2 class="settings-title">系統設定</h2>
        <div class="settings-grid-container scroll-box" style="grid-template-columns: 

1.5fr 1.5fr 1fr 1fr;">
            <div class="settings-column">
                <div class="settings-row"><label>介面風格：<select id="themeSelect" 

class="select-short-width"><option value="soft">柔和藍</option><option value="tech">科技

黑</option><option value="girl">粉嫩色</option><option value="forest">森林綠

</option><option value="ocean">海洋藍</option><option value="sunset">夕陽橘

</option><option value="lavender">薰衣草</option><option value="minimal">極簡灰

</option><option value="sakura">櫻花粉</option><option value="coffee">咖啡棕

</option><option value="mint">薄荷綠</option><option value="lemon">檸檬黃

</option><option value="grape">葡萄紫</option><option value="chocolate">巧克力

</option><option value="midnight">午夜藍</option></select></label></div>
                <div class="settings-row"><label>主頁任務數：<select id="layoutSelect" 

class="select-short-width"></select></label></div>
                <div class="settings-row"><label>座號每行：<select 

id="studentColsSelect" class="select-short-width"><option value="3">3 個</option><option 

value="4">4 個</option><option value="5">5 個</option><option value="6">6 個

</option><option value="7">7 個</option><option value="8">8 個</option><option 

value="9">9 個</option><option value="10">10 個</option></select></label></div>
                <div class="settings-row"><label>座號字體：<select 

id="studentFontSizeSelect" class="select-short-width"></select></label></div>



    <div class="settings-row">
<p> 雲端備份設定 (<a href="https://w1798.github.io/web/JsonCloudGuide" target="_blank">申請說明</a>)</p>
<label>
<input type="text" id="binId" style="width:180px" class="select-short-width" autocomplete="off" placeholder="URL or JSONBinID">
	<button onclick="resetBinField('binId')">重置</button></label></div>
    <div class="settings-row"><label><input type="text" id="apiKey" style="width:180px" class="select-short-width" autocomplete="off" placeholder="Token or X-Access-Key">
<button onclick="resetBinField('apiKey')">重置</button></label></div>

</div>

            <div class="settings-column">
                <div class="settings-row"><label>自動加日期：<input type="checkbox" 

id="autoDate" style="width:20px;height:20px;"></label></div>
                <div class="settings-row"><label>任務標籤累加模式：<input 

type="checkbox" id="appendModeSetting" style="width:20px;height:20px;"></label></div>
                <div class="settings-row"><label>點座號視窗大小：<select id="sizeDetail" 

class="select-short-width size-sel"></select></label></div>
                <div class="settings-row"><label>個人任務視窗大小：<select 

id="sizeReport" class="select-short-width size-sel"></select></label></div>
                <div class="settings-row"><label>總清單視窗大小：<select id="sizeTotal" 

class="select-short-width size-sel"></select></label></div>
                <div class="settings-row"><label>任務排序：<select id="sortOrderSelect" 

class="select-short-width"><option value="desc">新 → 舊</option><option value="asc">舊 

→ 新</option></select></label></div>
                <div class="settings-row"><label>預設日期：<select id="dateOffsetSelect" 

class="select-short-width"></select></label></div>

<div class="settings-row">
    <label>切換色數：
        <select id="statusCountSelect" class="select-short-width"></select>
    </label>
</div>

                <div class="settings-row"><button class="btn-danger btn-small" 

onclick="cleanFinishedAssignments()">🗑️ 清除已完成任務</button></div>
            </div>



<div class="settings-column">
    <div style="display: flex; justify-content: flex-start; align-items: center; gap: 

10px;">
        <label>快速任務標籤：</label>
        <a href="javascript:void(0)" onclick="resetQuickTasks()" style="font-size: 1rem; 

color: var(--primary); text-decoration: none;">(重置)</a>
    </div>
    <textarea id="quickTasksConfig" class="input-triple" style="flex:1; margin-

top:5px;"></textarea>
</div>

<div class="settings-column">
    <div style="display: flex; justify-content: flex-start; align-items: center; gap: 

10px;">
        <label>全班座號或名稱：</label>
        <a href="javascript:void(0)" onclick="resetStudentList()" style="font-size: 

1rem; color: var(--primary); text-decoration: none;">(重置)</a>
    </div>
    <textarea id="studentListConfig" class="input-triple" style="flex:1; margin-

top:5px;"></textarea>
</div>




        </div>
    </div>
</div>

<div id="addAssignmentModal" class="modal">
    <div class="modal-content" style="max-width: 500px;">
        <div class="modal-header-btns">
            <button class="nav-btn" onclick="closeModal('addAssignmentModal')">取消

</button>
            <button class="btn-confirm" onclick="addAssignment()">確定</button>
        </div>
        <h2 style="margin-top:10px;">新增任務名稱</h2>
        <div id="dateQuickSelect" class="quick-select-tags" style="margin-bottom: 

10px;"></div>
        <input type="text" id="assignmentNameInput" class="large-input" placeholder="輸

入或點選標籤">
        <div class="quick-select-tags" id="quickTags"></div>
    </div>
</div>




<div id="detailModal" class="modal">
    <div class="modal-content modal-full dynamic-size" id="detailModalContent">
        <div class="modal-header-btns">
            <button class="btn-danger" id="deleteBtn">刪除任務</button>　　　　　　　　

　　　
            <button class="btn-confirm" onclick="closeModal('detailModal')">完成

</button>
        </div>
        <h2 id="detailTitle"></h2>
        <div id="studentGrid" class="student-grid scroll-box"></div>
    </div>
</div>

<div id="studentReportModal" class="modal">
    <div class="modal-content modal-full dynamic-size" id="reportModalContent">
        <div class="modal-header-btns"><button class="nav-btn" onclick="closeModal

('studentReportModal')">關閉</button></div>
        <div class="report-header-left">
            <h2>個人任務查詢</h2>
            <select id="reportStudentSelect" class="select-short" 

onchange="generateStudentReport()"></select>
        </div>
        <div style="margin: 10px 0; padding: 10px; background: rgba(0,0,0,0.05); border-radius: 8px;">
    查詢類型：
    <select id="reportFilter" onchange="generateStudentReport()" style="padding:5px; border-radius:5px;">
        <option value="undone">未完成 (未點選者)</option>
        </select>
</div>
        <div id="reportResult" class="scroll-box"></div>
    </div>
</div>

<div id="totalListModal" class="modal">
    <div class="modal-content modal-full dynamic-size" id="totalModalContent">
        <div class="modal-header-btns">
            <button class="nav-btn" onclick="copyTotalList()">複製名單</button>
            <button class="nav-btn" onclick="closeModal('totalListModal')">關閉</button>
        </div>
        <h2>總清點名單(點選任務名稱進行圈選)</h2>
        <div id="totalListContent" class="scroll-box"></div>
    </div>
</div>

<style>
#busuanzi_container_page_pv {
    color: #888;
    font-size: 0.9rem;
    margin-left: 15px; /* 與左邊文字隔開 */
    border-left: 1px solid rgba(128, 128, 128, 0.5); /* 加一條細細的分隔線 */
    padding-left: 15px;
}

#busuanzi_value_page_pv {
    color: #00b894;
    font-weight: bold;
}
</style>

<script>
(function() {
    // 這樣無論是 /web/ 還是 /web 都會統一變成 /web 
    const path = window.location.pathname.replace(/\/$/, ""); 
    const TIME_KEY = `VERCOUNT_TIME_${path}`; // 每個分頁獨立計算冷卻時間
    const VAL_KEY = `VERCOUNT_VAL_${path}`;   // 每個分頁獨立存儲 PV 數
    
    const COOL_DOWN = 30 * 60 * 1000; 
    const now = Date.now();
    const lastVisit = localStorage.getItem(TIME_KEY);
    
    // 計算剩餘秒數
    const timeLeft = lastVisit ? Math.ceil((parseInt(lastVisit) + COOL_DOWN - now) / 1000) : 0;

    if (timeLeft <= 0) {
        console.log(`%c[Vercount]%c 路徑 ${path} 冷卻結束，更新數據...`, "color:#00b894;font-weight:bold", "color:inherit");
        
        const script = document.createElement('script');
        script.src = "https://events.vercount.one/js";
        script.defer = true;
        
        script.onload = () => {
            setTimeout(() => {
                const pvVal = document.getElementById('busuanzi_value_page_pv')?.innerText;
                if (pvVal) {
                    localStorage.setItem(VAL_KEY, pvVal);
                    localStorage.setItem(TIME_KEY, now); // 成功抓到才更新時間
                }
            }, 1500);
        };
        document.head.appendChild(script);
    } else {
        const lastVal = localStorage.getItem(VAL_KEY) || "--";
        console.log(`%c[Vercount]%c ${path} 冷卻中（剩 ${timeLeft} 秒）。顯示舊值：${lastVal}`, "color:#f1c40f;font-weight:bold", "color:inherit");

        window.addEventListener('load', () => {
            const pvSpan = document.getElementById('busuanzi_value_page_pv');
            if (pvSpan) pvSpan.innerText = lastVal;
        });
    }
})();
</script>

</body>
</html>
