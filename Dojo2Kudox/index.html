<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dojo2Kudox 資料轉換</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
    // 1. 版本控制
    const APP_VER = "1.00f";

    // 2. 資源清單：要增減檔案改這裡即可，不需要請刪除或註解即可
    const resources = {
        styles: [
            "style.css"
        ], 
        scripts: [
            "../counter.js",
            "script.js"
        ]
    };

    // --- 立即隱藏頁面 ---
    document.documentElement.style.visibility = 'hidden';

    /**
     * 核心邏輯：將資源標籤注入到 <head>
     */
    function injectResource(type, url, onCssLoaded) {
        const isCSS = type === 'css';
        const el = document.createElement(isCSS ? 'link' : 'script');
        const attr = isCSS ? 'href' : 'src';
        
        if (isCSS) {
            el.rel = 'stylesheet';
        } else {
            el.async = false;
        }

        el[attr] = `${url}?ver=${APP_VER}`;
        
        el.onload = () => {
            console.log(`%c[已載入] ${type.toUpperCase()}: ${url}`, "color: #00b894");
            // 若為 CSS，載入成功後執行進度檢查
            if (isCSS && onCssLoaded) onCssLoaded();
        };

        el.onerror = () => {
            console.error(`[載入失敗] ${url}`);
            // 若為 CSS，即便失敗也要解鎖，避免畫面永久白屏
            if (isCSS && onCssLoaded) onCssLoaded();
        };

        document.head.appendChild(el);
    }

    /**
     * 主程序：解析配置並執行載入
     */
    function loadApp() {
        console.log(`%c[Loader] 開始初始化資源 (版本: ${APP_VER})`, "color: #3498db; font-weight: bold;");

        const cssList = resources.styles || [];
        let cssLoadedCount = 0;

        // 【新增】檢查 CSS 載入進度
        const checkCssProgress = () => {
            cssLoadedCount++;
            if (cssLoadedCount >= cssList.length) {
                document.documentElement.style.visibility = 'visible';
                console.log("%c[Display] 樣式套用完成，解除頁面鎖定", "color: #9b59b6; font-weight: bold;");
            }
        };

        // 如果完全沒有 CSS，直接顯示
        if (cssList.length === 0) {
            document.documentElement.style.visibility = 'visible';
        }

        // 執行載入
        const configs = [
            { data: cssList, type: 'css', label: 'CSS' },
            { data: resources.scripts, type: 'js', label: 'JS' }
        ];

        configs.forEach(config => {
            if (config.data && config.data.length > 0) {
                config.data.forEach(url => {
                    // 只有 CSS 傳入回調函式
                    injectResource(config.type, url, config.type === 'css' ? checkCssProgress : null);
                });
            } else {
                console.log(`%c[Notice] 無外部 ${config.label} 資源需要載入`, "color: #e67e22");
            }
        });
    }

    // 啟動！
    loadApp();
</script>
</head>
<body>
    <div class="container">
        <header>
            <h1>酷多搬家助手</h1>
            <p>無痛將 ClassDojo 資料轉化為 ClassKudox 格式</p>
        </header>

        <section class="config-section">
            <div class="input-group">
                <label for="className">匯入班級名稱</label>
                <input type="text" id="className" placeholder="例如：六年甲班" value="我的班級">
            </div>
        </section>

        <section class="data-section">
            <div class="input-card">
                <label for="studentsData">A. 學生資料<br>請在「學生頁面」全選 -> 複製，然後在下面貼上</label>
                <textarea id="studentsData" placeholder="請貼上學生資料... (包含姓名與點數)"></textarea>
            </div>
            <div class="input-card">
                <label for="posSkillsData">B. 加分項目<br>請在「加點頁面」全選 -> 複製，然後在下面貼上</label>
                <textarea id="posSkillsData" placeholder="請貼上加分技能資料... (包含技能名稱與 + 分)"></textarea>
            </div>
            <div class="input-card">
                <label for="negSkillsData">C. 扣分項目<br>請在「扣點頁面」全選 -> 複製，然後在下面貼上</label>
                <textarea id="negSkillsData" placeholder="請貼上待加強技能資料... (包含技能名稱與 - 分)"></textarea>
            </div>
        </section>

        <div class="actions">
            <button id="convertBtn" class="primary-btn">解析並轉換下載</button>
        </div>
        
        <div id="statusMsg" class="status"></div>
    </div>
    
    <footer></footer>

</body>
</html>
