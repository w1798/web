<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dojo2Kudox 資料轉換</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        const APP_VER = "1.00f";

        function loadApp() {
            console.log(`%c[Loader] 開始載入資源 (版本: ${APP_VER})`, "color: #3498db; font-weight: bold;");

            // 1. 載入 CSS
            const link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = `style.css?ver=${APP_VER}`;
            document.head.appendChild(link);
            console.log(`%c[CSS] style.css 已標記下載`, "color: #9b59b6;");

            // 2. 定義要載入的 JS 清單
            const scripts = [
                "../counter.js", 
                "script.js"
            ];

            scripts.forEach(src => {
                const s = document.createElement('script');
                s.src = `${src}?ver=${APP_VER}`;
                s.async = false; 

                // 成功載入訊息
                s.onload = () => {
                    console.log(`%c[JS] 載入成功: ${src}`, "color: #00b894;");
                };

                // 失敗報錯訊息
                s.onerror = () => {
                    console.error(`[JS] 載入失敗!!! 請檢查路徑: ${src}`);
                };

                document.head.appendChild(s);
            });
        }

        loadApp();
    </script>
</head>
<body>
    <div class="container">
        <header>
            <h1>酷多搬家助手</h1>
            <p>無痛將 ClassDojo 資料轉化為 ClassKudox 格式</p>
        </header>

        <section class="config-section">
            <div class="input-group">
                <label for="className">匯入班級名稱</label>
                <input type="text" id="className" placeholder="例如：六年甲班" value="我的班級">
            </div>
        </section>

        <section class="data-section">
            <div class="input-card">
                <label for="studentsData">A. 學生資料<br>請在「學生頁面」全選 -> 複製，然後在下面貼上</label>
                <textarea id="studentsData" placeholder="請貼上學生資料... (包含姓名與點數)"></textarea>
            </div>
            <div class="input-card">
                <label for="posSkillsData">B. 加分項目<br>請在「加點頁面」全選 -> 複製，然後在下面貼上</label>
                <textarea id="posSkillsData" placeholder="請貼上加分技能資料... (包含技能名稱與 + 分)"></textarea>
            </div>
            <div class="input-card">
                <label for="negSkillsData">C. 扣分項目<br>請在「扣點頁面」全選 -> 複製，然後在下面貼上</label>
                <textarea id="negSkillsData" placeholder="請貼上待加強技能資料... (包含技能名稱與 - 分)"></textarea>
            </div>
        </section>

        <div class="actions">
            <button id="convertBtn" class="primary-btn">解析並轉換下載</button>
        </div>
        
        <div id="statusMsg" class="status"></div>
    </div>
    
    <footer></footer>

</body>
</html>
