<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code 專業標籤產生器</title>

<script>
    document.documentElement.style.visibility = 'hidden';

    const APP_VER = "1.00g";

    var resources = {
        libs: [
            {
                url: 'https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js'
            },
            {
                url: 'https://unpkg.com/docx@8.2.2/build/index.umd.js'
            },
            {
                url: 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js'                
            }
        ],
        styles: [
            "style.css"
        ], 
        
        scripts: [
            "../counter.js",
            "../plugins.js",
            "script.js"
        ]
    };

    const loader = document.createElement('script');
    loader.src = `../loadapp.js?ver=${APP_VER}`;
    document.head.appendChild(loader);
</script>

</head>
<body>

<div class="container">
    <div class="header-row">
        <h2>QR Code 專業標籤產生器</h2>
        <div class="btn-group-sm">
            <button class="btn-sm" onclick="exportConfig()">匯出設定</button>
            <button class="btn-sm" onclick="document.getElementById('importFile').click()">匯入設定</button>
            <button class="btn-sm btn-reset" onclick="resetConfig()">重置</button>
            <input type="file" id="importFile" style="display:none" onchange="importConfig(this)">
        </div>
    </div>

    <div class="main-layout">
        <div class="column settings-group">
            <div class="sub-section">
                <span class="section-title">版面設定</span>
                <div class="field-item"><label>橫向數量 (H):</label><select id="h_cut"></select></div>
                <div class="field-item"><label>縱向數量 (V):</label><select id="v_cut"></select></div>
                <div class="field-item">
                    <label>紙張方向:</label>
                    <select id="orientation">
                        <option value="portrait">直式 (A4)</option>
                        <option value="landscape">橫式 (A4)</option>
                    </select>
                </div>
                <div class="field-item">
                    <label>框線設定:</label>
                    <select id="border_style">
                        <option value="no-outline-dashed">虛線無外框</option>
                        <option value="no-outline-solid">實線無外框</option>
                        <option value="dashed">虛線</option>
                        <option value="solid">實線</option>
                        <option value="none">無線</option>
                    </select>
                </div>
                <div class="field-item"><label>邊界大小 (cm):</label><input type="number" id="margin_cm" value="0.2" step="0.1"></div>
            </div>

            <div class="sub-section">
                <span class="section-title">排列與對齊</span>
                <div class="field-item">
                    <label>排列方式:</label>
                    <select id="layout_style">
                        <option value="top-down">圖在上</option>
                        <option value="bottom-up">圖在下</option>
                        <option value="left-right">圖在左</option>
                        <option value="right-left">圖在右</option>
                    </select>
                </div>
                <div class="field-item">
                    <label>垂直對齊:</label>
                    <select id="v_align">
                        <option value="center" selected>置中</option>
                        <option value="top">靠上</option>
                        <option value="bottom">靠下</option>
                    </select>
                </div>
                <div class="field-item">
                    <label>水平對齊:</label>
                    <select id="h_align">
                        <option value="center" selected>置中</option>
                        <option value="left">靠左</option>
                        <option value="right">靠右</option>
                    </select>
                </div>
            </div>

            <div class="sub-section">
                <span class="section-title">樣式設定</span>
                <div class="field-item"><label>字體大小 (pt):</label><input type="number" id="font_size" value="10" step="0.5"></div>
                <div class="field-item"><label>行距設定 (pt):</label><input type="number" id="line_spacing" value="14" step="0.5"></div>
                <div class="field-item"><label>QR碼大小 (cm):</label><input type="number" id="qr_size_cm" value="2.5" step="0.1"></div>

                <div class="field-item">
                    <label>補償值 (DXA):</label>
                    <input type="number" id="offset_dxa" value="240">
                    <div class="hint">若表格溢出至第二頁，請調大此值。240 DXA ≒ 0.42cm。</div>
                </div>
            </div>
        </div>

        <div class="column content-area">
            <span class="section-title">文字內容區</span>
            <div class="field-item">
                <label>中心文字 (Caption):</label>
                <input type="text" id="caption" value="Nextime 網頁程式集">
            </div>
            <div class="field-item">
                <label>網址 (URL):</label>
                <input type="text" id="url" value="https://w1798.github.io/web">
            </div>
            <div class="field-item">
                <label>說明內容 (Subject):</label>
                <textarea id="subject" rows="7">支援圖文上下或左右並排&#10;自定尺寸、字體大小&#10;適配各種規格的標籤紙</textarea>
            </div>
            <button id="generate" onclick="mainProcess()">產生並下載 .docx 檔案</button>
            <div id="status"></div>
        </div>
    </div>
     <footer></footer>
</div> 
<div id="qr-hidden" style="display:none"></div>
<canvas id="canvas-buffer" style="display:none"></canvas>


</body>
</html>
