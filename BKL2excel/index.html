<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博客來書單一鍵轉</title>
<script>
    // 1. 版本控制
    const APP_VER = "1.00f";

    // 2. 資源清單：要增減檔案改這裡即可，不需要請刪除或註解即可
    const resources = {
        styles: [
            "style.css"
        ], 
        scripts: [
            "../counter.js",
            "script.js"
        ]
    };

    // --- 立即隱藏頁面 ---
    document.documentElement.style.visibility = 'hidden';

    /**
     * 核心邏輯：將資源標籤注入到 <head>
     */
    function injectResource(type, url, onCssLoaded) {
        const isCSS = type === 'css';
        const el = document.createElement(isCSS ? 'link' : 'script');
        const attr = isCSS ? 'href' : 'src';
        
        if (isCSS) {
            el.rel = 'stylesheet';
        } else {
            el.async = false;
        }

        el[attr] = `${url}?ver=${APP_VER}`;
        
        el.onload = () => {
            console.log(`%c[已載入] ${type.toUpperCase()}: ${url}`, "color: #00b894");
            // 若為 CSS，載入成功後執行進度檢查
            if (isCSS && onCssLoaded) onCssLoaded();
        };

        el.onerror = () => {
            console.error(`[載入失敗] ${url}`);
            // 若為 CSS，即便失敗也要解鎖，避免畫面永久白屏
            if (isCSS && onCssLoaded) onCssLoaded();
        };

        document.head.appendChild(el);
    }

    /**
     * 主程序：解析配置並執行載入
     */
    function loadApp() {
        console.log(`%c[Loader] 開始初始化資源 (版本: ${APP_VER})`, "color: #3498db; font-weight: bold;");

        const cssList = resources.styles || [];
        let cssLoadedCount = 0;

        // 【新增】檢查 CSS 載入進度
        const checkCssProgress = () => {
            cssLoadedCount++;
            if (cssLoadedCount >= cssList.length) {
                document.documentElement.style.visibility = 'visible';
                console.log("%c[Display] 樣式套用完成，解除頁面鎖定", "color: #9b59b6; font-weight: bold;");
            }
        };

        // 如果完全沒有 CSS，直接顯示
        if (cssList.length === 0) {
            document.documentElement.style.visibility = 'visible';
        }

        // 執行載入
        const configs = [
            { data: cssList, type: 'css', label: 'CSS' },
            { data: resources.scripts, type: 'js', label: 'JS' }
        ];

        configs.forEach(config => {
            if (config.data && config.data.length > 0) {
                config.data.forEach(url => {
                    // 只有 CSS 傳入回調函式
                    injectResource(config.type, url, config.type === 'css' ? checkCssProgress : null);
                });
            } else {
                console.log(`%c[Notice] 無外部 ${config.label} 資源需要載入`, "color: #e67e22");
            }
        });
    }

    // 啟動！
    loadApp();
</script>
</head>
<body>

<div class="app-main">
    <div class="container">
        <h2>博客來書單一鍵轉 (<small>支援 金石堂 誠品</small>) <span id="count" class="count-badge">0</span></h2>
        
        <div class="step-box">
            <div><span class="step-num">1</span> 在「博客來」點進書籍的頁面，按下 <b>Ctrl + A</b> 全選，再按 <b>Ctrl + C</b> 複製。</div>
        </div>

        <div class="toolbar">
            <span class="step-num">2</span>
            <button class="btn-paste" onclick="pasteAndProcess()">按我貼上並分析資料</button> (請回上一步繼續複製其他書的內容)
        </div>

        <div class="toolbar" style="border-top: 1px dashed #ccc; padding-top: 15px;">
            <span class="step-num">3</span>
            <button class="btn-copy" onclick="downloadXLSX()" style="background: #217346;">下載 .xlsx 檔</button> 或
            <button class="btn-copy" onclick="copyAllToExcel(true)">複製 Excel 格式</button>
            <button class="btn-copy" onclick="copyAllToExcel(false)" style="background: #BEBEBE;">(備用)複製無引號版</button>
            <span class="step-num">4</span>
            <button class="btn-reset" onclick="resetAllData()">重置所有資料</button>
            <span id="statusMsg" class="msg"></span>
        </div>

        <div id="resultArea">
            <table id="resultTable">
                <thead>
                    <tr>
                        <th>書名</th><th>出版社</th><th>單位</th><th>數量</th><th>售價</th><th>著者</th><th>出版日期</th><th>ISBN</th><th>操作</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>

        <footer></footer>
    </div>
</div>

<button id="backToTop" onclick="scrollToTop()" title="回到頂部">↑</button>



</body>
</html>
