<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博客來書單一鍵轉</title>
    <script>
        const APP_VER = "1.00b";

        function loadApp() {
            console.log(`%c[Loader] 開始載入資源 (版本: ${APP_VER})`, "color: #3498db; font-weight: bold;");

            // 1. 載入 CSS
            const link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = `style.css?ver=${APP_VER}`;
            document.head.appendChild(link);
            console.log(`%c[CSS] style.css 已標記下載`, "color: #9b59b6;");

            // 2. 定義要載入的 JS 清單
            const scripts = [
                "../counter.js", 
                "script.js"
            ];

            scripts.forEach(src => {
                const s = document.createElement('script');
                s.src = `${src}?ver=${APP_VER}`;
                s.async = false; 

                // 成功載入訊息
                s.onload = () => {
                    console.log(`%c[JS] 載入成功: ${src}`, "color: #00b894;");
                };

                // 失敗報錯訊息
                s.onerror = () => {
                    console.error(`[JS] 載入失敗!!! 請檢查路徑: ${src}`);
                };

                document.head.appendChild(s);
            });
        }

        loadApp();
    </script>
</head>
<body>

<div class="app-main">
    <div class="container">
        <h2>博客來書單一鍵轉 (<small>支援 金石堂 誠品</small>) <span id="count" class="count-badge">0</span></h2>
        
        <div class="step-box">
            <div><span class="step-num">1</span> 在「博客來」點進書籍的頁面，按下 <b>Ctrl + A</b> 全選，再按 <b>Ctrl + C</b> 複製。</div>
        </div>

        <div class="toolbar">
            <span class="step-num">2</span>
            <button class="btn-paste" onclick="pasteAndProcess()">按我貼上並分析資料</button> (請回上一步繼續複製其他書的內容)
        </div>

        <div class="toolbar" style="border-top: 1px dashed #ccc; padding-top: 15px;">
            <span class="step-num">3</span>
            <button class="btn-copy" onclick="downloadXLSX()" style="background: #217346;">下載 .xlsx 檔</button> 或
            <button class="btn-copy" onclick="copyAllToExcel(true)">複製 Excel 格式</button>
            <button class="btn-copy" onclick="copyAllToExcel(false)" style="background: #BEBEBE;">(備用)複製無引號版</button>
            <span class="step-num">4</span>
            <button class="btn-reset" onclick="resetAllData()">重置所有資料</button>
            <span id="statusMsg" class="msg"></span>
        </div>

        <div id="resultArea">
            <table id="resultTable">
                <thead>
                    <tr>
                        <th>書名</th><th>出版社</th><th>單位</th><th>數量</th><th>售價</th><th>著者</th><th>出版日期</th><th>ISBN</th><th>操作</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>

        <footer></footer>
    </div>
</div>

<button id="backToTop" onclick="scrollToTop()" title="回到頂部">↑</button>



</body>
</html>
