<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>博客來書單一鍵轉</title>
    <!-- 引入 ExcelJS (支援精細格式如置中、框線、寬度設定) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <style>
        :root {
            --primary-color: #007bff;
            --success-color: #28a745;
            --danger-color: #d32f2f;
            --info-color: #607d8b;
        }

        body { font-family: "Microsoft JhengHei", sans-serif; background: #f0f2f5; margin: 0; padding: 0; color: #333; }
        
        /* 主操作視窗設定 */
        .app-main { 
            height: 100vh; 
            overflow-y: auto; 
            padding: 20px; 
            box-sizing: border-box; 
            scroll-behavior: smooth;
        }

        .container { max-width: 1000px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); position: relative; }
        
        h2 { border-left: 6px solid #e52222; padding-left: 15px; margin-bottom: 25px; color: #2c3e50; }
        
        /* 步驟樣式 */
        .step-box { background: #fff9db; border-left: 4px solid #fcc419; padding: 15px; margin-bottom: 20px; border-radius: 4px; }
        .step-num { display: inline-block; background: #e52222; color: white; width: 24px; height: 24px; border-radius: 50%; text-align: center; line-height: 24px; font-weight: bold; margin-right: 8px; }

        textarea { width: 100%; height: 150px; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; box-sizing: border-box; background: #fafafa; transition: border 0.3s; }
        textarea:focus { border-color: var(--primary-color); outline: none; }
        
        .toolbar { margin: 15px 0; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; padding-left: 15px; }
        
        button { padding: 10px 20px; font-size: 15px; font-weight: bold; cursor: pointer; border: none; border-radius: 6px; transition: 0.2s; display: flex; align-items: center; gap: 6px; }
        .btn-paste { background: var(--info-color); color: white; }
        .btn-clear { background: #9e9e9e; color: white; }
        .btn-parse { background: var(--primary-color); color: white; }
        .btn-copy { background: var(--success-color); color: white; }
        .btn-reset { background: var(--danger-color); color: white; }
        
        button:hover { opacity: 0.85; transform: translateY(-1px); }
        button:active { transform: translateY(1px); }

        /* 表格樣式 */
        #resultArea { margin-top: 30px; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 10px; background: white; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background: #f8f9fa; position: sticky; top: -21px; z-index: 10; box-shadow: 0 2px 2px -1px rgba(0,0,0,0.1); }
        tr:nth-child(even) { background-color: #fafafa; }
        
        .msg { color: var(--success-color); font-weight: bold; margin-left: 10px; animation: fadeIn 0.3s; }
        .count-badge { background: #777777; color: white; padding: 2px 10px; border-radius: 20px; font-size: 14px; margin-left: 10px; }

        /* 頁尾 */
        footer { margin-top: 40px; padding: 20px; text-align: center; font-size: 14px; color: #777; border-top: 1px solid #eee; }
        footer a { color: #555; text-decoration: none; font-weight: bold; }
        footer a:hover { text-decoration: underline; }

        /* 回到頂部按鈕 */
        #backToTop {
            position: fixed; bottom: 30px; right: 30px;
            width: 50px; height: 50px; background: #2c3e50; color: white;
            border: none; border-radius: 50%; cursor: pointer;
            font-size: 24px; display: none; /* 初始隱藏 */
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 100; transition: opacity 0.3s;
        }
        #backToTop.show { display: block; animation: fadeIn 0.3s; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div class="app-main">
    <div class="container">
        <h2>博客來書單一鍵轉 (支援 金石堂 誠品) <span id="count" class="count-badge">0</span></h2>
        
        <div class="step-box">
            <div><span class="step-num">1</span> 在「博客來」點進書籍的頁面，按下 <b>Ctrl + A</b> 全選，再按 <b>Ctrl + C</b> 複製。</div>
        </div>

        <div class="toolbar">
            <span class="step-num">2</span>
            <button class="btn-paste" onclick="pasteAndProcess()">按我貼上並分析資料</button> (請回上一步繼續複製其他書的內容)
        </div>

        <div class="toolbar" style="border-top: 1px dashed #ccc; padding-top: 15px;">
            <span class="step-num">3</span>
            <button class="btn-copy" onclick="downloadXLSX()" style="background: #217346;">下載 .xlsx 檔</button> 或
            <button class="btn-copy" onclick="copyAllToExcel(true)">複製 Excel 格式</button>
            <button class="btn-copy" onclick="copyAllToExcel(false)" style="background: var(--info-color);">(備用)複製無引號版</button>
            <span class="step-num">4</span>
            <button class="btn-reset" onclick="resetAllData()">重置所有資料</button>
            <span id="statusMsg" class="msg"></span>
        </div>

        <div id="resultArea">
            <table id="resultTable">
                <thead>
                    <tr>
                        <th>書名</th><th>出版社</th><th>單位</th><th>數量</th><th>售價</th><th>著者</th><th>出版日期</th><th>ISBN</th><th>操作</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>

        <footer>
          <a href="https://w1798.github.io/web/" target="_blank">&copy; 2026<script>const y=new Date().getFullYear(); if(y>2026)document.write("-"+y);</script> Charles Nextime</a> · 
          <a href="https://www.gnu.org/licenses/gpl-3.0.html" target="_blank">GPLv3</a>
          <span id="busuanzi_container_page_pv">
    本頁使用量 <span id="busuanzi_value_page_pv"></span> 次
</span>
        </footer>
    </div>
</div>

<button id="backToTop" onclick="scrollToTop()" title="回到頂部">↑</button>

<script>
    const STORAGE_KEY = 'books_data_list';
    const mainArea = document.querySelector('.app-main');
    const backToTopBtn = document.getElementById('backToTop');
    let booksList = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

    // 初始化讀取
    window.onload = renderTable;

    // 捲動偵測
    mainArea.addEventListener('scroll', () => {
        if (mainArea.scrollTop > 300) {
            backToTopBtn.classList.add('show');
        } else {
            backToTopBtn.classList.remove('show');
        }
    });

    function scrollToTop() {
        mainArea.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function pasteAndProcess() {
        try {
            const text = await navigator.clipboard.readText();
            if (!text.trim()) { alert("剪貼簿內沒有資料可供讀取！"); return; }
            processData(text);
        } catch (err) {
            alert("瀏覽器不允許自動讀取剪貼簿，請確定網頁有權限或環境支援");
        }
    }

    function resetAllData() {
        if (confirm("確定要刪除所有已儲存的書籍資料嗎？(這將清空所有紀錄)")) {
            localStorage.removeItem(STORAGE_KEY);
            booksList = [];
            renderTable();
            showStatus("資料已重置");
        }
    }

    function deleteRow(index) {
        if (confirm("確定要刪除這筆資料嗎？")) {
            booksList.splice(index, 1);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(booksList));
            renderTable();
            showStatus("已刪除該筆資料");
        }
    }

    function processData(raw) {
        const lines = raw.split('\n').map(l => l.trim()).filter(l => l !== "");
        let isBKL = raw.includes("博客來") || lines.some(l => l.includes("!上頁"));
        let isKing = raw.includes("金石堂") || lines.includes("售票") || lines.includes("左箭右箭");
        let isEslite = raw.includes("誠品") || raw.includes("誠名") || (lines.includes("作") && lines.some(l => l === "者："));
        
        let title = null;

        // 1. 優先處理具有強特徵的標記
        const navIndex = lines.findIndex(l => l.includes("!上頁"));
        const arrowIdx = lines.findIndex(l => l === "左箭右箭");
        const authorSepIdx = lines.findIndex(l => l === "者：");
        const ticketIdx = lines.findIndex(l => l === "售票");
        const esliteExIdx = lines.findIndex(l => l === "誠品獨家");
        const authorLineIdx = lines.findIndex(l => l.startsWith("作者：") || l.startsWith("作者:"));

        if (navIndex > 0) {
            title = lines[navIndex - 1];
        } else if (arrowIdx >= 2) {
            title = lines[arrowIdx - 2];
        } else if (authorSepIdx >= 3 && lines[authorSepIdx - 1] === "作") {
            title = lines[authorSepIdx - 3];
            if (title === "誠品獨家" && authorSepIdx >= 2) title = lines[authorSepIdx - 2];
        } else if (authorLineIdx >= 1) {
            let i = authorLineIdx - 1;
            while (i >= 0) {
                const l = lines[i];
                const isRating = l.startsWith("(") && l.endsWith(")") && /^\(\d+(\.\d+)?\)$/.test(l);
                const isVersion = l.startsWith("平裝") || l.startsWith("電子書") || l.startsWith("精裝");
                if (isVersion || l === "看相關系列" || l === "主題活動試閱" ||
                    l.includes("優惠價") || l.includes("定價") || 
                    l.includes("可購買版本") || isRating ||
                    (l.length > 0 && !/[\u4e00-\u9fa5]/.test(l))) {
                    i--;
                    continue;
                }
                break;
            }
            if (i >= 0) title = lines[i];
        } else if (ticketIdx >= 0 && ticketIdx + 2 < lines.length) {
            title = lines[ticketIdx + 2];
        }

        // 2. 如果都沒有強特徵，再找關鍵字行
        if (!title) {
            const titleLine = lines.find(l => l.startsWith("書名 :") || l.startsWith("書名："));
            if (titleLine) {
                title = titleLine.replace(/^書名[\s:：]+/, "");
            } else {
                const authorLineIdx = lines.findIndex(l => l.startsWith("作者："));
                if (authorLineIdx >= 1) {
                    let i = authorLineIdx - 1;
                    while (i >= 0) {
                        const l = lines[i];
                        const isRating = l.startsWith("(") && l.endsWith(")") && /^\(\d+(\.\d+)?\)$/.test(l);
                        const isVersion = l.startsWith("平裝") || l.startsWith("電子書") || l.startsWith("精裝");
                        if (isVersion || l === "看相關系列" || l === "主題活動試閱" ||
                            l.includes("優惠價") || l.includes("定價") || 
                            l.includes("可購買版本") || isRating ||
                            (l.length > 0 && !/[\u4e00-\u9fa5]/.test(l))) {
                            i--;
                            continue;
                        }
                        break;
                    }
                    if (i >= 0) title = lines[i];
                }
            }
        }
        
        title = title || "未知書名";

        let publisher = extract(raw, /出版社：\s*([^\n<]+)/);
        if (!publisher) {
            const idx = lines.findIndex(l => l === "社：");
            if (idx >= 2 && lines[idx - 1] === "版" && lines[idx - 2] === "出") {
                publisher = lines[idx + 1];
            }
        }

        let price = extract(raw, /定價：\s*(\d+)/);
        if (!price) {
            const paperIdx = lines.findIndex(l => l === "紙本書");
            if (paperIdx >= 0 && paperIdx + 2 < lines.length) {
                price = lines[paperIdx + 2];
            } else {
                const idx = lines.findIndex(l => l === "數量");
                if (idx >= 1 && lines[idx - 1] === "回饋" && idx + 3 < lines.length) {
                    price = lines[idx + 3];
                } else {
                    const kingIdx = lines.findIndex(l => l.includes("金石堂金幣"));
                    if (kingIdx >= 1) {
                        for (let j = 1; j <= 4; j++) {
                            if (kingIdx - j >= 0) {
                                const priceLine = lines[kingIdx - j];
                                const numMatches = priceLine.match(/(\d+)(?=元)/g);
                                if (numMatches) {
                                    price = numMatches[numMatches.length - 1];
                                    break;
                                }
                            }
                        }
                    }
                }
            }
        }

        let author = extract(raw, /(?:作者|編者)：\s*([^\n<]+)/);
        if (!author) {
            const idx = lines.findIndex(l => l === "者：");
            if (idx >= 1 && (lines[idx - 1] === "作" || lines[idx - 1] === "編")) {
                author = lines[idx + 1];
            }
        }

        let pubDate = extract(raw, /(?:出版日期|出版年份|出版日)：\s*([^\n<]+)/);
        if (!pubDate) {
            const idx = lines.findIndex(l => l === "期：");
            if (idx >= 3 && lines[idx - 1] === "日" && lines[idx - 2] === "版" && lines[idx - 3] === "出") {
                pubDate = lines[idx + 1];
            }
        }

        let isbn = extract(raw, /(?:ISBN13\s*\/|EAN貨碼\s*\/|ISBN[：:]?)\s*([\d\-xX]{9,})/i);
        if (isbn) isbn = isbn.replace(/-/g, '');

        const clean = s => (s || "").replace(/[\s]*追蹤/g, '').trim();

        const book = {
            title: clean(title) || "未知書名",
            publisher: clean(publisher),
            unit: "本",
            count: 1,
            price: clean(price),
            author: clean(author),
            pubDate: clean(pubDate),
            isbn: clean(isbn)
        };

        if (book.isbn && booksList.some(b => b.isbn === book.isbn)) {
            alert(`已跳過！清單中已存在相同 ISBN 的書籍。\n書名：${book.title}\nISBN：${book.isbn}`);
            return;
        }

        booksList.unshift(book);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(booksList));
        
        renderTable();
        showStatus("已解析並加入清單！");
    }

    function renderTable() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = booksList.map((data, index) => `
            <tr>
                <td>${data.title}</td><td>${data.publisher}</td><td>${data.unit}</td>
                <td>${data.count}</td><td>${data.price}</td><td>${data.author}</td>
                <td>${data.pubDate}</td><td>${data.isbn}</td>
                <td><button onclick="deleteRow(${index})" style="padding: 6px 12px; font-size: 13px; background: var(--danger-color); color: white;">刪除</button></td>
            </tr>
        `).join('');
        document.getElementById('count').innerText = booksList.length;
    }

    function extract(text, regex) {
        const match = text.match(regex);
        return match ? match[1].trim() : "";
    }

    function copyAllToExcel(forceText) {
        if (booksList.length === 0) return alert("目前清單內沒有資料可複製");
        
        const output = booksList.map(data => {
            if (forceText) {
                const q = (str) => `"${str || ''}"`;
                return `${q(data.title)}\t${q(data.publisher)}\t${q(data.unit)}\t${q(data.count)}\t${q(data.price)}\t${q(data.author)}\t${q(data.pubDate)}\t${q(data.isbn)}`;
            } else {
                return `${data.title}\t${data.publisher}\t${data.unit}\t${data.count}\t${data.price}\t${data.author}\t${data.pubDate}\t${data.isbn}`;
            }
        }).join('\n');

        navigator.clipboard.writeText(output).then(() => {
            showStatus("✅ 已複製全部 " + booksList.length + " 筆資料，請至 Excel 貼上");
        });
    }

    async function downloadXLSX() {
        if (booksList.length === 0) return alert("目前清單內沒有資料可匯出");

        const workbook = new ExcelJS.Workbook();
        const sheet = workbook.addWorksheet('圖書清單');

        // B、I欄2.5倍寬 (以基礎寬度10衡量，即為25)
        // C、G、H 1.5倍寬 (約15)
        // 其他 1倍 (10)
        sheet.columns = [
            { header: '優先順序', key: 'idx',       width: 10 },
            { header: '書名',     key: 'title',     width: 25 },
            { header: '出版社',   key: 'publisher', width: 15 },
            { header: '單位',     key: 'unit',      width: 10 },
            { header: '數量',     key: 'count',     width: 10 },
            { header: '售價',     key: 'price',     width: 10 },
            { header: '著者',     key: 'author',    width: 15 },
            { header: '出版日期', key: 'pubDate',   width: 15 },
            { header: 'ISBN',     key: 'isbn',      width: 25 }
        ];

        booksList.forEach((data, index) => {
            sheet.addRow({
                idx: index + 1,
                title: data.title,
                publisher: data.publisher,
                unit: data.unit,
                count: data.count,
                price: data.price,
                author: data.author,
                pubDate: data.pubDate,
                isbn: data.isbn
            });
        });

        // 樣式調整: 內容置中與單框線
        sheet.eachRow((row, rowNumber) => {
            row.eachCell((cell, colNumber) => {
                cell.alignment = { horizontal: 'center', vertical: 'middle' };
                cell.border = {
                    top: {style:'thin'},
                    left: {style:'thin'},
                    bottom: {style:'thin'},
                    right: {style:'thin'}
                };
                if (colNumber === 9 && rowNumber > 1) { // 確保 ISBN 儲存格以文字型式解釋
                    cell.numFmt = '@';
                }
            });
        });

        // 匯出 buffer 下載
        const buffer = await workbook.xlsx.writeBuffer();
        const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = "圖書館圖書補充調查表.xlsx";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        
        showStatus("✅ 已下載 XLSX 檔案");
    }

    function showStatus(text) {
        const msg = document.getElementById('statusMsg');
        msg.innerText = text;
        msg.style.display = 'inline';
        setTimeout(() => { msg.style.display = 'none'; }, 3000);
    }
</script>


<style>
#busuanzi_container_page_pv {
    color: #888;
    font-size: 0.9rem;
    margin-left: 15px;
    border-left: 1px solid rgba(128, 128, 128, 0.5); /* 計數器加一條細細的分隔線 */
    padding-left: 15px;
}

#busuanzi_value_page_pv {
    color: #00b894;
    font-weight: bold;
}
</style>


<script>
(function() {
    // return; // 取消此行可停止計數，直接在這裡回傳，後面的代碼完全不執行

    // 計數器這樣無論是 /web/ 還是 /web 都會統一變成 /web 
    const path = window.location.pathname.replace(/\/$/, ""); 
    const TIME_KEY = `VERCOUNT_TIME_${path}`; // 每個分頁獨立計算冷卻時間
    const VAL_KEY = `VERCOUNT_VAL_${path}`;   // 每個分頁獨立存儲 PV 數
    
    const COOL_DOWN = 30 * 60 * 1000; 
    const now = Date.now();
    const lastVisit = localStorage.getItem(TIME_KEY);
    
    // 計算剩餘秒數
    const timeLeft = lastVisit ? Math.ceil((parseInt(lastVisit) + COOL_DOWN - now) / 1000) : 0;

    if (timeLeft <= 0) {
        console.log(`%c[Vercount]%c 路徑 ${path} 冷卻結束，更新數據...`, "color:#00b894;font-weight:bold", "color:inherit");
        
        const script = document.createElement('script');
        script.src = "https://events.vercount.one/js";
        script.defer = true;
        
        script.onload = () => {
            setTimeout(() => {
                const pvVal = document.getElementById('busuanzi_value_page_pv')?.innerText;
                if (pvVal) {
                    localStorage.setItem(VAL_KEY, pvVal);
                    localStorage.setItem(TIME_KEY, now); // 成功抓到才更新時間
                }
            }, 1500);
        };
        document.head.appendChild(script);
    } else {
        const lastVal = localStorage.getItem(VAL_KEY) || "--";
        console.log(`%c[Vercount]%c ${path} 冷卻中（剩 ${timeLeft} 秒）。顯示舊值：${lastVal}`, "color:#f1c40f;font-weight:bold", "color:inherit");

        window.addEventListener('load', () => {
            const pvSpan = document.getElementById('busuanzi_value_page_pv');
            if (pvSpan) pvSpan.innerText = lastVal;
        });
    }
})();
</script>

</body>
</html>
