<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>專業JSON編輯器 be Charles Nextime</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        /* 核心置底關鍵：讓 body 變為 flex 容器 */
        body { 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
        }
        /* 讓內容區自動撐開，填滿剩餘空間 */
        main { flex: 1; }
        
        .drag-handle { cursor: grab; }
        .drag-handle:active { cursor: grabbing; }
        .ghost { border: 2px dashed #6366f1; background: #f5f3ff; opacity: 0.5; }
        textarea { resize: vertical; min-height: 40px; }
    </style>
</head>
<body class="bg-slate-100 font-sans text-slate-900">

    <nav class="bg-slate-900 text-white p-4 sticky top-0 z-50 shadow-xl flex justify-between items-center">
        <h1 class="font-bold text-indigo-400 flex items-center gap-2">
            💎 專業JSON編輯器 
            <span id="fileType" class="text-[10px] bg-slate-800 px-2 py-1 rounded text-slate-400 font-normal ml-2">等待匯入</span>
        </h1>
        <div class="flex gap-3">
            <input type="file" id="fileInput" accept=".json" class="hidden">
            <button onclick="document.getElementById('fileInput').click()" class="bg-slate-700 hover:bg-slate-600 px-5 py-2 rounded-lg text-sm transition">匯入檔案</button>
            <button onclick="exportJSON()" class="bg-indigo-600 hover:bg-indigo-500 px-5 py-2 rounded-lg text-sm transition font-bold shadow-lg shadow-indigo-500/30">儲存並匯出</button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-6 w-full" id="mainCanvas">
        <div class="text-center py-32 text-slate-400 border-4 border-dashed rounded-3xl bg-white/50 border-slate-200">
            請點擊「匯入檔案」按鈕開始編輯。
        </div>
    </main>

    <footer class="footer-bar flex flex-col justify-center items-center p-0 bg-slate-900 border-t border-slate-800 gap-0">
        <div class="author-info">
            <a href="https://w1798.github.io/web/" target="_blank" class="author-link text-slate-400 hover:text-indigo-400 text-sm transition">
                Completed by Charles Nextime with AI assistance, 20260126
            </a>


            <span id="busuanzi_container_page_pv">
                本頁閱讀量 <span id="busuanzi_value_page_pv"></span> 次
            </span>
        </div>
    </footer>

    <script>
        let rawData = {};

        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    rawData = JSON.parse(event.target.result);
                    document.getElementById('fileType').innerText = file.name;
                    renderMaster();
                } catch(err) { alert("JSON 格式錯誤！"); }
            };
            reader.readAsText(file);
        });

        function renderMaster() {
            const canvas = document.getElementById('mainCanvas');
            canvas.innerHTML = '';

            Object.keys(rawData).forEach(key => {
                const data = rawData[key];
                const section = document.createElement('section');
                section.className = "mb-10";
                section.dataset.sectionKey = key;
                section.innerHTML = `
                    <div class="flex items-center gap-3 mb-4">
                        <div class="h-6 w-1.5 bg-indigo-500 rounded-full"></div>
                        <h2 class="text-xl font-black text-slate-800 uppercase tracking-tighter">${key}</h2>
                    </div>
                    <div id="container-${key}" class="module-container grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>
                `;
                canvas.appendChild(section);
                const container = document.getElementById(`container-${key}`);

                if (typeof data === 'object' && data !== null) {
                    Object.keys(data).forEach(subKey => {
                        renderModuleCard(container, key, subKey, data[subKey]);
                    });
                    Sortable.create(container, { animation: 200, ghostClass: 'ghost', handle: '.drag-handle' });
                } else {
                    renderModuleCard(container, null, key, data, true);
                }
            });
        }

        function renderModuleCard(container, parentKey, itemKey, value, isRoot = false) {
            const card = document.createElement('div');
            card.className = "bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden hover:shadow-md transition flex flex-col";
            card.dataset.id = itemKey;

            let fieldsHTML = "";
            if (typeof value === 'object' && value !== null && !Array.isArray(value)) {
                Object.keys(value).forEach(attrKey => {
                    fieldsHTML += createField(parentKey, itemKey, attrKey, value[attrKey]);
                });
            } else {
                fieldsHTML = createField(isRoot ? null : parentKey, isRoot ? itemKey : itemKey, null, value);
            }

            card.innerHTML = `
                <div class="drag-handle bg-slate-50 p-3 border-b flex justify-between items-center">
                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">${isRoot ? 'PROP' : 'ITEM'} #${itemKey}</span>
                    <div class="text-slate-300"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 9h14M5 15h14"/></svg></div>
                </div>
                <div class="p-4 space-y-4">${fieldsHTML}</div>
            `;
            container.appendChild(card);
        }

        function createField(pKey, iKey, sKey, val) {
            const label = sKey || (pKey === null ? iKey : '');
            const displayVal = Array.isArray(val) ? val.join('\n') : (typeof val === 'object' ? JSON.stringify(val) : val);
            const path = JSON.stringify({pKey, iKey, sKey});
            
            return `
                <div class="flex flex-col gap-1">
                    ${label ? `<label class="text-[10px] font-black text-indigo-400 uppercase tracking-wider">${label}</label>` : ''}
                    <textarea class="w-full text-sm p-2 bg-slate-50 rounded-lg border-transparent focus:bg-white focus:ring-2 focus:ring-indigo-100 outline-none transition" 
                              onchange='updateRawData(${path}, this.value)'>${displayVal}</textarea>
                </div>
            `;
        }

        function updateRawData(path, value) {
            const {pKey, iKey, sKey} = path;
            let finalVal;

            if (value.includes('\n')) {
                finalVal = value.split('\n').filter(s => s.trim() !== "");
            } else {
                try {
                    if ((value.startsWith('{') || value.startsWith('['))) finalVal = JSON.parse(value);
                    else if (value.toLowerCase() === 'true') finalVal = true;
                    else if (value.toLowerCase() === 'false') finalVal = false;
                    else if (!isNaN(value) && value.trim() !== "") finalVal = Number(value);
                    else finalVal = value;
                } catch(e) { finalVal = value; }
            }

            if (pKey === null) { rawData[iKey] = finalVal; }
            else if (!sKey) { rawData[pKey][iKey] = finalVal; }
            else { rawData[pKey][iKey][sKey] = finalVal; }
        }

        function exportJSON() {
            if (Object.keys(rawData).length === 0) return alert("沒有資料可匯出");

            const finalObj = {};
            const sections = document.querySelectorAll('main section');
            
            sections.forEach(sec => {
                const sectionKey = sec.dataset.sectionKey;
                const container = sec.querySelector('.module-container');
                if(!container) return;
                const cardIds = Array.from(container.children).map(c => c.dataset.id);
                
                const originalData = rawData[sectionKey];

                if (Array.isArray(originalData)) {
                    finalObj[sectionKey] = cardIds.map(id => originalData[id]);
                } else if (typeof originalData === 'object' && originalData !== null) {
                    finalObj[sectionKey] = {};
                    cardIds.forEach(id => {
                        finalObj[sectionKey][id] = originalData[id];
                    });
                } else {
                    cardIds.forEach(id => {
                        finalObj[id] = rawData[id];
                    });
                }
            });

            const blob = new Blob([JSON.stringify(finalObj, null, 2)], {type: 'application/json'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `JSON_export_${Date.now()}.json`;
            a.click();
        }
    </script>
    <script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>



<style>
#busuanzi_container_page_pv {
    color: #0984e3; 
    font-size: 0.9rem;
    margin-left: 15px; /* 與左邊文字隔開 */
    border-left: 1px solid rgba(128, 128, 128, 0.5); /* 加一條細細的分隔線 */
    padding-left: 15px;
}

#busuanzi_value_page_pv {
    color: #0984e3; 
    font-weight: bold;
}
</style>

<script>
    (function() {
        const primary = "https://events.vercount.one/js";
        const fallback = "https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js";
        let isSwitched = false;

        function load(src, isBackup = false) {
            if (isSwitched && !isBackup) return; // 避免重複觸發
            
            const script = document.createElement('script');
            script.src = src;
            script.async = true;

            // 觸發備援的機制
            const triggerFallback = () => {
                if (!isSwitched) {
                    isSwitched = true;
                    console.warn("切換至備援計數器...");
                    load(fallback, true);
                }
            };

            script.onerror = triggerFallback; // 載入失敗時
            const timer = setTimeout(triggerFallback, 3000); // 3秒沒反應時
            script.onload = () => clearTimeout(timer); // 成功則取消計時器

            document.head.appendChild(script);
        }

        load(primary);
    })();
</script>


</body>
</html>
