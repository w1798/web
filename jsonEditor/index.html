<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>JSON編輯器 by Charles Nextime</title>

<script>
    document.documentElement.style.visibility = 'hidden';
    const APP_VER = "1.00a";
</script>
<script src="config.js?ver=1.00a"></script>
<script src="../loader_engine.js?ver=1.00a"></script>

    <style>
        /* --- 基礎設定 --- */
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-body: #f8fafc;
            --bg-nav: #0f172a;
            --text-main: #1e293b;
            --border-color: #e2e8f0;
        }

        body { 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
        }

        main { flex: 1; padding: 2rem; max-width: 1200px; margin: 0 auto; w-full; }

        /* --- 導覽列 --- */
        nav {
            background: var(--bg-nav);
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 50;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
        }

        nav h1 { margin: 0; font-size: 1.25rem; display: flex; align-items: center; color: #818cf8; }
        
        #fileType {
            font-size: 10px;
            background: #1e293b;
            padding: 2px 8px;
            border-radius: 4px;
            color: #94a3b8;
            margin-left: 10px;
        }

        .btn-group { display: flex; gap: 0.75rem; }
        
        button {
            padding: 0.5rem 1.25rem;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }

        .btn-secondary { background: #334155; color: white; }
        .btn-secondary:hover { background: #475569; }
        .btn-primary { background: var(--primary); color: white; box-shadow: 0 4px 6px rgba(99, 102, 241, 0.3); }
        .btn-primary:hover { background: var(--primary-hover); }

        /* --- 內容區塊 --- */
        .empty-state {
            text-align: center;
            padding: 5rem 0;
            color: #94a3b8;
            border: 3px dashed #e2e8f0;
            border-radius: 20px;
            background: white;
        }

        section { margin-bottom: 2.5rem; }
        .section-header { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem; }
        .section-dot { width: 6px; height: 24px; background: var(--primary); border-radius: 10px; }
        .section-title { font-size: 1.25rem; font-weight: 900; text-transform: uppercase; margin: 0; }

        .module-container {
            display: flex;
            flex-wrap: wrap; /* 允許換行 */
            gap: 15px;
        }
        .card {
            flex: 1 1 250px;
        }

        /* --- 卡片樣式 --- */
        .card {
            background: white;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
        }
        .card:hover { box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }

        .drag-handle {
            background: #f8fafc;
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: grab;
        }
        .card-label { font-size: 10px; font-weight: bold; color: #94a3b8; letter-spacing: 0.05em; }

        .card-body { padding: 1rem; }
        .field-group { display: flex; flex-direction: column; gap: 0.25rem; margin-bottom: 1rem; }
        .field-label { font-size: 10px; font-weight: 900; color: var(--primary); text-transform: uppercase; }

        textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 0.5rem;
            background: #f8fafc;
            border: 1px solid transparent;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.875rem;
            resize: vertical;
            transition: 0.2s;
        }
        textarea:focus {
            background: white;
            border-color: #e0e7ff;
            outline: 2px solid #eef2ff;
        }

        /* --- 頁尾 --- */
        footer {
            background: var(--bg-nav);
            color: #94a3b8;
            padding: 1.5rem;
            text-align: center;
            font-size: 0.875rem;
            border-top: 1px solid #1e293b;
        }
        footer a { color: #94a3b8; text-decoration: none; }
        footer a:hover { color: white; }

        .ghost { border: 2px dashed var(--primary); background: #f5f3ff; opacity: 0.5; }
    </style>
</head>
<body>

    <nav>
        <h1>💎 JSON編輯器 <span id="fileType">等待匯入</span></h1>
        <div class="btn-group">
            <input type="file" id="fileInput" accept=".json" style="display:none">
            <button onclick="document.getElementById('fileInput').click()" class="btn-secondary">匯入檔案</button>
            <button onclick="exportJSON()" class="btn-primary">儲存並匯出</button>
        </div>
    </nav>

    <main id="mainCanvas">
        <div class="empty-state">
            請點擊「匯入檔案」按鈕開始編輯。
        </div>
    </main>

    <footer>
        <div class="author-info">
            <a href="https://w1798.github.io/web/" target="_blank">&copy; 2026<script>
                const y = new Date().getFullYear();
                if (y > 2026) document.write("-" + y);
            </script> Charles Nextime</a> · <a href="https://www.gnu.org/licenses/gpl-3.0.html" target="_blank">GPLv3</a>
            <span id="busuanzi_container_page_pv" style="margin-left:10px">
                本頁使用量 <span id="busuanzi_value_page_pv"></span> 次
            </span>
        </div>
    </footer>

    <script>
        // --- 原本的 JS 邏輯完全保留，僅修改 render 產生的 class ---
        let rawData = {};

        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    rawData = JSON.parse(event.target.result);
                    document.getElementById('fileType').innerText = file.name;
                    renderMaster();
                } catch(err) { alert("JSON 格式錯誤！"); }
            };
            reader.readAsText(file);
        });

        function renderMaster() {
            const canvas = document.getElementById('mainCanvas');
            canvas.innerHTML = '';

            Object.keys(rawData).forEach(key => {
                const data = rawData[key];
                const section = document.createElement('section');
                section.dataset.sectionKey = key;
                section.innerHTML = `
                    <div class="section-header">
                        <div class="section-dot"></div>
                        <h2 class="section-title">${key}</h2>
                    </div>
                    <div id="container-${key}" class="module-container"></div>
                `;
                canvas.appendChild(section);
                const container = document.getElementById(`container-${key}`);

                if (typeof data === 'object' && data !== null) {
                    Object.keys(data).forEach(subKey => {
                        renderModuleCard(container, key, subKey, data[subKey]);
                    });
                    if(window.Sortable) {
                        Sortable.create(container, { animation: 200, ghostClass: 'ghost', handle: '.drag-handle' });
                    }
                } else {
                    renderModuleCard(container, null, key, data, true);
                }
            });
        }

        function renderModuleCard(container, parentKey, itemKey, value, isRoot = false) {
            const card = document.createElement('div');
            card.className = "card";
            card.dataset.id = itemKey;

            let fieldsHTML = "";
            if (typeof value === 'object' && value !== null && !Array.isArray(value)) {
                Object.keys(value).forEach(attrKey => {
                    fieldsHTML += createField(parentKey, itemKey, attrKey, value[attrKey]);
                });
            } else {
                fieldsHTML = createField(isRoot ? null : parentKey, isRoot ? itemKey : itemKey, null, value);
            }

            card.innerHTML = `
                <div class="drag-handle">
                    <span class="card-label">${isRoot ? 'PROP' : 'ITEM'} #${itemKey}</span>
                    <div style="color:#cbd5e1"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 9h14M5 15h14"/></svg></div>
                </div>
                <div class="card-body">${fieldsHTML}</div>
            `;
            container.appendChild(card);
        }

        function createField(pKey, iKey, sKey, val) {
            const label = sKey || (pKey === null ? iKey : '');
            let displayVal = (typeof val === 'object' && val !== null) ? JSON.stringify(val, null, 2) : val;
            const path = JSON.stringify({pKey, iKey, sKey});
            const rowCount = typeof displayVal === 'string' ? Math.min(displayVal.split('\n').length, 15) : 1;

            return `
                <div class="field-group">
                    ${label ? `<label class="field-label">${label}</label>` : ''}
                    <textarea rows="${rowCount}" onchange='updateRawData(${path}, this.value)'>${displayVal}</textarea>
                </div>
            `;
        }

        function updateRawData(path, value) {
            const {pKey, iKey, sKey} = path;
            let finalVal;
            if (value.includes('\n')) {
                finalVal = value.split('\n').filter(s => s.trim() !== "");
            } else {
                try {
                    if ((value.startsWith('{') || value.startsWith('['))) finalVal = JSON.parse(value);
                    else if (value.toLowerCase() === 'true') finalVal = true;
                    else if (value.toLowerCase() === 'false') finalVal = false;
                    else if (!isNaN(value) && value.trim() !== "") finalVal = Number(value);
                    else finalVal = value;
                } catch(e) { finalVal = value; }
            }
            if (pKey === null) { rawData[iKey] = finalVal; }
            else if (!sKey) { rawData[pKey][iKey] = finalVal; }
            else { rawData[pKey][iKey][sKey] = finalVal; }
        }

        function exportJSON() {
            if (Object.keys(rawData).length === 0) return alert("沒有資料可匯出");
            const finalObj = {};
            const sections = document.querySelectorAll('main section');
            sections.forEach(sec => {
                const sectionKey = sec.dataset.sectionKey;
                const container = sec.querySelector('.module-container');
                if(!container) return;
                const cardIds = Array.from(container.children).map(c => c.dataset.id);
                const originalData = rawData[sectionKey];
                if (Array.isArray(originalData)) {
                    finalObj[sectionKey] = cardIds.map(id => originalData[id]);
                } else if (typeof originalData === 'object' && originalData !== null) {
                    finalObj[sectionKey] = {};
                    cardIds.forEach(id => { finalObj[sectionKey][id] = originalData[id]; });
                } else {
                    cardIds.forEach(id => { finalObj[id] = rawData[id]; });
                }
            });
            const blob = new Blob([JSON.stringify(finalObj, null, 2)], {type: 'application/json'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `JSON_export_${Date.now()}.json`;
            a.click();
        }
    </script>
</body>
</html>
