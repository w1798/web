<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>專注追蹤器</title>

<script>
    document.documentElement.style.visibility = 'hidden';
    const APP_VER = "1.00c";
</script>

<script src="../loader_engine.js?ver=1.00d"></script>

</head>
<body>
    <div class="layout">
        <header class="header">
            <div class="brand"><h1>專注追蹤器</h1></div>
            <div class="nav-btns">
                <div class="dropdown">
                    <button id="btn-load-main" onclick="handleLoadAction(event)">讀取</button>
                    <div id="load-menu" class="dropdown-content">
                        <button onclick="fileImport()">從本地匯入</button>
                        <button onclick="cloudDownload()">從雲端下載</button>
                    </div>
                </div>
                <div class="dropdown">
                    <button id="btn-save-main" onclick="handleSaveAction(event)">存檔</button>
                    <div id="save-menu" class="dropdown-content">
                        <button onclick="fileExport()">匯出到本地</button>
                        <button onclick="cloudUpload()">上傳到雲端</button>
                    </div>
                </div>
                <button onclick="goHome()">返回主頁</button>
                <button onclick="openSettings()">設定</button>
            </div>
        </header>

        <main class="main-content" id="main-content-scroll">
            <div id="view-home" class="container">
                <button id="btn-resume" onclick="resumeObservation()" class="hidden" style="background-color: #27ae60;">繼續上一次的觀察 </button>
                <button onclick="setMode('single')" style="padding: 20px 40px; font-size: 1.2rem;">單人模式</button>
                <button onclick="setMode('double')" style="padding: 20px 40px; font-size: 1.2rem;">雙人模式</button>
                <button onclick="loadLastSession()">查看上一次結果</button>

            </div>
            
            <div id="view-settings" class="container hidden">
                <input type="text" id="obsName" placeholder="觀察者姓名">
                <input type="text" id="actName" placeholder="活動名稱">
                <input type="text" id="stuA" placeholder="學生A姓名">
                <input type="text" id="stuB" placeholder="學生B姓名">
                <input type="date" id="obsDate">
                <select id="duration">
                    <option value="1">1 分鐘</option>
                    <option value="5">5 分鐘</option>
                    <option value="10" selected>10 分鐘</option>
                    <option value="20">20 分鐘</option>
                    <option value="30">30 分鐘</option>
                    <option value="40">40 分鐘</option>
                    <option value="50">50 分鐘</option>
                    <option value="60">60 分鐘</option>
                    <option value="999">999 分鐘</option>
                </select>
                <button onclick="startObservation()">開始</button>
            </div>

            <div id="view-observe" class="container hidden">
                <div id="timerDisplay">總時間: 00:00</div>
                <div id="actionButtons"></div>
            </div>

            <div id="view-report" class="container hidden">
                <h2>觀察統計報表</h2>
                <div id="reportTableContainer"></div>
                
                <div style="margin-top: 30px; width: 100%; max-width: 800px;">
                    <h3>行為分析長條圖</h3>
                    <canvas id="analysisChart" style="background:#fff;"></canvas>
                </div>
                
                <div id="timelineContainer" style="margin-top: 30px;"></div>
                
                <button onclick="exportExcel()">匯出完整 CSV 報表</button>
                <button onclick="goHome()">返回首頁</button>
            </div>

            <div id="view-config" class="container hidden">
                <div class="config-header">
                    <h2>系統設定</h2>
                    <div class="button-group">
                        <button onclick="systemReset()" style="background:red;">重置系統</button>
                        <button onclick="closeSettings()">取消</button>
                        <button onclick="saveGlobalSettings()">儲存</button> 
                    </div>
                </div>

                <div class="settings-wrapper">
                    <div class="col-left">
                        <h3>觀察項目</h3>
                        <textarea id="customActions" rows="10"></textarea>
                    </div>
                    <div class="col-center">
                        <h3>統計區間 (分鐘)</h3>
                        <input type="number" id="reportInterval" value="0.5" step="0.1">
                        <h3>時間模式</h3>
                        <select id="timeMode">
                            <option value="timer">計時模式</option>
                            <option value="realtime">真實時間</option>
                        </select>
                    </div>
                    <div class="col-right">
                        <h3>雲端同步設定</h3>
                        <input type="text" id="cloudURL" placeholder="URL or JSONBin ID">
                        <input type="text" id="cloudToken" placeholder="Token or X-Access-Key">
                        <a href="https://w1798.github.io/web/JsonCloudGuide" target="_blank">申請說明</a>
                    </div>
                </div>
                
            </div>
        </main>

<button id="topBtn" onclick="document.getElementById('main-content-scroll').scrollTo({top: 0, behavior: 'smooth'})" 
        style="position:fixed; bottom:70px; right:20px; padding:10px 15px; 
               background:#333; color:white; border:none; border-radius:50%; 
               z-index:9999; display:none;">↑</button>    

        <footer></footer>
    </div>
 

</body>
</html>
