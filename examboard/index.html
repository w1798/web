<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>監考系統 - 全畫面版</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; background-color: #f8fafc; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .modal-overlay { animation: fadeIn 0.2s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        /* 播放進度條樣式 */
        input[type='range'] { accent-color: #3b82f6; cursor: pointer; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // --- 基本圖示 ---
        const Icon = ({ children, size = 24, className = "", onClick }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} onClick={onClick} style={{ cursor: onClick ? 'pointer' : 'default' }}>
                {children}
            </svg>
        );

        const Settings = (props) => <Icon {...props}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.47a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.35a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></Icon>;
        const Trash2 = (props) => <Icon {...props}><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></Icon>;
        const Upload = (props) => <Icon {...props}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></Icon>;
        const Eye = (props) => <Icon {...props}><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></Icon>;
        const EyeOff = (props) => <Icon {...props}><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07-2.3-2.3"></path><line x1="1" y1="1" x2="23" y2="23"></line></Icon>;

        // --- 設定視窗組件 ---
        const SettingsModal = ({ isOpen, onClose, reminders, setReminders, subjectOptions, setSubjectOptions, classInfo, setClassInfo }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-black/60 z-[100] flex items-center justify-center p-6 backdrop-blur-sm modal-overlay">
                    <div className="bg-white w-full max-w-6xl h-[85vh] flex flex-col rounded-3xl shadow-2xl overflow-hidden">
                        <div className="p-6 border-b flex justify-between items-center bg-gray-50">
                            <h2 className="text-2xl font-bold">系統進階設定</h2>
                            <button onClick={onClose} className="px-10 py-3 bg-blue-600 text-white rounded-2xl font-bold shadow-lg">完成設定</button>
                        </div>
                        <div className="flex-1 overflow-y-auto p-8 grid grid-cols-1 md:grid-cols-3 gap-8">
                            <section className="bg-blue-50 p-6 rounded-3xl">
                                <h3 className="text-xl font-black text-blue-700 mb-4 flex justify-between">考科 & 個別考場</h3>
                                {subjectOptions.map((sub, idx) => (
                                    <div key={idx} className="flex gap-2 mb-2 items-center">
                                        <input value={sub.name} onChange={(e) => { const n = [...subjectOptions]; n[idx].name = e.target.value; setSubjectOptions(n); }} className="flex-1 p-2 rounded-lg border-none shadow-sm" />
                                        <select value={sub.specialRoom} onChange={(e) => { const n = [...subjectOptions]; n[idx].specialRoom = parseInt(e.target.value); setSubjectOptions(n); }} className="p-2 rounded-lg bg-white shadow-sm font-bold">
                                            {[...Array(10).keys()].map(n => <option key={n} value={n}>{n}人</option>)}
                                        </select>
                                        <button onClick={() => setSubjectOptions(subjectOptions.filter((_, i) => i !== idx))} className="text-red-300"><Trash2 size={18}/></button>
                                    </div>
                                ))}
                                <button onClick={() => setSubjectOptions([...subjectOptions, { name: "新科目", specialRoom: 0 }])} className="w-full mt-2 py-2 border-2 border-dashed border-blue-200 rounded-xl text-blue-400 font-bold">+ 增加選單科目</button>
                                <div className="mt-8 pt-6 border-t border-blue-200 space-y-4">
                                    <div className="flex justify-between items-center"><span>全班總人數</span><select value={classInfo.total} onChange={(e)=>setClassInfo({...classInfo, total: parseInt(e.target.value)})} className="font-bold">{[...Array(41).keys()].map(n => <option key={n} value={n}>{n}人</option>)}</select></div>
                                    <div className="flex justify-between items-center text-red-500"><span>缺考人數</span><select value={classInfo.absent} onChange={(e)=>setClassInfo({...classInfo, absent: parseInt(e.target.value)})} className="font-bold">{[...Array(41).keys()].map(n => <option key={n} value={n}>{n}人</option>)}</select></div>
                                </div>
                            </section>
                            <section className="bg-red-50 p-6 rounded-3xl">
                                <h3 className="text-xl font-black text-red-600 mb-4">考試提醒文字</h3>
                                {reminders.exam.map((text, idx) => (
                                    <input key={idx} value={text} onChange={(e) => { const n = [...reminders.exam]; n[idx] = e.target.value; setReminders({...reminders, exam: n}); }} className="w-full p-2 mb-2 rounded-lg border-none shadow-sm" />
                                ))}
                            </section>
                            <section className="bg-green-50 p-6 rounded-3xl">
                                <h3 className="text-xl font-black text-green-600 mb-4">下課提醒文字</h3>
                                {reminders.break.map((text, idx) => (
                                    <input key={idx} value={text} onChange={(e) => { const n = [...reminders.break]; n[idx] = e.target.value; setReminders({...reminders, break: n}); }} className="w-full p-2 mb-2 rounded-lg border-none shadow-sm" />
                                ))}
                            </section>
                        </div>
                    </div>
                </div>
            );
        };

        const ExamSystem = () => {
            const [now, setNow] = useState(new Date());
            const [showReminders, setShowReminders] = useState(true);
            const [showSettings, setShowSettings] = useState(false);
            const [classInfo, setClassInfo] = useState({ total: 25, absent: 0 });
            const [subjectOptions, setSubjectOptions] = useState([
                { name: '國語', specialRoom: 0 }, { name: '自然', specialRoom: 0 }, 
                { name: '英語', specialRoom: 0 }, { name: '數學', specialRoom: 0 }, { name: '社會', specialRoom: 0 }
            ]);
            const [schedule, setSchedule] = useState([{ id: 1, subject: '國語', start: '08:40', end: '09:20', audio: null }]);
            const [reminders, setReminders] = useState({
                exam: ["考卷記得寫上班級姓名座號", "有問題舉手問老師", "耐心、細心、小心", "寫完多檢查"],
                break: ["提早上廁所喝水", "桌面淨空", "坐在位置上準備下節考試"]
            });

            // 音樂播放狀態
            const [playingAudioId, setPlayingAudioId] = useState(null);
            const [audioProgress, setAudioProgress] = useState({});
            const audioRefs = useRef({});

            useEffect(() => {
                const timer = setInterval(() => setNow(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);

            const currentStatus = useMemo(() => {
                const currentTime = now.getTime();
                const parseT = (timeStr) => {
                    const [h, m] = timeStr.split(':').map(Number);
                    const d = new Date(now); d.setHours(h, m, 0, 0); return d.getTime();
                };
                for (let i = 0; i < schedule.length; i++) {
                    const start = parseT(schedule[i].start); const end = parseT(schedule[i].end);
                    if (currentTime >= start && currentTime <= end) return { type: 'exam', slotIndex: i };
                    if (i < schedule.length - 1) {
                        const nextStart = parseT(schedule[i+1].start);
                        if (currentTime > end && currentTime < nextStart) return { type: 'break', nextSlotIndex: i + 1 };
                    }
                }
                return { type: 'idle' };
            }, [now, schedule]);

            const handleAudioUpload = (id, file) => {
                const reader = new FileReader();
                reader.onload = (e) => setSchedule(schedule.map(s => s.id === id ? { ...s, audio: e.target.result } : s));
                reader.readAsDataURL(file);
            };

            const toggleAudio = (id) => {
                const audio = audioRefs.current[id];
                if (playingAudioId === id) {
                    audio.pause();
                    setPlayingAudioId(null);
                } else {
                    Object.values(audioRefs.current).forEach(a => a?.pause());
                    audio.play();
                    setPlayingAudioId(id);
                }
            };

            const updateProgress = (id) => {
                const audio = audioRefs.current[id];
                if (audio) {
                    setAudioProgress(prev => ({ ...prev, [id]: (audio.currentTime / audio.duration) * 100 }));
                }
            };

            const seekAudio = (id, val) => {
                const audio = audioRefs.current[id];
                if (audio) {
                    audio.currentTime = (val / 100) * audio.duration;
                    setAudioProgress(prev => ({ ...prev, [id]: val }));
                }
            };

            return (
                <div className="w-screen h-screen flex bg-white overflow-hidden">
                    <SettingsModal 
                        isOpen={showSettings} onClose={() => setShowSettings(false)} 
                        reminders={reminders} setReminders={setReminders}
                        subjectOptions={subjectOptions} setSubjectOptions={setSubjectOptions}
                        classInfo={classInfo} setClassInfo={setClassInfo}
                    />

                    {/* 左側 3/5：考試科目與主要內容 */}
                    <div className={`${showReminders ? 'w-3/5' : 'w-full'} h-full p-8 overflow-y-auto transition-all duration-500`}>
                        {schedule.map((item, idx) => {
                            const selectedSub = subjectOptions.find(o => o.name === item.subject);
                            const b = selectedSub ? selectedSub.specialRoom : 0;
                            const a = classInfo.absent;
                            const c = classInfo.total - a - b;

                            return (
                                <div key={item.id} className={`mb-6 p-8 rounded-[2.5rem] border-4 flex flex-col gap-4 transition-all ${currentStatus.slotIndex === idx ? 'bg-yellow-50 border-yellow-400 shadow-xl scale-[1.01]' : 'bg-white border-gray-100 shadow-sm'}`}>
                                    <div className="flex items-center justify-between">
                                        <div className="flex items-center gap-6">
                                            <select value={item.subject} onChange={(e)=>{const s=[...schedule]; s[idx].subject=e.target.value; setSchedule(s);}} className="text-4xl font-black bg-gray-100 px-6 py-3 rounded-2xl outline-none focus:ring-4 ring-blue-100">
                                                <option value="">選擇科目</option>
                                                {subjectOptions.map(o => <option key={o.name} value={o.name}>{o.name}</option>)}
                                            </select>
                                            <div className="text-3xl font-mono font-black text-gray-700 flex items-center gap-3">
                                                <input type="time" value={item.start} onChange={(e)=>{const s=[...schedule]; s[idx].start=e.target.value; setSchedule(s);}} className="bg-transparent border-b-2 border-gray-200" />
                                                <span className="text-gray-300">~</span>
                                                <input type="time" value={item.end} onChange={(e)=>{const s=[...schedule]; s[idx].end=e.target.value; setSchedule(s);}} className="bg-transparent border-b-2 border-gray-200" />
                                            </div>
                                        </div>
                                        <div className="flex gap-4">
                                            <label className="cursor-pointer text-gray-300 hover:text-blue-500 transition-colors"><Upload size={32}/><input type="file" className="hidden" onChange={(e)=>handleAudioUpload(item.id, e.target.files[0])}/></label>
                                            <button onClick={()=>setSchedule(schedule.filter(s=>s.id!==item.id))} className="text-red-100 hover:text-red-400 transition-colors"><Trash2 size={32}/></button>
                                        </div>
                                    </div>

                                    {/* 音樂控制區 */}
                                    {item.audio && (
                                        <div className="bg-white/60 p-4 rounded-2xl flex items-center gap-6">
                                            <button onClick={() => toggleAudio(item.id)} className={`px-6 py-2 rounded-xl font-black text-white shadow-md active:scale-95 transition-all ${playingAudioId === item.id ? 'bg-red-500' : 'bg-blue-600'}`}>
                                                {playingAudioId === item.id ? '暫停' : '播放'}
                                            </button>
                                            <input type="range" className="flex-1" value={audioProgress[item.id] || 0} onChange={(e) => seekAudio(item.id, e.target.value)} />
                                            <audio ref={el => audioRefs.current[item.id] = el} src={item.audio} onTimeUpdate={() => updateProgress(item.id)} onEnded={() => setPlayingAudioId(null)} />
                                        </div>
                                    )}

                                    <div className="px-2 text-2xl font-bold text-gray-400">
                                        缺考 <span className="text-red-500">{a}</span> 人，個別考場 <span className="text-blue-500">{b}</span> 人，實到 <span className="text-green-600 text-4xl font-black ml-4">{c}</span> 人
                                    </div>
                                </div>
                            );
                        })}
                        <button onClick={() => setSchedule([...schedule, { id: Date.now(), subject: '國語', start: '12:00', end: '13:00', audio: null }])} className="w-full py-6 border-4 border-dashed border-gray-100 rounded-[2.5rem] text-gray-300 text-2xl font-bold hover:bg-gray-50 hover:border-blue-100 hover:text-blue-200 transition-all">+ 新增下一節考試</button>
                    </div>

                    {/* 右側 2/5：資訊顯示區 */}
                    <div className={`${showReminders ? 'w-2/5' : 'w-0'} h-full flex flex-col border-l-8 border-gray-900 transition-all duration-500 overflow-hidden`}>
                        {/* 右上：時間區域 (3/5 寬度的時間移到這裡) */}
                        <div className="h-2/5 bg-gray-900 text-white p-8 flex flex-col items-center justify-center relative">
                            <div className="absolute top-4 right-4 flex gap-4">
                                <button onClick={() => setShowReminders(!showReminders)} className="p-3 bg-white/10 rounded-xl hover:bg-white/20">{showReminders ? <EyeOff size={24}/> : <Eye size={24}/>}</button>
                                <button onClick={() => setShowSettings(true)} className="p-3 bg-white/10 rounded-xl hover:bg-white/20"><Settings size={24}/></button>
                            </div>
                            <div className="text-2xl font-bold text-gray-400 mb-2">民國{now.getFullYear()-1911}年{now.getMonth()+1}月{now.getDate()}日</div>
                            <div className="text-[10vh] font-mono font-black leading-none">{now.toLocaleTimeString('zh-TW', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' })}</div>
                        </div>

                        {/* 右下：動態提醒區域 */}
                        <div className="h-3/5 bg-blue-50/50 p-12 flex flex-col justify-center items-center text-center">
                            <h2 className="text-3xl font-black text-blue-800 mb-8 border-b-8 border-blue-200 pb-4 w-full">
                                {currentStatus.type === 'exam' ? '📋 考試注意事項' : '🔔 休息準備事項'}
                            </h2>
                            <div className="h-80 flex items-center">
                                <p className="text-[6vh] font-black text-gray-800 leading-tight drop-shadow-sm">
                                    { (currentStatus.type === 'exam' ? reminders.exam : reminders.break)[Math.floor((Date.now()/5000) % ( (currentStatus.type === 'exam' ? reminders.exam : reminders.break).length || 1))] }
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ExamSystem />);
    </script>
</body>
</html>
