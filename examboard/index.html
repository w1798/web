<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>數位考場看板 by Charles Nextime</title>
<script>
    // 1. 版本控制
    const APP_VER = "1.00f";

    // 2. 資源清單：要增減檔案改這裡即可，不需要請刪除或註解即可
    const resources = {
        styles: [
            "style.css"
        ], 
        scripts: [
            "../counter.js",
            "script.js"
        ]
    };

    // --- 立即隱藏頁面 ---
    document.documentElement.style.visibility = 'hidden';

    /**
     * 核心邏輯：將資源標籤注入到 <head>
     */
    function injectResource(type, url, onCssLoaded) {
        const isCSS = type === 'css';
        const el = document.createElement(isCSS ? 'link' : 'script');
        const attr = isCSS ? 'href' : 'src';
        
        if (isCSS) {
            el.rel = 'stylesheet';
        } else {
            el.async = false;
        }

        el[attr] = `${url}?ver=${APP_VER}`;
        
        el.onload = () => {
            console.log(`%c[已載入] ${type.toUpperCase()}: ${url}`, "color: #00b894");
            // 若為 CSS，載入成功後執行進度檢查
            if (isCSS && onCssLoaded) onCssLoaded();
        };

        el.onerror = () => {
            console.error(`[載入失敗] ${url}`);
            // 若為 CSS，即便失敗也要解鎖，避免畫面永久白屏
            if (isCSS && onCssLoaded) onCssLoaded();
        };

        document.head.appendChild(el);
    }

    /**
     * 主程序：解析配置並執行載入
     */
    function loadApp() {
        console.log(`%c[Loader] 開始初始化資源 (版本: ${APP_VER})`, "color: #3498db; font-weight: bold;");

        const cssList = resources.styles || [];
        let cssLoadedCount = 0;

        // 【新增】檢查 CSS 載入進度
        const checkCssProgress = () => {
            cssLoadedCount++;
            if (cssLoadedCount >= cssList.length) {
                document.documentElement.style.visibility = 'visible';
                console.log("%c[Display] 樣式套用完成，解除頁面鎖定", "color: #9b59b6; font-weight: bold;");
            }
        };

        // 如果完全沒有 CSS，直接顯示
        if (cssList.length === 0) {
            document.documentElement.style.visibility = 'visible';
        }

        // 執行載入
        const configs = [
            { data: cssList, type: 'css', label: 'CSS' },
            { data: resources.scripts, type: 'js', label: 'JS' }
        ];

        configs.forEach(config => {
            if (config.data && config.data.length > 0) {
                config.data.forEach(url => {
                    // 只有 CSS 傳入回調函式
                    injectResource(config.type, url, config.type === 'css' ? checkCssProgress : null);
                });
            } else {
                console.log(`%c[Notice] 無外部 ${config.label} 資源需要載入`, "color: #e67e22");
            }
        });
    }

    // 啟動！
    loadApp();
</script>
</head>
<body class="theme-default">

<div class="app-container">
    <div class="panel-left">
        <div class="panel-left-header">
            <div class="header-main">
                <div class="title-group">
                    <h1 class="title">評量科目</h1>
                    <div class="stats">全班 <span id="totalCount">25</span> 人 / 缺考 <span id="absentCount">0</span> 人</div>
                </div>
                <div class="nav-tools">
                    <button class="btn-sm" onclick="exportData()">💾 匯出</button>
                    <button class="btn-sm" onclick="document.getElementById('importFile').click()">📂 匯入</button>
                    <button class="btn-sm" onclick="toggleModal(true)">⚙️ 設定</button>
                    <input type="file" id="importFile" hidden accept=".json" onchange="importData(this)">
                </div>
            </div>
        </div>
        <div class="schedule-scroll-area">
            <div id="scheduleList"></div>
            <button onclick="addSession()" class="add-session-btn">+ 新增下一節評量</button>
        </div>
        <div class="author-info">
<footer></footer>
        </div>
    </div>

    <div class="panel-right">
        <div class="clock-section" id="clockSection">
            <button onclick="toggleReminders()" class="toggle-reminders-btn" id="toggleIcon">🔽</button>
            <div class="time-display" id="timeDisplay">00:00:00</div>
        </div>
        <div class="reminder-section" id="reminderSection">
            <div class="reminder-title">評量注意事項</div>
            <div class="reminder-text" id="reminderText">載入中...</div>
        </div>
    </div>
</div>

<div id="settingsModal">
    <div class="modal-content">
        <div class="modal-header">
            <div style="display: flex; align-items: center; gap: 16px;">
                <h2 style="margin: 0;">數位考場看板 - 評量詳細設定</h2>
                <button onclick="resetAll()" style="color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); background: rgba(239, 68, 68, 0.1); padding: 5px 12px; font-size: 0.9rem; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 4px;">🔄 重置</button>
            </div>
            <div style="display: flex; gap: 10px;">
                <button onclick="toggleModal(false)" class="btn-modal-cancel">取消</button>
                <button onclick="saveSettingsFromModal()" class="btn-modal-save">確定</button>
            </div>
        </div>
        <div class="modal-body">
            <div class="modal-sidebar">
                <div class="sidebar-section">
                    <h3 class="section-title" style="color: var(--primary);">風格與出席人數</h3>
                    
                    <div class="inline-group">
                        <label>介面風格</label>
                        <select id="inputTheme" class="short-select-theme" onchange="applyTheme(this.value)">
                            <option value="default">預設藍色</option>
                            <option value="emerald">翡翠綠</option>
                            <option value="rose">玫瑰紅</option>
                            <option value="amber">琥珀橙</option>
                            <option value="violet">薰衣草紫</option>
                            <option value="cyan">青空藍</option>
                            <option value="orange">活力橘</option>
                            <option value="fuchsia">洋紅粉</option>
                            <option value="indigo">靛青藍</option>
                            <option value="teal">水鴨綠</option>
                            <option value="slate">石板灰</option>
                            <option value="pink">櫻花粉</option>
                            <option value="lime">萊姆綠</option>
                            <option value="brown">深咖褐</option>
                            <option value="dark">極致深黑</option>
                            <option value="royal">皇家金藍</option>
                        </select>
                    </div>

                    <div class="inline-group">
                        <label>時間字體大小</label>
                        <select id="inputTimeFontSize" class="short-select-theme">
                            <option value="small">小</option>
                            <option value="medium">中</option>
                            <option value="large">大</option>
                            <option value="xlarge">特大</option>
                        </select>
                    </div>

                    <div class="inline-group">
                        <label>卡片字體大小</label>
                        <select id="inputCardFontSize" class="short-select-theme">
                            <option value="small">小</option>
                            <option value="medium">中</option>
                            <option value="large">大</option>
                            <option value="xlarge">特大</option>
                        </select>
                    </div>

                    <div class="inline-group">
                        <label style="cursor:pointer;"><input type="checkbox" id="inputSwapPanels"> 左右版面互換</label>
                    </div>

                    <div class="attendance-inline-row">
                        <label>全班</label>
                        <select id="inputTotal" class="tiny-select"></select>
                        <label>缺考</label>
                        <select id="inputAbsent" class="tiny-select"></select>
                    </div>
                </div>

                <hr class="modal-divider">
                
                <div class="sidebar-section">
                    <h3 class="section-title" style="color: var(--primary);">科目和個別試場人數</h3>
                    <div id="modalSubjectList" class="compact-list"></div>
                    <button onclick="addNewSubjectOption()" class="btn-add-subject">+ 增加預設科目</button>
                </div>
            </div>

            <div class="setting-section">
                <h3 class="section-title" style="color: var(--red);">考試中提醒</h3>
                <textarea id="examReminders"></textarea>
            </div>
            <div class="setting-section">
                <h3 class="section-title" style="color: var(--green);">下課中提醒</h3>
                <textarea id="breakReminders"></textarea>
            </div>
        </div>
    </div>
</div>




</body>
</html>
