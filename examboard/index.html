<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>監考系統 - 一線控制版</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; background-color: #f8fafc; }
        .transition-layout { transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
        .progress-container { height: 4px; background: #f1f5f9; border-radius: 2px; overflow: hidden; margin-top: 8px; }
        .progress-bar { height: 100%; background: #3b82f6; transition: width 0.1s linear; }
        select { -webkit-appearance: none; appearance: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        const Icon = ({ children, size = 20, className = "", onClick, title }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className} onClick={onClick} title={title} style={{ cursor: onClick ? 'pointer' : 'default' }}>
                {children}
            </svg>
        );

        const Settings = (props) => <Icon {...props}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.47a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.35a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></Icon>;
        const Trash2 = (props) => <Icon {...props}><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></Icon>;
        const Upload = (props) => <Icon {...props}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></Icon>;
        const RotateCcw = (props) => <Icon {...props}><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></Icon>;
        const Eye = (props) => <Icon {...props}><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></Icon>;
        const EyeOff = (props) => <Icon {...props}><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07-2.3-2.3"></path><line x1="1" y1="1" x2="23" y2="23"></line></Icon>;

        const PRESET_TIMES = [
            { start: '08:40', end: '09:20' },
            { start: '09:30', end: '10:10' },
            { start: '10:25', end: '11:05' },
            { start: '11:15', end: '11:45' }
        ];

        const ExamSystem = () => {
            const [now, setNow] = useState(new Date());
            const [showReminders, setShowReminders] = useState(true);
            const [showSettings, setShowSettings] = useState(false);
            const [classInfo, setClassInfo] = useState({ total: 25, absent: 0 });
            const [subjectOptions, setSubjectOptions] = useState([
                { name: '國語', specialRoom: 0 }, { name: '數學', specialRoom: 0 }, 
                { name: '自然', specialRoom: 0 }, { name: '英語', specialRoom: 0 }, { name: '社會', specialRoom: 0 }
            ]);

            // 預設建立前兩節
            const [schedule, setSchedule] = useState([
                { id: 1, subject: '國語', start: '08:40', end: '09:20', audio: null },
                { id: 2, subject: '數學', start: '09:30', end: '10:10', audio: null }
            ]);

            const [reminders, setReminders] = useState({
                exam: ["考卷記得寫上班級姓名座號", "有問題舉手問老師", "耐心、細心、多檢查"],
                break: ["提早上廁所喝水", "桌面淨空", "準備下一科文具"]
            });

            const [playingAudioId, setPlayingAudioId] = useState(null);
            const [audioProgress, setAudioProgress] = useState({});
            const audioRefs = useRef({});
            const fileRefs = useRef({});

            useEffect(() => {
                const timer = setInterval(() => setNow(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);

            const addNextSession = () => {
                const nextIdx = schedule.length % PRESET_TIMES.length;
                const subName = subjectOptions[nextIdx]?.name || subjectOptions[0].name;
                setSchedule([...schedule, {
                    id: Date.now(),
                    subject: subName,
                    start: PRESET_TIMES[nextIdx].start,
                    end: PRESET_TIMES[nextIdx].end,
                    audio: null
                }]);
            };

            const toggleAudio = (id) => {
                const audio = audioRefs.current[id];
                if (playingAudioId === id) { audio.pause(); setPlayingAudioId(null); }
                else { Object.values(audioRefs.current).forEach(a => a?.pause()); audio.play(); setPlayingAudioId(id); }
            };

            const replayAudio = (id) => {
                const audio = audioRefs.current[id];
                audio.currentTime = 0; audio.play(); setPlayingAudioId(id);
            };

            const currentStatus = useMemo(() => {
                const currentMs = now.getHours() * 3600000 + now.getMinutes() * 60000;
                for (let i = 0; i < schedule.length; i++) {
                    const [sh, sm] = schedule[i].start.split(':').map(Number);
                    const [eh, em] = schedule[i].end.split(':').map(Number);
                    if (currentMs >= (sh * 3600000 + sm * 60000) && currentMs < (eh * 3600000 + em * 60000)) return { type: 'exam', slotIndex: i };
                    if (i < schedule.length - 1) {
                        const [nsh, nsm] = schedule[i+1].start.split(':').map(Number);
                        if (currentMs >= (eh * 3600000 + em * 60000) && currentMs < (nsh * 3600000 + nsm * 60000)) return { type: 'break' };
                    }
                }
                return { type: 'idle' };
            }, [now, schedule]);

            return (
                <div className="w-screen h-screen flex bg-white overflow-hidden text-slate-900">
                    {/* 左側 3/5 控制區 */}
                    <div className="w-3/5 h-full p-6 flex flex-col border-r-2 border-slate-100">
                        <div className="flex-1 overflow-y-auto pr-2">
                            {schedule.map((item, idx) => {
                                const subInfo = subjectOptions.find(o => o.name === item.subject);
                                const b = subInfo ? subInfo.specialRoom : 0;
                                const c = classInfo.total - classInfo.absent - b;
                                const isActive = currentStatus.slotIndex === idx;

                                return (
                                    <div key={item.id} className={`mb-4 p-5 rounded-3xl border-2 transition-all ${isActive ? 'bg-yellow-50 border-yellow-400 shadow-md scale-[1.01]' : 'bg-slate-50 border-transparent'}`}>
                                        <div className="flex items-center gap-4">
                                            {/* 科目選擇 */}
                                            <select value={item.subject} onChange={(e)=>{const s=[...schedule]; s[idx].subject=e.target.value; setSchedule(s);}} className="text-2xl font-black bg-white px-3 py-1 rounded-xl shadow-sm outline-none text-blue-700 min-w-[120px]">
                                                {subjectOptions.map(o => <option key={o.name} value={o.name}>{o.name}</option>)}
                                            </select>
                                            
                                            {/* 時間範圍 */}
                                            <div className="text-xl font-mono font-bold flex items-center bg-white px-3 py-1 rounded-xl shadow-sm">
                                                <input type="time" value={item.start} onChange={(e)=>{const s=[...schedule]; s[idx].start=e.target.value; setSchedule(s);}} className="bg-transparent" />
                                                <span className="mx-1 text-slate-300">~</span>
                                                <input type="time" value={item.end} onChange={(e)=>{const s=[...schedule]; s[idx].end=e.target.value; setSchedule(s);}} className="bg-transparent" />
                                            </div>

                                            {/* 功能按鈕組：上傳、播放、重播、刪除 */}
                                            <div className="flex items-center gap-2 ml-auto bg-white/50 p-1 rounded-xl">
                                                <input type="file" ref={el => fileRefs.current[item.id] = el} className="hidden" onChange={(e)=>{
                                                    const f = e.target.files[0]; if(f) setSchedule(schedule.map(s => s.id === item.id ? {...s, audio: URL.createObjectURL(f)} : s));
                                                }} />
                                                <button onClick={()=>fileRefs.current[item.id].click()} className="p-2 hover:bg-blue-100 text-slate-400 hover:text-blue-600 rounded-lg transition-colors"><Upload/></button>
                                                
                                                {item.audio && (
                                                    <React.Fragment>
                                                        <button onClick={() => toggleAudio(item.id)} className={`px-4 py-1.5 rounded-lg text-sm font-black text-white ${playingAudioId === item.id ? 'bg-red-500' : 'bg-green-600'}`}>
                                                            {playingAudioId === item.id ? '暫停' : '播放'}
                                                        </button>
                                                        <button onClick={() => replayAudio(item.id)} className="p-2 hover:bg-blue-100 text-blue-600 rounded-lg transition-colors"><RotateCcw/></button>
                                                    </React.Fragment>
                                                )}
                                                <button onClick={()=>setSchedule(schedule.filter(s=>s.id!==item.id))} className="p-2 hover:bg-red-100 text-slate-300 hover:text-red-500 rounded-lg transition-colors"><Trash2/></button>
                                            </div>
                                        </div>

                                        {/* 實到人數提示與進度條 */}
                                        <div className="mt-3 flex items-end justify-between px-1">
                                            <div className="text-sm font-bold text-slate-400">
                                                應到 {classInfo.total} | 缺考 <span className="text-red-500">{classInfo.absent}</span> | 個考 {b} | <span className="text-slate-700 text-lg">實到 </span><span className="text-green-600 text-3xl font-black">{c}</span>
                                            </div>
                                        </div>
                                        {item.audio && (
                                            <div className="progress-container">
                                                <div className="progress-bar" style={{ width: `${audioProgress[item.id] || 0}%` }}></div>
                                                <audio ref={el => audioRefs.current[item.id] = el} src={item.audio} onTimeUpdate={()=>{
                                                    const a = audioRefs.current[item.id]; setAudioProgress(p => ({...p, [item.id]: (a.currentTime/a.duration)*100}));
                                                }} onEnded={()=>{setPlayingAudioId(null); setAudioProgress(p=>({...p, [item.id]:0})); }} />
                                            </div>
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                        <button onClick={addNextSession} className="mt-4 w-full py-4 border-2 border-dashed border-slate-200 rounded-3xl text-slate-400 text-lg font-bold hover:bg-slate-50 transition-all">+ 新增下一節考試</button>
                    </div>

                    {/* 右側 2/5 資訊與時間區 */}
                    <div className="w-2/5 h-full flex flex-col">
                        <div className={`bg-slate-900 text-white p-8 flex flex-col items-center justify-center relative transition-layout ${showReminders ? 'h-2/5' : 'h-full'}`}>
                            <div className="absolute top-4 right-4 flex gap-4">
                                <button onClick={() => setShowReminders(!showReminders)} className="p-2 bg-white/10 rounded-lg hover:bg-white/20">{showReminders ? <EyeOff/> : <Eye/>}</button>
                                <button onClick={() => setShowSettings(true)} className="p-2 bg-white/10 rounded-lg hover:bg-white/20"><Settings/></button>
                            </div>
                            <div className={`font-bold text-slate-400 transition-all ${showReminders ? 'text-2xl mb-2' : 'text-4xl mb-6'}`}>民國{now.getFullYear()-1911}年{now.getMonth()+1}月{now.getDate()}日</div>
                            <div className={`font-mono font-black leading-none transition-all ${showReminders ? 'text-[9vh]' : 'text-[16vh]'}`}>
                                {now.toLocaleTimeString('zh-TW', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' })}
                            </div>
                        </div>

                        {showReminders && (
                            <div className="h-3/5 bg-blue-50/50 p-10 flex flex-col items-center justify-center text-center">
                                <h2 className="text-xl font-black text-blue-800 mb-6 tracking-widest bg-blue-100 px-6 py-1 rounded-full">NOTICE 注意事項</h2>
                                <div className="flex-1 flex items-center">
                                    <p className="text-[5vh] font-black text-slate-800 leading-snug drop-shadow-sm">
                                        { (currentStatus.type === 'exam' ? reminders.exam : reminders.break)[Math.floor((Date.now()/5000) % ( (currentStatus.type === 'exam' ? reminders.exam : reminders.break).length || 1))] }
                                    </p>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ExamSystem />);
    </script>
</body>
</html>
