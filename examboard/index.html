<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教室監考系統 - 進階人數管理</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; background-color: #f8fafc; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .modal-overlay { animation: fadeIn 0.2s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // --- 圖示組件 ---
        const Icon = ({ children, size = 24, className = "", onClick }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} onClick={onClick} style={{ cursor: onClick ? 'pointer' : 'default' }}>
                {children}
            </svg>
        );

        const Settings = (props) => <Icon {...props}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.47a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.35a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></Icon>;
        const Trash2 = (props) => <Icon {...props}><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></Icon>;
        const Plus = (props) => <Icon {...props}><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></Icon>;
        const Play = (props) => <Icon {...props}><polygon points="5 3 19 12 5 21 5 3"></polygon></Icon>;
        const Pause = (props) => <Icon {...props}><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></Icon>;
        const Upload = (props) => <Icon {...props}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></Icon>;
        const Eye = (props) => <Icon {...props}><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></Icon>;
        const EyeOff = (props) => <Icon {...props}><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07-2.3-2.3"></path><line x1="1" y1="1" x2="23" y2="23"></line></Icon>;

        // --- 設定視窗 ---
        const SettingsModal = ({ isOpen, onClose, reminders, setReminders, subjectOptions, setSubjectOptions, classInfo, setClassInfo }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-black/60 z-[100] flex items-center justify-center p-6 backdrop-blur-sm modal-overlay">
                    <div className="bg-white w-full max-w-6xl h-[85vh] flex flex-col rounded-3xl shadow-2xl overflow-hidden">
                        <div className="p-6 border-b flex justify-between items-center bg-gray-50">
                            <h2 className="text-2xl font-bold">系統進階設定</h2>
                            <button onClick={onClose} className="px-10 py-3 bg-blue-600 text-white rounded-2xl font-bold">儲存並完成</button>
                        </div>
                        <div className="flex-1 overflow-y-auto p-8 grid grid-cols-1 md:grid-cols-3 gap-8">
                            {/* 左：科目與個別考場 */}
                            <section className="bg-blue-50/50 p-6 rounded-3xl border border-blue-100">
                                <h3 className="text-xl font-black text-blue-700 mb-4 flex justify-between">考科選單 & 個別考場人數 <button onClick={() => setSubjectOptions([...subjectOptions, { name: "新科目", specialRoom: 0 }])}><Plus size={20}/></button></h3>
                                {subjectOptions.map((sub, idx) => (
                                    <div key={idx} className="flex gap-2 mb-3 items-center">
                                        <input value={sub.name} onChange={(e) => {
                                            const newOpt = [...subjectOptions]; newOpt[idx].name = e.target.value; setSubjectOptions(newOpt);
                                        }} className="flex-1 p-2 rounded-xl border-none shadow-sm" />
                                        <select value={sub.specialRoom} onChange={(e) => {
                                            const newOpt = [...subjectOptions]; newOpt[idx].specialRoom = parseInt(e.target.value); setSubjectOptions(newOpt);
                                        }} className="p-2 rounded-xl bg-white shadow-sm font-bold text-blue-600">
                                            {[...Array(10).keys()].map(n => <option key={n} value={n}>{n}人</option>)}
                                        </select>
                                        <button onClick={() => setSubjectOptions(subjectOptions.filter((_, i) => i !== idx))} className="text-red-300"><Trash2 size={20}/></button>
                                    </div>
                                ))}
                                <div className="mt-8 pt-6 border-t border-blue-200">
                                    <h3 className="text-xl font-black text-gray-700 mb-4">全班人數設定</h3>
                                    <div className="space-y-4">
                                        <div className="flex items-center justify-between bg-white p-3 rounded-2xl shadow-sm">
                                            <span>全班總人數</span>
                                            <select value={classInfo.total} onChange={(e)=>setClassInfo({...classInfo, total: parseInt(e.target.value)})} className="font-bold text-lg">
                                                {[...Array(41).keys()].map(n => <option key={n} value={n}>{n}人</option>)}
                                            </select>
                                        </div>
                                        <div className="flex items-center justify-between bg-white p-3 rounded-2xl shadow-sm">
                                            <span>今日缺考人數</span>
                                            <select value={classInfo.absent} onChange={(e)=>setClassInfo({...classInfo, absent: parseInt(e.target.value)})} className="font-bold text-lg text-red-500">
                                                {[...Array(41).keys()].map(n => <option key={n} value={n}>{n}人</option>)}
                                            </select>
                                        </div>
                                    </div>
                                </div>
                            </section>
                            
                            {/* 中 & 右：提醒文字 */}
                            <section className="bg-red-50/50 p-6 rounded-3xl border border-red-100">
                                <h3 className="text-xl font-black text-red-600 mb-4">考試提醒文字</h3>
                                {reminders.exam.map((text, idx) => (
                                    <div key={idx} className="flex gap-2 mb-2">
                                        <input value={text} onChange={(e) => {
                                            const newR = [...reminders.exam]; newR[idx] = e.target.value; setReminders({...reminders, exam: newR});
                                        }} className="flex-1 p-2 rounded-xl border-none shadow-sm" />
                                    </div>
                                ))}
                            </section>
                            <section className="bg-green-50/50 p-6 rounded-3xl border border-green-100">
                                <h3 className="text-xl font-black text-green-600 mb-4">下課提醒文字</h3>
                                {reminders.break.map((text, idx) => (
                                    <div key={idx} className="flex gap-2 mb-2">
                                        <input value={text} onChange={(e) => {
                                            const newR = [...reminders.break]; newR[idx] = e.target.value; setReminders({...reminders, break: newR});
                                        }} className="flex-1 p-2 rounded-xl border-none shadow-sm" />
                                    </div>
                                ))}
                            </section>
                        </div>
                    </div>
                </div>
            );
        };

        const ExamSystem = () => {
            const [now, setNow] = useState(new Date());
            const [timeOffset, setTimeOffset] = useState(0);
            const [showReminders, setShowReminders] = useState(true);
            const [showSettings, setShowSettings] = useState(false);
            const [classInfo, setClassInfo] = useState({ total: 25, absent: 0 });
            const [subjectOptions, setSubjectOptions] = useState([
                { name: '國語', specialRoom: 0 }, { name: '自然', specialRoom: 0 }, 
                { name: '英語', specialRoom: 0 }, { name: '數學', specialRoom: 0 }, { name: '社會', specialRoom: 0 }
            ]);
            const [schedule, setSchedule] = useState([
                { id: 1, subject: '國語', start: '08:40', end: '09:20', audio: null }
            ]);
            const [reminders, setReminders] = useState({
                exam: ["考卷記得寫班級姓名座號", "有問題舉手問老師", "耐心細心檢查"],
                break: ["提早上廁所喝水", "桌面淨空"]
            });

            const [playingAudioId, setPlayingAudioId] = useState(null);
            const audioRefs = useRef({});

            useEffect(() => {
                const timer = setInterval(() => setNow(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);

            const adjustedTime = useMemo(() => new Date(now.getTime() + timeOffset), [now, timeOffset]);

            const currentStatus = useMemo(() => {
                const currentTime = adjustedTime.getTime();
                const parseT = (timeStr) => {
                    const [h, m] = timeStr.split(':').map(Number);
                    const d = new Date(adjustedTime); d.setHours(h, m, 0, 0); return d.getTime();
                };
                for (let i = 0; i < schedule.length; i++) {
                    const start = parseT(schedule[i].start); const end = parseT(schedule[i].end);
                    if (currentTime >= start && currentTime <= end) return { type: 'exam', slotIndex: i, timeLeft: end - currentTime, totalDuration: end - start };
                    if (i < schedule.length - 1) {
                        const nextStart = parseT(schedule[i+1].start);
                        if (currentTime > end && currentTime < nextStart) return { type: 'break', nextSlotIndex: i + 1, timeLeft: nextStart - currentTime, totalDuration: nextStart - end };
                    }
                }
                return { type: 'idle' };
            }, [adjustedTime, schedule]);

            return (
                <div className="w-screen h-screen flex flex-col bg-white overflow-hidden">
                    <SettingsModal 
                        isOpen={showSettings} onClose={() => setShowSettings(false)} 
                        reminders={reminders} setReminders={setReminders}
                        subjectOptions={subjectOptions} setSubjectOptions={setSubjectOptions}
                        classInfo={classInfo} setClassInfo={setClassInfo}
                    />

                    {/* 上方：時鐘與切換按鈕 */}
                    <div className="h-1/3 flex border-b-8 border-gray-900">
                        <div className="w-2/3 flex flex-col items-center justify-center bg-gray-900 text-white border-r-4 border-gray-700">
                            <div className="text-[14vh] font-mono font-black">{adjustedTime.toLocaleTimeString('zh-TW', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' })}</div>
                        </div>
                        <div className="w-1/3 p-6 flex flex-col justify-center gap-4 relative">
                            <div className="absolute top-4 right-4 flex gap-4">
                                <button onClick={() => setShowReminders(!showReminders)} className="p-4 bg-gray-100 rounded-2xl">
                                    {showReminders ? <EyeOff size={32}/> : <Eye size={32}/>}
                                </button>
                                <button onClick={() => setShowSettings(true)} className="p-4 bg-gray-100 rounded-2xl"><Settings size={32}/></button>
                            </div>
                            <div className="w-full h-24 bg-gray-100 relative overflow-hidden rounded-3xl border-4 border-gray-800">
                                <div className={`absolute h-full transition-all duration-1000 ${currentStatus.type === 'exam'?'bg-red-500':'bg-green-500'}`} style={{ width: currentStatus.timeLeft ? `${(currentStatus.timeLeft / currentStatus.totalDuration) * 100}%` : '0%' }}></div>
                                <div className="absolute inset-0 flex items-center justify-center z-10 font-black text-2xl">
                                    {currentStatus.type === 'idle' ? '待機中' : `${currentStatus.type === 'exam'?'考試':'休息'}剩餘 ${Math.ceil(currentStatus.timeLeft/60000)} 分`}
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* 下方：3/5 與 2/5 佈局 */}
                    <div className="h-2/3 flex">
                        <div className={`${showReminders ? 'w-3/5' : 'w-full'} p-6 overflow-y-auto transition-all duration-500`}>
                            {schedule.map((item, idx) => {
                                // 取得當前選擇科目的個別考場人數
                                const selectedSub = subjectOptions.find(o => o.name === item.subject);
                                const b = selectedSub ? selectedSub.specialRoom : 0;
                                const a = classInfo.absent;
                                const c = classInfo.total - a - b;

                                return (
                                    <div key={item.id} className={`mb-4 p-6 rounded-[2rem] border-2 flex items-center justify-between ${currentStatus.slotIndex === idx ? 'bg-yellow-50 border-yellow-400 shadow-lg' : 'bg-white border-gray-100'}`}>
                                        <div className="flex flex-col gap-2">
                                            <div className="flex items-center gap-4">
                                                <select value={item.subject} onChange={(e)=>{const s=[...schedule]; s[idx].subject=e.target.value; setSchedule(s);}} className="text-3xl font-black bg-gray-100 px-4 py-2 rounded-xl">
                                                    <option value="">選擇科目</option>
                                                    {subjectOptions.map(o => <option key={o.name} value={o.name}>{o.name}</option>)}
                                                </select>
                                                <div className="text-2xl font-mono font-bold flex items-center gap-2">
                                                    <input type="time" value={item.start} onChange={(e)=>{const s=[...schedule]; s[idx].start=e.target.value; setSchedule(s);}} className="bg-transparent" />
                                                    <span>~</span>
                                                    <input type="time" value={item.end} onChange={(e)=>{const s=[...schedule]; s[idx].end=e.target.value; setSchedule(s);}} className="bg-transparent" />
                                                </div>
                                            </div>
                                            <div className="px-2 text-xl font-bold text-gray-500">
                                                缺考 <span className="text-red-500">{a}</span> 人，個別考場 <span className="text-blue-500">{b}</span> 人，實到 <span className="text-green-600 text-2xl font-black">{c}</span> 人
                                            </div>
                                        </div>
                                        <div className="flex gap-4 items-center">
                                            <label className="cursor-pointer text-gray-400 hover:text-blue-500">
                                                <Upload size={24}/><input type="file" className="hidden" onChange={(e)=>{
                                                    const r = new FileReader(); r.onload=(f)=>setSchedule(schedule.map(s=>s.id===item.id?{...s, audio:f.target.result}:s)); r.readAsDataURL(e.target.files[0]);
                                                }} />
                                            </label>
                                            {item.audio && <button onClick={()=>{
                                                const a=audioRefs.current[item.id]; playingAudioId===item.id?(a.pause(),setPlayingAudioId(null)):(a.play(),setPlayingAudioId(item.id));
                                            }} className="text-blue-500">{playingAudioId===item.id?<Pause size={32}/>:<Play size={32}/>}<audio ref={el=>audioRefs.current[item.id]=el} src={item.audio} onEnded={()=>setPlayingAudioId(null)}/></button>}
                                            <button onClick={()=>setSchedule(schedule.filter(s=>s.id!==item.id))} className="text-red-200 hover:text-red-500"><Trash2 size={24}/></button>
                                        </div>
                                    </div>
                                );
                            })}
                            <button onClick={() => setSchedule([...schedule, { id: Date.now(), subject: '國語', start: '12:00', end: '13:00', audio: null }])} className="w-full py-4 border-4 border-dashed border-gray-100 rounded-[2rem] text-gray-300 text-xl font-bold hover:bg-gray-50 transition-all">+ 增加下一場考試</button>
                        </div>

                        {showReminders && (
                            <div className="w-2/5 h-full bg-blue-50/50 p-10 flex flex-col justify-center items-center text-center">
                                <h2 className="text-2xl font-black text-blue-800 mb-8 border-b-4 border-blue-200 pb-2 w-full uppercase">
                                    {currentStatus.type === 'exam' ? '📋 考試注意事項' : '🔔 準備事項'}
                                </h2>
                                <div className="h-64 flex items-center">
                                    <p className="text-[5vh] font-black text-gray-800 leading-tight">
                                        { (currentStatus.type === 'exam' ? reminders.exam : reminders.break)[Math.floor((Date.now()/5000) % ( (currentStatus.type === 'exam' ? reminders.exam : reminders.break).length || 1))] }
                                    </p>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ExamSystem />);
    </script>
</body>
</html>
