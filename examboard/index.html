<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教室期末考監考系統 - 專業版</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body { margin: 0; padding: 0; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; background-color: #f8fafc; }
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 5px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .clock-shadow { text-shadow: 0 4px 12px rgba(0,0,0,0.3); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // --- Icons ---
        const Icon = ({ children, size = 24, className = "", onClick, disabled }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className} onClick={onClick} style={{ cursor: onClick && !disabled ? 'pointer' : 'default', opacity: disabled ? 0.3 : 1 }}>
                {children}
            </svg>
        );

        const Settings = (props) => <Icon {...props}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.47a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.35a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></Icon>;
        const Eye = (props) => <Icon {...props}><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></Icon>;
        const EyeOff = (props) => <Icon {...props}><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07-2.3-2.3"></path><line x1="1" y1="1" x2="23" y2="23"></line></Icon>;
        const ChevronUp = (props) => <Icon {...props}><polyline points="18 15 12 9 6 15"></polyline></Icon>;
        const ChevronDown = (props) => <Icon {...props}><polyline points="6 9 12 15 18 9"></polyline></Icon>;
        const Trash2 = (props) => <Icon {...props}><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></Icon>;
        const Plus = (props) => <Icon {...props}><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></Icon>;

        const ExamSystem = () => {
            const [now, setNow] = useState(new Date());
            const [timeOffset, setTimeOffset] = useState(0);
            const [showReminders, setShowReminders] = useState(true);
            const [showSettings, setShowSettings] = useState(false);
            const scrollRef = useRef(null);

            const [schedule, setSchedule] = useState(() => {
                const saved = localStorage.getItem('exam_schedule_v2');
                return saved ? JSON.parse(saved) : [
                    { id: 1, subject: '國語', start: '08:30', end: '09:10' },
                    { id: 2, subject: '數學', start: '09:20', end: '10:00' },
                    { id: 3, subject: '社會', start: '10:20', end: '11:00' }
                ];
            });

            const [reminders, setReminders] = useState(() => {
                const saved = localStorage.getItem('exam_reminders_v2');
                return saved ? JSON.parse(saved) : {
                    exam: ["考卷記得寫上班級姓名座號", "不會寫的題目跳過寫會的題目", "耐心、細心、小心", "不要轉頭玩東西，寫完多檢查", "檢查完再檢查或趴下休息", "檢查有沒有寫答案抄錯"],
                    break: ["等監考老師點完再離開座位下課", "準備下個科目與文具用品", "提早上廁所喝水", "桌面淨空", "準備考試、坐在位置上"]
                };
            });

            useEffect(() => {
                const timer = setInterval(() => setNow(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);

            useEffect(() => { localStorage.setItem('exam_schedule_v2', JSON.stringify(schedule)); }, [schedule]);
            useEffect(() => { localStorage.setItem('exam_reminders_v2', JSON.stringify(reminders)); }, [reminders]);

            const adjustedTime = useMemo(() => new Date(now.getTime() + timeOffset), [now, timeOffset]);

            const currentStatus = useMemo(() => {
                const currentTime = adjustedTime.getTime();
                const parseT = (timeStr) => {
                    const [h, m] = timeStr.split(':').map(Number);
                    const d = new Date(adjustedTime);
                    d.setHours(h, m, 0, 0);
                    return d.getTime();
                };
                for (let i = 0; i < schedule.length; i++) {
                    const start = parseT(schedule[i].start);
                    const end = parseT(schedule[i].end);
                    if (i === 0 && currentTime >= start - 600000 && currentTime < start) 
                        return { type: 'break', timeLeft: start - currentTime, totalDuration: 600000 };
                    if (currentTime >= start && currentTime <= end) 
                        return { type: 'exam', slotIndex: i, timeLeft: end - currentTime, totalDuration: end - start };
                    if (i < schedule.length - 1) {
                        const nextStart = parseT(schedule[i+1].start);
                        if (currentTime > end && currentTime < nextStart) 
                            return { type: 'break', timeLeft: nextStart - currentTime, totalDuration: nextStart - end };
                    }
                }
                return { type: 'idle' };
            }, [adjustedTime, schedule]);

            const SettingsModal = () => {
                if (!showSettings) return null;
                const updateItem = (mode, idx, val) => {
                    const next = {...reminders};
                    next[mode][idx] = val;
                    setReminders(next);
                };
                const moveItem = (mode, idx, dir) => {
                    const list = [...reminders[mode]];
                    if ((dir === -1 && idx > 0) || (dir === 1 && idx < list.length - 1)) {
                        [list[idx], list[idx+dir]] = [list[idx+dir], list[idx]];
                        setReminders({...reminders, [mode]: list});
                    }
                };
                return (
                    <div className="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4 backdrop-blur-md">
                        <div className="bg-white w-full max-w-7xl h-[92vh] flex flex-col rounded-3xl shadow-2xl overflow-hidden">
                            <div className="p-8 border-b-2 flex justify-between items-center bg-slate-50">
                                <div>
                                    <h2 className="text-4xl font-black text-slate-800">設定提醒內容與順序</h2>
                                    <p className="text-slate-500 mt-1">編輯後會即時儲存於此瀏覽器</p>
                                </div>
                                <button onClick={() => setShowSettings(false)} className="px-10 py-4 bg-blue-600 text-white rounded-2xl font-bold text-xl hover:bg-blue-700 shadow-lg transition-all active:scale-95">完成退出</button>
                            </div>
                            <div className="flex-1 overflow-y-auto p-10 scroll-smooth" ref={scrollRef}>
                                <div className="grid grid-cols-2 gap-12">
                                    <section>
                                        <div className="flex justify-between items-center mb-6">
                                            <h3 className="text-3xl font-black text-rose-600 flex items-center gap-3">考試中提醒</h3>
                                            <button onClick={() => setReminders({...reminders, exam: [...reminders.exam, "新提醒事項"]})} className="p-2 bg-rose-100 text-rose-600 rounded-full hover:bg-rose-200"><Plus/></button>
                                        </div>
                                        {reminders.exam.map((text, idx) => (
                                            <div key={`exam-${idx}`} className="flex gap-4 mb-4 items-center bg-rose-50/50 p-4 rounded-2xl border border-rose-100">
                                                <div className="flex flex-col gap-1">
                                                    <button onClick={() => moveItem('exam', idx, -1)} className="p-1 hover:text-blue-600 disabled:opacity-10" disabled={idx===0}><ChevronUp size={24}/></button>
                                                    <button onClick={() => moveItem('exam', idx, 1)} className="p-1 hover:text-blue-600 disabled:opacity-10" disabled={idx===reminders.exam.length-1}><ChevronDown size={24}/></button>
                                                </div>
                                                <input value={text} onChange={(e) => updateItem('exam', idx, e.target.value)} className="flex-1 p-4 rounded-xl border-2 border-white focus:border-rose-400 outline-none text-xl font-medium shadow-sm" />
                                                <button onClick={() => {
                                                    const l = [...reminders.exam]; l.splice(idx,1); setReminders({...reminders, exam: l});
                                                }} className="text-rose-300 hover:text-rose-600"><Trash2/></button>
                                            </div>
                                        ))}
                                    </section>
                                    <section>
                                        <div className="flex justify-between items-center mb-6">
                                            <h3 className="text-3xl font-black text-emerald-600 flex items-center gap-3">下課休息提醒</h3>
                                            <button onClick={() => setReminders({...reminders, break: [...reminders.break, "新提醒事項"]})} className="p-2 bg-emerald-100 text-emerald-600 rounded-full hover:bg-emerald-200"><Plus/></button>
                                        </div>
                                        {reminders.break.map((text, idx) => (
                                            <div key={`break-${idx}`} className="flex gap-4 mb-4 items-center bg-emerald-50/50 p-4 rounded-2xl border border-emerald-100">
                                                <div className="flex flex-col gap-1">
                                                    <button onClick={() => moveItem('break', idx, -1)} className="p-1 hover:text-blue-600 disabled:opacity-10" disabled={idx===0}><ChevronUp size={24}/></button>
                                                    <button onClick={() => moveItem('break', idx, 1)} className="p-1 hover:text-blue-600 disabled:opacity-10" disabled={idx===reminders.break.length-1}><ChevronDown size={24}/></button>
                                                </div>
                                                <input value={text} onChange={(e) => updateItem('break', idx, e.target.value)} className="flex-1 p-4 rounded-xl border-2 border-white focus:border-emerald-400 outline-none text-xl font-medium shadow-sm" />
                                                <button onClick={() => {
                                                    const l = [...reminders.break]; l.splice(idx,1); setReminders({...reminders, break: l});
                                                }} className="text-emerald-300 hover:text-emerald-600"><Trash2/></button>
                                            </div>
                                        ))}
                                    </section>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <div className="w-screen h-screen flex flex-col overflow-hidden">
                    <SettingsModal />
                    
                    {/* 上方：時間(2/3)與狀態控制(1/3) */}
                    <div className="h-2/5 flex border-b-8 border-slate-900 shadow-2xl">
                        <div className="w-2/3 flex flex-col items-center justify-center bg-slate-900 text-white relative border-r-4 border-slate-800">
                            <div className="text-[4vh] font-bold text-slate-400 mb-2 tracking-widest">
                                {`民國${adjustedTime.getFullYear()-1911}年 ${adjustedTime.getMonth()+1}月${adjustedTime.getDate()}日 星期${['日','一','二','三','四','五','六'][adjustedTime.getDay()]}`}
                            </div>
                            {/* 加大時間 */}
                            <div className="text-[22vh] font-mono font-black leading-none tracking-tighter clock-shadow">
                                {adjustedTime.toLocaleTimeString('zh-TW', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' })}
                            </div>
                            <div className="absolute right-6 top-1/2 -translate-y-1/2 flex flex-col gap-6 opacity-10 hover:opacity-100 transition-opacity">
                                <button onClick={() => setTimeOffset(o => o + 10000)} className="p-3 bg-slate-700 rounded-xl hover:bg-slate-600"><ChevronUp size={40}/></button>
                                <button onClick={() => setTimeOffset(o => o - 10000)} className="p-3 bg-slate-700 rounded-xl hover:bg-slate-600"><ChevronDown size={40}/></button>
                            </div>
                        </div>

                        <div className="w-1/3 p-8 bg-white flex flex-col justify-between items-center">
                            <div className="w-full flex justify-end gap-4 mb-2">
                                <button onClick={() => setShowSettings(true)} className="p-4 bg-slate-100 text-slate-600 rounded-2xl hover:bg-slate-200 transition-all"><Settings size={36}/></button>
                                <button onClick={() => setShowReminders(!showReminders)} className={`p-4 rounded-2xl text-white transition-all shadow-lg ${showReminders ? 'bg-blue-500 shadow-blue-200' : 'bg-slate-400'}`}>{showReminders ? <EyeOff size={36}/> : <Eye size={36}/>}</button>
                            </div>
                            
                            <div className="w-full h-full flex flex-col justify-center gap-4">
                                {currentStatus.type !== 'idle' ? (
                                    <div className="w-full">
                                        <div className="flex justify-between items-end mb-2">
                                            <span className="text-3xl font-black text-slate-700">{currentStatus.type === 'exam' ? '考試進行中' : '下課休息'}</span>
                                            <span className="text-5xl font-mono font-black text-blue-600">{Math.ceil(currentStatus.timeLeft/60000)} <small className="text-xl">min</small></span>
                                        </div>
                                        <div className="w-full h-12 bg-slate-100 rounded-2xl overflow-hidden border-4 border-slate-200 p-1">
                                            <div className={`h-full rounded-xl transition-all duration-1000 ease-linear ${currentStatus.timeLeft/currentStatus.totalDuration < 0.2 ? 'bg-rose-500' : 'bg-emerald-500'}`} 
                                                 style={{ width: `${(currentStatus.timeLeft/currentStatus.totalDuration)*100}%` }}></div>
                                        </div>
                                    </div>
                                ) : <div className="text-center text-slate-300 text-3xl font-bold italic">目前無排程任務</div>}
                            </div>
                        </div>
                    </div>

                    {/* 下方：排程(1/2 或 1/1)與提醒 */}
                    <div className="h-3/5 flex bg-white">
                        <div className={`h-full transition-all duration-500 overflow-y-auto p-8 ${showReminders ? 'w-1/2 border-r-4 border-slate-100' : 'w-full'}`}>
                            <h3 className="text-2xl font-black text-slate-400 mb-6 uppercase tracking-widest">Exam Schedule / 今日考試時程</h3>
                            {schedule.map((item, idx) => (
                                <div key={item.id} className={`mb-6 p-8 rounded-[2rem] border-4 flex items-center justify-between transition-all ${currentStatus.slotIndex === idx ? 'bg-yellow-50 border-yellow-400 scale-[1.02] shadow-xl' : 'bg-white border-slate-50'}`}>
                                    <input value={item.subject} onChange={(e) => {
                                        const n = [...schedule]; n[idx].subject = e.target.value; setSchedule(n);
                                    }} className="text-[5vh] font-black bg-transparent w-48 text-center outline-none" />
                                    <div className="flex items-center gap-4 text-[4.5vh] font-mono font-black text-slate-700">
                                        <input type="time" value={item.start} onChange={(e) => {
                                            const n = [...schedule]; n[idx].start = e.target.value; setSchedule(n);
                                        }} className="bg-transparent" />
                                        <span className="text-slate-300">▶</span>
                                        <input type="time" value={item.end} onChange={(e) => {
                                            const n = [...schedule]; n[idx].end = e.target.value; setSchedule(n);
                                        }} className="bg-transparent" />
                                    </div>
                                </div>
                            ))}
                        </div>

                        {showReminders && (
                            <div className="w-1/2 h-full bg-slate-50 p-12 flex flex-col justify-center items-center text-center animate-in slide-in-from-right duration-500">
                                <div className="bg-white p-12 rounded-[3rem] shadow-xl border-2 border-slate-100 w-full">
                                    <h2 className={`text-4xl font-black mb-10 px-6 py-2 rounded-full inline-block ${currentStatus.type === 'exam' ? 'bg-rose-100 text-rose-600' : 'bg-emerald-100 text-emerald-600'}`}>
                                        {currentStatus.type === 'exam' ? '考試注意事項' : '下課準備事項'}
                                    </h2>
                                    <div className="min-h-[20vh] flex items-center justify-center">
                                        <p className="text-[7.5vh] font-black text-slate-800 leading-snug tracking-tight">
                                            { (currentStatus.type === 'exam' ? reminders.exam : reminders.break)[Math.floor((Date.now()/6000) % ( (currentStatus.type === 'exam' ? reminders.exam : reminders.break).length || 1))] }
                                        </p>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ExamSystem />);
    </script>
</body>
</html>
