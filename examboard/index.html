<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教室期末考監考系統</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body { margin: 0; padding: 0; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; background-color: #f8fafc; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .modal-overlay { animation: fadeIn 0.2s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // --- 圖示組件 ---
        const Icon = ({ children, size = 24, className = "", onClick, disabled }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} onClick={onClick} style={{ cursor: onClick && !disabled ? 'pointer' : 'default', opacity: disabled ? 0.3 : 1 }}>
                {children}
            </svg>
        );

        const Settings = (props) => <Icon {...props}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.47a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.35a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></Icon>;
        const Eye = (props) => <Icon {...props}><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></Icon>;
        const EyeOff = (props) => <Icon {...props}><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07-2.3-2.3"></path><line x1="1" y1="1" x2="23" y2="23"></line></Icon>;
        const ChevronUp = (props) => <Icon {...props}><polyline points="18 15 12 9 6 15"></polyline></Icon>;
        const ChevronDown = (props) => <Icon {...props}><polyline points="6 9 12 15 18 9"></polyline></Icon>;
        const Trash2 = (props) => <Icon {...props}><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></Icon>;
        const Plus = (props) => <Icon {...props}><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></Icon>;

        const ExamSystem = () => {
            const [now, setNow] = useState(new Date());
            const [timeOffset, setTimeOffset] = useState(0);
            const [showReminders, setShowReminders] = useState(true);
            const [showSettings, setShowSettings] = useState(false);
            const [schedule, setSchedule] = useState([
                { id: 1, subject: '國語', start: '08:30', end: '09:10' },
                { id: 2, subject: '數學', start: '09:20', end: '10:00' },
                { id: 3, subject: '社會', start: '10:20', end: '11:00' },
            ]);
            const [attendance, setAttendance] = useState({ expected: '', actual: '', absent: '' });
            const [reminders, setReminders] = useState({
                exam: ["考卷記得寫上班級姓名座號", "有問題舉手問老師", "不會寫的題目跳過寫會的題目", "耐心、細心、小心", "不要轉頭玩東西，寫完多檢查", "檢查完再檢查或趴下休息", "考試即將結束，檢查有沒有寫答案抄錯"],
                break: ["等監考老師點完再離開座位下課", "利用下課準備下個科目與文具用品", "提早上廁所喝水", "桌面淨空", "準備考試、坐在位置上"]
            });

            useEffect(() => {
                const timer = setInterval(() => setNow(new Date()), 1000);
                const savedSchedule = localStorage.getItem('exam_schedule');
                if (savedSchedule) setSchedule(JSON.parse(savedSchedule));
                return () => clearInterval(timer);
            }, []);

            useEffect(() => { localStorage.setItem('exam_schedule', JSON.stringify(schedule)); }, [schedule]);

            const adjustedTime = useMemo(() => new Date(now.getTime() + timeOffset), [now, timeOffset]);

            const currentStatus = useMemo(() => {
                const currentTime = adjustedTime.getTime();
                const parseT = (timeStr) => {
                    const [h, m] = timeStr.split(':').map(Number);
                    const d = new Date(adjustedTime);
                    d.setHours(h, m, 0, 0);
                    return d.getTime();
                };

                for (let i = 0; i < schedule.length; i++) {
                    const start = parseT(schedule[i].start);
                    const end = parseT(schedule[i].end);
                    if (i === 0 && currentTime >= start - 600000 && currentTime < start) {
                        return { type: 'break', nextSlotIndex: i, timeLeft: start - currentTime, totalDuration: 600000 };
                    }
                    if (currentTime >= start && currentTime <= end) {
                        return { type: 'exam', slotIndex: i, timeLeft: end - currentTime, totalDuration: end - start };
                    }
                    if (i < schedule.length - 1) {
                        const nextStart = parseT(schedule[i+1].start);
                        if (currentTime > end && currentTime < nextStart) {
                            return { type: 'break', nextSlotIndex: i + 1, timeLeft: nextStart - currentTime, totalDuration: nextStart - end };
                        }
                    }
                }
                return { type: 'idle' };
            }, [adjustedTime, schedule]);

            const SettingsModal = () => {
                if (!showSettings) return null;
                const handleReminderChange = (mode, index, val) => {
                    const newRem = {...reminders};
                    newRem[mode][index] = val;
                    setReminders(newRem);
                };
                const moveReminder = (mode, index, dir) => {
                    const list = [...reminders[mode]];
                    if ((dir === -1 && index > 0) || (dir === 1 && index < list.length - 1)) {
                        [list[index], list[index+dir]] = [list[index+dir], list[index]];
                        setReminders({...reminders, [mode]: list});
                    }
                };
                return (
                    <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-6 backdrop-blur-sm modal-overlay">
                        <div className="bg-white w-full max-w-5xl h-[85vh] flex flex-col rounded-3xl shadow-2xl overflow-hidden">
                            <div className="p-6 border-b flex justify-between items-center bg-gray-50">
                                <h2 className="text-3xl font-bold text-gray-800">編輯提醒內容</h2>
                                <button onClick={() => setShowSettings(false)} className="px-10 py-3 bg-blue-600 text-white rounded-2xl font-bold hover:bg-blue-700 transition-all shadow-lg active:scale-95">完成並儲存</button>
                            </div>
                            <div className="flex-1 overflow-y-auto p-8">
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-12">
                                    <section>
                                        <div className="flex justify-between items-center mb-6 border-b-2 border-red-100 pb-2">
                                            <h3 className="text-2xl font-black text-red-600">考試中文字</h3>
                                            <button onClick={() => setReminders({...reminders, exam: [...reminders.exam, "新提醒內容"]})} className="p-2 bg-red-500 text-white rounded-full hover:bg-red-600"><Plus/></button>
                                        </div>
                                        {reminders.exam.map((text, idx) => (
                                            <div key={idx} className="flex gap-3 mb-4 items-center bg-red-50 p-3 rounded-2xl border border-red-100">
                                                <div className="flex flex-col">
                                                    <button onClick={() => moveReminder('exam', idx, -1)} className="p-1 hover:text-red-600 disabled:opacity-10" disabled={idx===0}><ChevronUp size={20}/></button>
                                                    <button onClick={() => moveReminder('exam', idx, 1)} className="p-1 hover:text-red-600 disabled:opacity-10" disabled={idx===reminders.exam.length-1}><ChevronDown size={20}/></button>
                                                </div>
                                                <input value={text} onChange={(e) => handleReminderChange('exam', idx, e.target.value)} className="flex-1 p-3 rounded-xl border-none focus:ring-2 focus:ring-red-400 outline-none text-lg font-medium" />
                                                <button onClick={() => {
                                                    const list = [...reminders.exam];
                                                    list.splice(idx, 1);
                                                    setReminders({...reminders, exam: list});
                                                }} className="text-red-300 hover:text-red-600"><Trash2/></button>
                                            </div>
                                        ))}
                                    </section>
                                    <section>
                                        <div className="flex justify-between items-center mb-6 border-b-2 border-green-100 pb-2">
                                            <h3 className="text-2xl font-black text-green-600">下課中文字</h3>
                                            <button onClick={() => setReminders({...reminders, break: [...reminders.break, "新提醒內容"]})} className="p-2 bg-green-500 text-white rounded-full hover:bg-green-600"><Plus/></button>
                                        </div>
                                        {reminders.break.map((text, idx) => (
                                            <div key={idx} className="flex gap-3 mb-4 items-center bg-green-50 p-3 rounded-2xl border border-green-100">
                                                <div className="flex flex-col">
                                                    <button onClick={() => moveReminder('break', idx, -1)} className="p-1 hover:text-green-600 disabled:opacity-10" disabled={idx===0}><ChevronUp size={20}/></button>
                                                    <button onClick={() => moveReminder('break', idx, 1)} className="p-1 hover:text-green-600 disabled:opacity-10" disabled={idx===reminders.break.length-1}><ChevronDown size={20}/></button>
                                                </div>
                                                <input value={text} onChange={(e) => handleReminderChange('break', idx, e.target.value)} className="flex-1 p-3 rounded-xl border-none focus:ring-2 focus:ring-green-400 outline-none text-lg font-medium" />
                                                <button onClick={() => {
                                                    const list = [...reminders.break];
                                                    list.splice(idx, 1);
                                                    setReminders({...reminders, break: list});
                                                }} className="text-green-300 hover:text-green-600"><Trash2/></button>
                                            </div>
                                        ))}
                                    </section>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <div className="w-screen h-screen flex flex-col overflow-hidden">
                    <SettingsModal />
                    
                    {/* 上方區塊：2/3 時間 | 1/3 倒數與主控按鈕 */}
                    <div className="h-1/3 flex border-b-8 border-gray-900 bg-white">
                        <div className="w-2/3 flex flex-col items-center justify-center bg-gray-900 text-white relative border-r-4 border-gray-700">
                            <div className="text-[3vh] font-bold text-gray-400 mb-2">
                                {`民國${adjustedTime.getFullYear()-1911}年${adjustedTime.getMonth()+1}月${adjustedTime.getDate()}日 星期${['日','一','二','三','四','五','六'][adjustedTime.getDay()]}`}
                            </div>
                            <div className="text-[14vh] font-mono font-black leading-none tracking-tighter">
                                {adjustedTime.toLocaleTimeString('zh-TW', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' })}
                            </div>
                            <div className="absolute right-4 top-1/2 -translate-y-1/2 flex flex-col gap-4 opacity-10 hover:opacity-100 transition-opacity">
                                <button onClick={() => setTimeOffset(o => o + 10000)} className="p-2 bg-gray-700 rounded-lg"><ChevronUp size={32}/></button>
                                <button onClick={() => setTimeOffset(o => o - 10000)} className="p-2 bg-gray-700 rounded-lg"><ChevronDown size={32}/></button>
                            </div>
                        </div>

                        <div className="w-1/3 p-6 bg-white flex flex-col justify-center gap-4 relative">
                            {/* 右上角控制按鈕 */}
                            <div className="absolute top-4 right-4 flex gap-3">
                                <button onClick={() => setShowReminders(!showReminders)} className={`p-3 rounded-xl transition-all ${showReminders ? 'bg-blue-100 text-blue-600' : 'bg-gray-100 text-gray-400'}`}>
                                    {showReminders ? <EyeOff size={28}/> : <Eye size={28}/>}
                                </button>
                                <button onClick={() => setShowSettings(true)} className="p-3 bg-gray-100 text-gray-600 rounded-xl hover:bg-gray-200 transition-all">
                                    <Settings size={28}/>
                                </button>
                            </div>
                            
                            {/* 進度條 */}
                            <div className="w-full">
                                {currentStatus.type === 'idle' ? (
                                    <div className="h-24 bg-gray-50 flex items-center justify-center text-gray-400 text-2xl font-black rounded-3xl border-4 border-dashed border-gray-200">待機中</div>
                                ) : (
                                    <div className="w-full h-24 bg-gray-100 relative overflow-hidden rounded-3xl border-4 border-gray-800">
                                        <div className={`absolute top-0 left-0 h-full transition-all duration-1000 ease-linear ${Math.max(0, Math.min(100, (currentStatus.timeLeft / currentStatus.totalDuration) * 100)) <= 25 ? "bg-red-500" : (Math.max(0, Math.min(100, (currentStatus.timeLeft / currentStatus.totalDuration) * 100)) <= 50 ? "bg-yellow-400" : "bg-green-500")}`} style={{ width: `${Math.max(0, Math.min(100, (currentStatus.timeLeft / currentStatus.totalDuration) * 100))}%` }}></div>
                                        <div className="absolute inset-0 flex items-center justify-center z-10">
                                            <span className="text-3xl font-black text-gray-900 bg-white/80 px-6 py-2 rounded-2xl shadow-sm">
                                                {currentStatus.type === 'exam' ? '考試' : '休息'}剩餘 {Math.ceil(currentStatus.timeLeft / 60000)} 分
                                            </span>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>

                    {/* 下方區塊 */}
                    <div className="h-2/3 flex relative bg-white">
                        <div className={`h-full transition-all duration-500 flex flex-col ${showReminders ? 'w-1/2 border-r-8 border-gray-100' : 'w-full'}`}>
                            {/* 課表區 */}
                            <div className="flex-1 p-6 overflow-y-auto">
                                {schedule.map((item, idx) => (
                                    <div key={item.id} className={`mb-4 p-6 rounded-3xl border-4 flex items-center justify-between transition-all ${currentStatus.slotIndex === idx ? 'bg-yellow-50 border-yellow-400 scale-[1.02] shadow-xl' : 'bg-white border-gray-100'}`}>
                                        <div className="flex items-center gap-8 flex-1">
                                            <input value={item.subject} onChange={(e) => {
                                                const newS = [...schedule];
                                                newS[idx].subject = e.target.value;
                                                setSchedule(newS);
                                            }} className="text-[5vh] font-black bg-transparent border-b-4 border-transparent focus:border-blue-500 outline-none w-40 text-center" />
                                            <div className="flex items-center gap-4 text-[4vh] font-mono font-black text-gray-700">
                                                <input type="time" value={item.start} onChange={(e) => {
                                                    const newS = [...schedule];
                                                    newS[idx].start = e.target.value;
                                                    setSchedule(newS);
                                                }} className="bg-transparent" />
                                                <span className="text-gray-300">~</span>
                                                <input type="time" value={item.end} onChange={(e) => {
                                                    const newS = [...schedule];
                                                    newS[idx].end = e.target.value;
                                                    setSchedule(newS);
                                                }} className="bg-transparent" />
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                            
                            {/* 人數統計區 */}
                            <div className="h-40 bg-gray-50 border-t-8 border-gray-100 p-6 flex items-center justify-around">
                                <div className="flex gap-12 items-center">
                                    <div className="flex flex-col items-center">
                                        <span className="text-gray-400 font-black mb-1">應到</span>
                                        <input value={attendance.expected} onChange={e=>setAttendance({...attendance, expected:e.target.value})} className="w-24 text-5xl font-black text-center bg-white rounded-2xl border-4 border-gray-200 p-2 shadow-inner" />
                                    </div>
                                    <div className="flex flex-col items-center">
                                        <span className="text-blue-400 font-black mb-1">實到</span>
                                        <input value={attendance.actual} onChange={e=>setAttendance({...attendance, actual:e.target.value})} className="w-24 text-5xl font-black text-center bg-white rounded-2xl border-4 border-blue-200 p-2 text-blue-600 shadow-inner" />
                                    </div>
                                    <div className="flex flex-col items-center">
                                        <span className="text-red-400 font-black mb-1">未到/備註</span>
                                        <textarea value={attendance.absent} onChange={e=>setAttendance({...attendance, absent:e.target.value})} className="w-80 h-24 text-2xl font-bold bg-white rounded-2xl border-4 border-red-100 p-3 resize-none text-red-500 shadow-inner" placeholder="座號 / 原因" />
                                    </div>
                                </div>
                            </div>
                        </div>

                        {showReminders && (
                            <div className="w-1/2 h-full bg-blue-50 p-12 flex flex-col justify-center items-center text-center animate-in slide-in-from-right duration-500">
                                <h2 className="text-4xl font-black text-blue-800 mb-12 border-b-8 border-blue-200 pb-6 w-full uppercase tracking-[0.2em]">
                                    {currentStatus.type === 'exam' ? '📋 考試注意事項' : '🔔 下課準備事項'}
                                </h2>
                                <div className="h-64 flex items-center">
                                    <p className="text-[7.5vh] font-black text-gray-800 leading-tight drop-shadow-sm">
                                        { (currentStatus.type === 'exam' ? reminders.exam : reminders.break)[Math.floor((Date.now()/5000) % ( (currentStatus.type === 'exam' ? reminders.exam : reminders.break).length || 1))] }
                                    </p>
                                </div>
                                <div className="mt-12 flex gap-2">
                                    {(currentStatus.type === 'exam' ? reminders.exam : reminders.break).map((_, i) => (
                                        <div key={i} className={`h-3 w-3 rounded-full transition-all duration-500 ${Math.floor((Date.now()/5000) % ((currentStatus.type === 'exam' ? reminders.exam : reminders.break).length || 1)) === i ? 'w-12 bg-blue-500' : 'bg-blue-200'}`}></div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ExamSystem />);
    </script>
</body>
</html>
