<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教室監考系統 - 專業版</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; background-color: #f8fafc; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .modal-overlay { animation: fadeIn 0.2s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        select { appearance: none; background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right 0.5rem center; background-size: 1.5em; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // --- 圖示組件 ---
        const Icon = ({ children, size = 24, className = "", onClick }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} onClick={onClick} style={{ cursor: onClick ? 'pointer' : 'default' }}>
                {children}
            </svg>
        );

        const Settings = (props) => <Icon {...props}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.47a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.35a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></Icon>;
        const Trash2 = (props) => <Icon {...props}><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></Icon>;
        const Plus = (props) => <Icon {...props}><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></Icon>;
        const Play = (props) => <Icon {...props}><polygon points="5 3 19 12 5 21 5 3"></polygon></Icon>;
        const Pause = (props) => <Icon {...props}><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></Icon>;
        const Upload = (props) => <Icon {...props}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></Icon>;

        // --- 設定視窗 ---
        const SettingsModal = ({ isOpen, onClose, reminders, setReminders, subjectOptions, setSubjectOptions }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-black/60 z-[100] flex items-center justify-center p-6 backdrop-blur-sm modal-overlay">
                    <div className="bg-white w-full max-w-6xl h-[85vh] flex flex-col rounded-3xl shadow-2xl overflow-hidden">
                        <div className="p-6 border-b flex justify-between items-center bg-gray-50">
                            <h2 className="text-2xl font-bold">系統設定</h2>
                            <button onClick={onClose} className="px-8 py-2 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700">完成</button>
                        </div>
                        <div className="flex-1 overflow-y-auto p-8 grid grid-cols-1 md:grid-cols-3 gap-8">
                            {/* 科目清單設定 */}
                            <section className="bg-gray-50 p-6 rounded-2xl">
                                <h3 className="text-xl font-black text-blue-600 mb-4 flex justify-between items-center">
                                    考科選單內容
                                    <button onClick={() => setSubjectOptions([...subjectOptions, "新科目"])} className="p-1 bg-blue-100 rounded-full text-blue-600"><Plus size={20}/></button>
                                </h3>
                                {subjectOptions.map((sub, idx) => (
                                    <div key={idx} className="flex gap-2 mb-2">
                                        <input value={sub} onChange={(e) => {
                                            const newOpt = [...subjectOptions];
                                            newOpt[idx] = e.target.value;
                                            setSubjectOptions(newOpt);
                                        }} className="flex-1 p-2 rounded-lg border border-gray-200" />
                                        <button onClick={() => setSubjectOptions(subjectOptions.filter((_, i) => i !== idx))} className="text-red-400 hover:text-red-600"><Trash2 size={20}/></button>
                                    </div>
                                ))}
                            </section>
                            {/* 提醒文字設定 */}
                            <section className="bg-red-50 p-6 rounded-2xl">
                                <h3 className="text-xl font-black text-red-600 mb-4 flex justify-between items-center">
                                    考試提醒文字
                                    <button onClick={() => setReminders({...reminders, exam: [...reminders.exam, "新提醒"]})} className="p-1 bg-red-100 rounded-full"><Plus size={20}/></button>
                                </h3>
                                {reminders.exam.map((text, idx) => (
                                    <div key={idx} className="flex gap-2 mb-2">
                                        <input value={text} onChange={(e) => {
                                            const newR = [...reminders.exam]; newR[idx] = e.target.value;
                                            setReminders({...reminders, exam: newR});
                                        }} className="flex-1 p-2 rounded-lg border-none" />
                                        <button onClick={() => {
                                            const newR = reminders.exam.filter((_, i) => i !== idx);
                                            setReminders({...reminders, exam: newR});
                                        }} className="text-red-300"><Trash2 size={20}/></button>
                                    </div>
                                ))}
                            </section>
                            <section className="bg-green-50 p-6 rounded-2xl">
                                <h3 className="text-xl font-black text-green-600 mb-4 flex justify-between items-center">
                                    下課提醒文字
                                    <button onClick={() => setReminders({...reminders, break: [...reminders.break, "新提醒"]})} className="p-1 bg-green-100 rounded-full"><Plus size={20}/></button>
                                </h3>
                                {reminders.break.map((text, idx) => (
                                    <div key={idx} className="flex gap-2 mb-2">
                                        <input value={text} onChange={(e) => {
                                            const newR = [...reminders.break]; newR[idx] = e.target.value;
                                            setReminders({...reminders, break: newR});
                                        }} className="flex-1 p-2 rounded-lg border-none" />
                                        <button onClick={() => {
                                            const newR = reminders.break.filter((_, i) => i !== idx);
                                            setReminders({...reminders, break: newR});
                                        }} className="text-green-300"><Trash2 size={20}/></button>
                                    </div>
                                ))}
                            </section>
                        </div>
                    </div>
                </div>
            );
        };

        const ExamSystem = () => {
            const [now, setNow] = useState(new Date());
            const [timeOffset, setTimeOffset] = useState(0);
            const [showReminders, setShowReminders] = useState(true);
            const [showSettings, setShowSettings] = useState(false);
            
            // 狀態：科目選項
            const [subjectOptions, setSubjectOptions] = useState(['國語', '自然', '英語', '數學', '社會']);
            
            // 狀態：當前考試清單
            const [schedule, setSchedule] = useState([
                { id: 1, subject: '國語', start: '08:40', end: '09:20', audio: null },
                { id: 2, subject: '數學', start: '09:30', end: '10:10', audio: null }
            ]);

            const [reminders, setReminders] = useState({
                exam: ["考卷記得寫上班級姓名座號", "有問題舉手問老師", "不會寫的題目跳過寫會的題目", "耐心、細心、小心"],
                break: ["等監考老師點完再下課", "桌面淨空", "提早上廁所喝水"]
            });

            const [playingAudioId, setPlayingAudioId] = useState(null);
            const audioRefs = useRef({});

            useEffect(() => {
                const timer = setInterval(() => setNow(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);

            const adjustedTime = useMemo(() => new Date(now.getTime() + timeOffset), [now, timeOffset]);

            const currentStatus = useMemo(() => {
                const currentTime = adjustedTime.getTime();
                const parseT = (timeStr) => {
                    const [h, m] = timeStr.split(':').map(Number);
                    const d = new Date(adjustedTime);
                    d.setHours(h, m, 0, 0);
                    return d.getTime();
                };
                for (let i = 0; i < schedule.length; i++) {
                    const start = parseT(schedule[i].start);
                    const end = parseT(schedule[i].end);
                    if (currentTime >= start && currentTime <= end) return { type: 'exam', slotIndex: i, timeLeft: end - currentTime, totalDuration: end - start };
                    if (i < schedule.length - 1) {
                        const nextStart = parseT(schedule[i+1].start);
                        if (currentTime > end && currentTime < nextStart) return { type: 'break', nextSlotIndex: i + 1, timeLeft: nextStart - currentTime, totalDuration: nextStart - end };
                    }
                }
                return { type: 'idle' };
            }, [adjustedTime, schedule]);

            const handleAudioUpload = (id, file) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    setSchedule(schedule.map(item => item.id === id ? { ...item, audio: e.target.result } : item));
                };
                reader.readAsDataURL(file);
            };

            return (
                <div className="w-screen h-screen flex flex-col overflow-hidden bg-white">
                    <SettingsModal 
                        isOpen={showSettings} 
                        onClose={() => setShowSettings(false)} 
                        reminders={reminders} setReminders={setReminders}
                        subjectOptions={subjectOptions} setSubjectOptions={setSubjectOptions}
                    />
                    
                    {/* 上方：時鐘與狀態 */}
                    <div className="h-1/3 flex border-b-8 border-gray-900">
                        <div className="w-2/3 flex flex-col items-center justify-center bg-gray-900 text-white border-r-4 border-gray-700">
                            <div className="text-[3vh] font-bold text-gray-400 mb-2">民國{adjustedTime.getFullYear()-1911}年{adjustedTime.getMonth()+1}月{adjustedTime.getDate()}日</div>
                            <div className="text-[14vh] font-mono font-black">{adjustedTime.toLocaleTimeString('zh-TW', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' })}</div>
                        </div>
                        <div className="w-1/3 p-6 flex flex-col justify-center gap-4 relative">
                            <button onClick={() => setShowSettings(true)} className="absolute top-4 right-4 p-4 bg-gray-100 rounded-2xl hover:bg-gray-200"><Settings size={32}/></button>
                            <div className="w-full h-24 bg-gray-100 relative overflow-hidden rounded-3xl border-4 border-gray-800">
                                <div className={`absolute top-0 left-0 h-full transition-all duration-1000 ${currentStatus.type === 'exam' ? 'bg-red-500' : 'bg-green-500'}`} style={{ width: currentStatus.timeLeft ? `${(currentStatus.timeLeft / currentStatus.totalDuration) * 100}%` : '0%' }}></div>
                                <div className="absolute inset-0 flex items-center justify-center z-10 font-black text-2xl">
                                    {currentStatus.type === 'idle' ? '待機中' : `${currentStatus.type === 'exam'?'考試':'休息'}剩餘 ${Math.ceil(currentStatus.timeLeft/60000)} 分`}
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* 下方：主畫面 3/5 與 2/5 比例 */}
                    <div className="h-2/3 flex">
                        {/* 左側 3/5：考試科目進度 */}
                        <div className="w-3/5 h-full p-6 overflow-y-auto border-r-4 border-gray-50">
                            <h3 className="text-xl font-bold mb-4 text-gray-400 flex items-center gap-2">● 考試科目進度</h3>
                            {schedule.map((item, idx) => (
                                <div key={item.id} className={`mb-4 p-4 rounded-3xl border-2 flex items-center justify-between ${currentStatus.slotIndex === idx ? 'bg-yellow-50 border-yellow-400' : 'bg-white border-gray-100'}`}>
                                    <div className="flex items-center gap-4">
                                        {/* 修改：改為下拉選單 */}
                                        <select 
                                            value={item.subject} 
                                            onChange={(e) => {
                                                const newS = [...schedule];
                                                newS[idx].subject = e.target.value;
                                                setSchedule(newS);
                                            }}
                                            className="text-2xl font-black bg-gray-50 border-2 border-gray-200 rounded-xl px-4 py-2 outline-none focus:border-blue-500 min-w-[150px]"
                                        >
                                            <option value="">選擇科目</option>
                                            {subjectOptions.map(opt => <option key={opt} value={opt}>{opt}</option>)}
                                        </select>
                                        
                                        <div className="flex items-center gap-2 text-2xl font-mono font-bold">
                                            <input type="time" value={item.start} onChange={(e)=>{const s=[...schedule]; s[idx].start=e.target.value; setSchedule(s);}} className="bg-transparent" />
                                            <span>~</span>
                                            <input type="time" value={item.end} onChange={(e)=>{const s=[...schedule]; s[idx].end=e.target.value; setSchedule(s);}} className="bg-transparent" />
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-4">
                                        <label className="cursor-pointer text-gray-400 hover:text-blue-500"><Upload size={20}/><input type="file" className="hidden" onChange={(e) => handleAudioUpload(item.id, e.target.files[0])} /></label>
                                        {item.audio && <button onClick={() => {
                                            const a = audioRefs.current[item.id];
                                            playingAudioId === item.id ? (a.pause(), setPlayingAudioId(null)) : (a.play(), setPlayingAudioId(item.id));
                                        }}>{playingAudioId === item.id ? <Pause size={24}/> : <Play size={24}/>}<audio ref={el=>audioRefs.current[item.id]=el} src={item.audio} onEnded={()=>setPlayingAudioId(null)}/></button>}
                                        <button onClick={() => setSchedule(schedule.filter(s => s.id !== item.id))} className="text-red-300 hover:text-red-500"><Trash2 size={24}/></button>
                                    </div>
                                </div>
                            ))}
                            <button onClick={() => setSchedule([...schedule, { id: Date.now(), subject: '國語', start: '12:00', end: '13:00', audio: null }])} className="w-full py-3 border-2 border-dashed border-gray-200 rounded-2xl text-gray-400 font-bold hover:bg-gray-50">+ 增加節次</button>
                        </div>

                        {/* 右側 2/5：注意事項 */}
                        <div className="w-2/5 h-full bg-blue-50 p-10 flex flex-col justify-center items-center text-center">
                            <h2 className="text-2xl font-black text-blue-800 mb-6 border-b-4 border-blue-200 pb-2 w-full uppercase">
                                {currentStatus.type === 'exam' ? '📋 考試注意事項' : '🔔 準備事項'}
                            </h2>
                            <div className="h-64 flex items-center">
                                <p className="text-[5vh] font-black text-gray-800 leading-tight">
                                    { (currentStatus.type === 'exam' ? reminders.exam : reminders.break)[Math.floor((Date.now()/5000) % ( (currentStatus.type === 'exam' ? reminders.exam : reminders.break).length || 1))] }
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ExamSystem />);
    </script>
</body>
</html>
