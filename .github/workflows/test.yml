name: Secret Debug Test

on:
  workflow_dispatch: # 手動執行

jobs:
  debug-job:
    runs-on: ubuntu-latest
    steps:
      - name: Debug Secrets
        run: |
          echo "開始檢查環境變數..."
          if [ -z "$TEST_ID" ]; then echo "❌ JSONBIN_BIN_ID 抓不到"; else echo "✅ JSONBIN_BIN_ID 已讀取"; fi
          if [ -z "$DEBUG_VAL" ]; then echo "❌ MY_DEBUG_SECRET 抓不到"; else echo "✅ MY_DEBUG_SECRET 已讀取"; fi
        env:
          TEST_ID: ${{ secrets.JSONBIN_BIN_ID }}
          DEBUG_VAL: ${{ secrets.MY_DEBUG_SECRET }}
