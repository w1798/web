<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClassDojo 點數統計</title>

<script>
    document.documentElement.style.visibility = 'hidden';
    const APP_VER = "1.00c";
</script>
<script src="../loader_engine.js?ver=1.00d"></script>

</head>
<body class="theme-1">

    <header class="app-header">
        <div class="header-brand">ClassDojo 點數統計</div>
        <div class="header-right">
            <button class="nav-btn" onclick="cloudAction('upload')">雲端上傳</button>
            <button class="nav-btn" onclick="cloudAction('download')">雲端下載</button>
            <button class="nav-btn" onclick="exportData()">匯出備份</button>
            <button class="nav-btn" onclick="triggerImport()">匯入備份</button>
            <button class="nav-btn" onclick="clearResults()">清除結果</button>
            <button class="nav-btn" onclick="toggleModal('settingsModal', true)">設定</button>
        </div>
    </header>

    <main class="app-main">
        <section class="tool-controls-bar">
            <div class="control-item">
                <label>載入 CSV：</label>
                <input type="file" id="csvFile" accept=".csv" onchange="processData()">
            </div>
            <button class="btn-success main-ctrl" onclick="copyScoresOnly()">複製點數</button>
            <button class="btn-primary main-ctrl" onclick="copyStudentNames()">複製姓名</button>
            <button class="btn-orange main-ctrl" onclick="showSummary()">點數總覽</button>

        </section>
                    <span style="white-space: nowrap;">
★ 快速建置學生名單：可到 <a href="https://w1798.github.io/web/TextLab" target="_blank" class="url-link" style="color:#c53030">多功能文字處理器</a> 在 原始資料1 中貼上學生姓名，功能表中間下面的「編號」選2，按執行即可
                    </span>
        <div id="tableContainer">
            <table id="resultTable" style="display:none;">
                <thead>
                    <tr>
                        <th onclick="sortTable(0)">學生姓名 (點擊詳情) <span id="sortIcon0">▲▼</span></th>
                        <th onclick="sortTable(1)">計算總點數 <span id="sortIcon1">▲▼</span></th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>

    </main>
    
    <button id="backToTop" onclick="scrollToTop()">↑</button>
        
    <footer></footer>

    <div id="settingsModal" class="modal-overlay">
        <div class="modal-wrapper">
            <div class="modal-header">
                <span class="fixed-title">相關功能設定 (規則有多個時，請用空白鍵分開關鍵字)</span>
                <div class="top-btns">
                    <button class="btn-danger" style="background:#F3F3FA; color:black; border:none; margin-right:auto;" onclick="resetSettings()">重置設定</button>
                    <button onclick="toggleModal('settingsModal', false)">取消</button>
                    <button class="btn-confirm" onclick="saveSettings()">認定</button>
                </div>
            </div>
            <div class="modal-body settings-grid">
                <div class="settings-col">
                    <h3 class="col-title">🎨 介面風格</h3>
                    <div class="form-row"><label>字體大小</label><input type="number" id="setFontSize"></div>
                    <div class="form-row">
                        <label>顯示姓氏</label>
                        <select id="setShowSurname">
                            <option value="false">否</option>
                            <option value="true">是</option>
                        </select>
                    </div>
                </div>
                <div class="settings-col">
                    <h3 class="col-title">🔢 計算規則</h3>
                    <div class="form-row"><label>計算關鍵字</label><input type="text" id="setInc"></div>
                    <div class="form-row"><label>排除關鍵字</label><input type="text" id="setExc"></div>
                    <div class="form-row"><label>負點關鍵字</label><input type="text" id="setMin"></div>
                </div>
                <div class="settings-col">
                    <h3 class="col-title">☁️ 雲端同步 (<a href="https://w1798.github.io/web/JsonCloudGuide" target="_blank" style="color: var(--primary); font-size: 0.85em; text-decoration: underline;">申請說明</a>)</h3>
                    <p style="font-size: 0.8em; color: #666; margin-bottom: 10px;">支援 Upstash / Firebase。上傳時會自動排除您的金鑰資訊以保護隱私。</p>
                    <div class="form-row">
                        <label>資料庫 URL</label>
                        <div class="input-with-btn"><input type="text" id="setBinId" autocomplete="off" placeholder="Upstash: https://xxx.upstash.io / Firebase: https://xxx.firebaseio.com"><button onclick="clearField('setBinId')">×</button></div>
                    </div>
                    <div class="form-row">
                        <label>Key ID</label>
                        <div class="input-with-btn"><input type="text" id="setApiKey" autocomplete="off" placeholder="Token / 自設 rules pwd"><button onclick="clearField('setApiKey')">×</button></div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button onclick="toggleModal('settingsModal', false)">取消</button>
                <button class="btn-confirm" onclick="saveSettings()">認定</button>
            </div>
        </div>
    </div>

    <div id="detailModal" class="modal-overlay">
        <div class="modal-wrapper">
            <div class="modal-header"><span id="detailTitle">得點詳情</span><button onclick="toggleModal('detailModal', false)">關閉</button></div>
            <div id="detailContent" class="modal-body detail-grid"></div>
        </div>
    </div>

    <div id="summaryModal" class="modal-overlay">
        <div class="modal-wrapper">
            <div class="modal-header"><span>全班點數總覽</span><button onclick="toggleModal('summaryModal', false)">關閉</button></div>
            <div id="summaryContent" class="modal-body summary-grid"></div>
        </div>
    </div>


    <input type="file" id="importFile" style="display:none;" accept=".json.gz,.gz" onchange="handleImport(event)">

</style>
</body>
</html>
