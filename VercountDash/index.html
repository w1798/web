<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Vercount 數據儀表板 by Charles Nextime</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #4834d4; --success: #00b894; --info: #0984e3; --danger: #ff7675; --gray: #95a5a6; --dark: #2d3436; }
        body { font-family: -apple-system, system-ui, sans-serif; background: #f0f2f5; color: var(--dark); margin: 0; padding: 0; }
        .top-bar { position: sticky; top: 0; z-index: 1000; background: #f0f2f5; padding: 15px 2.5% 5px 2.5%; }
        .container-header { background: white; padding: 20px 25px; border-radius: 16px 16px 0 0; box-shadow: 0 4px 15px rgba(0,0,0,0.05); max-width: 95%; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; }
        .main-content { padding: 0 2.5%; max-width: 95%; margin: 0 auto; }
        .table-wrapper { background: white; border-radius: 0 0 16px 16px; box-shadow: 0 10px 20px rgba(0,0,0,0.08); margin-bottom: 30px; }
        table { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; }
        thead th { position: sticky; top: 102px; z-index: 900; background: #f8f9fa; font-size: 1rem; font-weight: 800; color: #2d3436; padding: 18px 15px; border-bottom: 3px solid #eee; text-align: left; }
        td { padding: 16px 15px; border-bottom: 1px solid #f1f2f6; word-break: break-all; vertical-align: middle; }
        .project-name { font-weight: 800; color: var(--primary); font-size: 1.1rem; }
        .project-url { font-size: 0.8rem; color: #999; margin-top: 3px; }
        .num-main { font-family: monospace; font-weight: 800; color: var(--success); font-size: 1.25rem; }
        .num-sub { font-size: 0.85rem; color: #95a5a6; margin-left: 5px; font-weight: normal; }
        .btn { border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.85rem; transition: 0.2s; color: white; display: inline-flex; align-items: center; gap: 5px; }
        .btn-config { background: var(--dark); }
        .btn-sync { background: var(--success); }
        .btn-export { background: #636e72; }
        .btn-import { background: var(--info); }
        .btn-danger { background: var(--danger); }
        .btn-reset { background: #ff7675; padding: 4px 8px; font-size: 0.7rem; margin-left: 8px; }
        #settings-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 2000; backdrop-filter: blur(5px); }
        .settings-card { background: white; width: 90%; max-width: 900px; margin: 3vh auto; border-radius: 16px; max-height: 85vh; display: flex; flex-direction: column; overflow: hidden; }
        .settings-body { padding: 20px 25px; overflow-y: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-control { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        textarea.form-control { height: 350px; font-size: 1.15rem; line-height: 1.6; font-family: monospace; }
        .footer { text-align: center; padding: 40px 20px; font-size: 0.9rem; color: #7f8c8d; }
        .badge { padding: 4px 10px; border-radius: 6px; font-size: 0.85rem; font-weight: bold; }
        .trend-box { width: 100%; height: 55px; }
        #busuanzi_container_page_pv { color: #888; font-size: 0.9rem; margin-left: 15px; border-left: 1px solid #ccc; padding-left: 15px; }
    </style>
</head>
<body>

<div class="top-bar">
    <div class="container-header">
        <div class="header">
            <div>
                <h1 style="margin:0; font-size: 1.6rem;">📊 Vercount 數據儀表板</h1>
                <div id="status-bar" style="margin-top:5px; font-size:0.9rem; color:var(--gray);">初始化中...</div>
            </div>
            <div style="display: flex; gap: 8px;">
                <button class="btn btn-danger" onclick="fullSystemReset()">🗑️ 全域重置</button>
                <button class="btn btn-export" onclick="exportData()">📤 匯出備份</button>
                <button class="btn btn-import" onclick="triggerImport()">📥 匯入雲端</button>
                <button class="btn btn-sync" onclick="refreshPV(true)">⚡ 立即更新</button>
                <button class="btn btn-config" onclick="toggleSettings(true)">⚙️ 系統設定</button>
            </div>
        </div>
    </div>
</div>

<div class="main-content">
    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th style="width: 35%;">專案路徑 (點擊開啟)</th>
                    <th style="width: 15%;">即時 PV (對比)</th>
                    <th style="width: 15%; text-align:right;">全站 PV (對比)</th>
                    <th style="width: 15%; text-align:right;">全站 UV (對比)</th>
                    <th style="width: 20%; text-align:center;">30日趨勢</th>
                </tr>
            </thead>
            <tbody id="stats-body"></tbody>
        </table>
    </div>
</div>

<div class="footer">
    <a href="https://w1798.github.io/web/" target="_blank" style="color:var(--primary); text-decoration:none; font-weight:600;">
&copy; 
<script>
  const startYear = 2026;
  const currentYear = new Date().getFullYear();
  document.write(startYear === currentYear ? startYear : startYear + "-" + currentYear);
</script> 
Charles Nextime
    </a>
    <span id="busuanzi_container_page_pv">
        本頁使用量 <span id="busuanzi_value_page_pv"></span> 次
    </span>
</div>

<div id="settings-overlay">
    <div class="settings-card">
        <div style="padding:15px 25px; border-bottom:1px solid #eee;"><h2>⚙️ 系統進階配置</h2></div>
        <div class="settings-body">
            <div>
                <label style="font-weight:700; display:block; margin-bottom:8px;">監控網址清單 <button class="btn btn-reset" onclick="resetField('set-urls')">重置</button></label>
                <textarea id="set-urls" class="form-control" placeholder="每行輸入一個網址..."></textarea>
            </div>
            <div>
<p> 雲端備份設定 (<a href="https://w1798.github.io/web/JsonCloudGuide" target="_blank">申請說明</a>)</p>
                <div style="margin-bottom:15px;">
                     <input type="text" id="set-bin-id" class="form-control" style="width:200px" placeholder="URL or JSONBinID"><button class="btn btn-reset" onclick="resetField('set-bin-id')">重置</button>
                </div>
                <div style="margin-bottom:15px;">                    
                    <input type="text" id="set-api-key" class="form-control" style="width:200px" placeholder="Token or X-Access-Key">
<button class="btn btn-reset" onclick="resetField('set-api-key')">重置</button>
        
                </div>
                 <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div><label>雲端緩衝 (分)</label><input type="number" id="set-cloud-cd" style="width:60px" class="form-control"></div>
                    <div><label>PV 抓取緩衝 (分)</label><input type="number" id="set-pv-cd" style="width:60px" class="form-control"></div>
                </div>
            </div>
        </div>
        <div style="padding:15px 25px; border-top:1px solid #eee; text-align:right;">
            <button class="btn" style="background:#eee; color:#333;" onclick="toggleSettings(false)">取消</button>
            <button class="btn btn-sync" onclick="saveSettings()">💾 儲存並同步</button>
        </div>
    </div>
</div>

<input type="file" id="import-file" style="display:none;" accept=".json" onchange="handleFileImport(event)">

<script>
const STORAGE_KEY = 'CHARLES_SETTINGS_V1';
    const DATA_KEY = 'CHARLES_STATS_V1';
    const PENDING_KEY = 'PUSH_PENDING';
    let appData = { settings: { binId: '', apiKey: '', urls: [], cloudCD: 60, pvCD: 60 }, stats: {} };

    async function init() {
        const savedSett = localStorage.getItem(STORAGE_KEY);
        const savedStats = localStorage.getItem(DATA_KEY);
        if (savedSett) appData.settings = { ...appData.settings, ...JSON.parse(savedSett) };
        if (savedStats) appData.stats = JSON.parse(savedStats);

        const lastCloud = localStorage.getItem('LAST_CLOUD_LOAD');
        const isPushPending = localStorage.getItem(PENDING_KEY) === 'true';
        const isUrlEmpty = !appData.settings.urls || appData.settings.urls.length === 0;

        if (appData.settings.binId && appData.settings.apiKey) {
            // 如果本地沒網址，強制從雲端拉一次
            if (isUrlEmpty) {
                await loadFromCloud();
                localStorage.removeItem(PENDING_KEY);
            } 
            // 如果有待處理的推送
            else if (isPushPending) {
                updateStatusUI('syncing');
                await refreshPV(true); 
                localStorage.removeItem(PENDING_KEY);
            } 
            // 檢查 CD 時間是否過期需要自動下載
            else if (!lastCloud || (Date.now() - lastCloud > appData.settings.cloudCD * 60000)) {
                await loadFromCloud();
            } else {
                updateStatusUI('cache');
            }
        } else {
            updateStatusUI('offline');
        }
        
        renderUI();
        
        // 自動定時更新 PV
        if (!isUrlEmpty) {
            const lastSync = localStorage.getItem('LAST_SYNC_TIME');
            if (!lastSync || (appData.settings.pvCD === 0) || (Date.now() - lastSync > appData.settings.pvCD * 60000)) {
                refreshPV(false);
            }
        }
    }

    // 支援 Upstash 與 JSONBin 的通用雲端下載
    async function loadFromCloud() {
        const { binId, apiKey } = appData.settings;
        if (!binId || !apiKey) return false;

        const isUpstash = binId.includes('upstash.io');
        const storageKey = 'vercount_v1';

        try {
            updateStatusUI('syncing');
            let cloudRecord = null;

            if (isUpstash) {
                const res = await fetch(`${binId}/get/${storageKey}`, {
                    headers: { 'Authorization': `Bearer ${apiKey}` }
                });
                const data = await res.json();
                cloudRecord = data.result ? JSON.parse(data.result) : null;
            } else {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${binId}/latest`, {
                    headers: { 'X-Access-Key': apiKey }
                });
                if (res.ok) {
                    const data = await res.json();
                    cloudRecord = data.record;
                }
            }

            if (cloudRecord) {
                appData.stats = cloudRecord.stats || {};
                if (cloudRecord.settings) {
                    // 保留目前的登入資訊，避免下載後被覆蓋成空的
                    const { binId: _, apiKey: __, ...other } = cloudRecord.settings;
                    appData.settings = { ...appData.settings, ...other };
                }
                localStorage.setItem(DATA_KEY, JSON.stringify(appData.stats));
                localStorage.setItem(STORAGE_KEY, JSON.stringify(appData.settings));
                localStorage.setItem('LAST_CLOUD_LOAD', Date.now());
                updateStatusUI('online');
                return true;
            }
        } catch (e) {
            console.error("雲端讀取失敗:", e);
        }
        updateStatusUI('offline');
        return false;
    }

    // 支援 Upstash 與 JSONBin 的通用雲端上傳
    async function refreshPV(isManualUpload = false) {
        if (!appData.settings.urls || appData.settings.urls.length === 0) return;
        const todayStr = new Date().toLocaleDateString('zh-TW');
        const { binId, apiKey } = appData.settings;

        try {
            if(isManualUpload) updateStatusUI('syncing');
            
            // 1. 抓取每個網址的最新數據
            for (const url of appData.settings.urls) {
                try {
                    const res = await fetch(`https://events.vercount.one/log?url=${encodeURIComponent(url)}`);
                    const d = await res.json();
                    const entry = { time: new Date().toLocaleString('zh-TW'), pv: d.page_pv, site_pv: d.site_pv, uv: d.site_uv };
                    
                    if (!appData.stats[url]) appData.stats[url] = [];
                    const logs = appData.stats[url];
                    
                    // 同一天更新最後一筆，不同天則新增
                    if (logs.length > 0 && logs[logs.length-1].time.split(' ')[0] === todayStr) {
                        logs[logs.length-1] = entry;
                    } else {
                        logs.push(entry);
                        if (logs.length > 30) logs.shift();
                    }
                } catch (e) {}
            }
            
            localStorage.setItem(DATA_KEY, JSON.stringify(appData.stats));
            localStorage.setItem('LAST_SYNC_TIME', Date.now());

            // 2. 推送到雲端
            if (binId && apiKey) {
                const isUpstash = binId.includes('upstash.io');
                const storageKey = 'vercount_v1';
                const { binId: _, apiKey: __, ...safeSettings } = appData.settings;
                const uploadBody = JSON.stringify({ settings: safeSettings, stats: appData.stats });

                let res;
                if (isUpstash) {
                    res = await fetch(`${binId}/set/${storageKey}`, {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${apiKey}` },
                        body: uploadBody
                    });
                } else {
                    res = await fetch(`https://api.jsonbin.io/v3/b/${binId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json', 'X-Access-Key': apiKey },
                        body: uploadBody
                    });
                }
                if (res.ok) updateStatusUI('online');
            }
        } catch (e) {
            console.error("同步出錯:", e);
        } finally {
            renderUI();
        }
    }

    // --- 其餘輔助函數保持不變 ---
    function renderUI() {
        const tbody = document.getElementById('stats-body');
        tbody.innerHTML = "";
        if (!appData.settings.urls) return;
        appData.settings.urls.forEach((url, i) => {
            const logs = appData.stats[url] || [];
            const curr = logs[logs.length - 1] || {pv:0, site_pv:0, uv:0};
            const prev = logs.length > 1 ? logs[logs.length - 2] : {pv:0, site_pv:0, uv:0};
            
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><a href="${url}" target="_blank" class="url-link" style="text-decoration:none;"><div class="project-name">${url.split('/').filter(p=>p).pop() || url}</div><div class="project-url">${url}</div></a></td>
                <td><span class="num-main">${curr.pv}</span><span class="num-sub">(原${prev.pv})</span></td>
                <td style="text-align:right;"><span class="num-main" style="color:var(--info)">${curr.site_pv}</span><span class="num-sub">(原${prev.site_pv})</span></td>
                <td style="text-align:right;"><span class="num-main" style="color:#6c5ce7">${curr.uv}</span><span class="num-sub">(原${prev.uv})</span></td>
                <td><div class="trend-box"><canvas id="chart-${i}"></canvas></div></td>
            `;
            tbody.appendChild(tr);
            drawChart(`chart-${i}`, logs);
        });
    }

    function drawChart(id, logs) {
        const el = document.getElementById(id);
        if(!el) return;
        new Chart(el.getContext('2d'), {
            type: 'line',
            data: { labels: logs.map(l => l.time), datasets: [{ data: logs.map(l => l.pv), borderColor: '#4834d4', borderWidth: 2, pointRadius: 0, tension: 0.3 }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: false }, scales: { x: { display: false }, y: { display: false } } }
        });
    }

    function updateStatusUI(mode) {
        const statusEl = document.getElementById('status-bar');
        const map = {
            'offline': { bg: '#ff7675', text: '尚未設定/離線' },
            'cache': { bg: '#0984e3', text: '緩衝讀取中' },
            'online': { bg: '#065f46', text: '同步完成' },
            'syncing': { bg: '#f1c40f', text: '雲端同步中...' }
        };
        const s = map[mode] || map.offline;
        statusEl.innerHTML = `模式：<span class="badge" style="background:${s.bg}; color:white">${s.text}</span>`;
    }

    function toggleSettings(show) {
        if (show) {
            document.getElementById('set-urls').value = (appData.settings.urls || []).join('\n');
            document.getElementById('set-bin-id').value = appData.settings.binId || '';
            document.getElementById('set-api-key').value = appData.settings.apiKey || '';
            document.getElementById('set-cloud-cd').value = appData.settings.cloudCD;
            document.getElementById('set-pv-cd').value = appData.settings.pvCD;
            document.getElementById('settings-overlay').style.display = 'block';
        } else document.getElementById('settings-overlay').style.display = 'none';
    }

    function saveSettings() {
        const s = {
            urls: document.getElementById('set-urls').value.split('\n').map(u => u.trim()).filter(u => u),
            binId: document.getElementById('set-bin-id').value.trim(),
            apiKey: document.getElementById('set-api-key').value.trim(),
            cloudCD: parseInt(document.getElementById('set-cloud-cd').value) || 0,
            pvCD: parseInt(document.getElementById('set-pv-cd').value) || 0
        };
        if (s.urls.length > 0) localStorage.setItem(PENDING_KEY, 'true');
        else localStorage.removeItem(PENDING_KEY);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
        localStorage.removeItem('LAST_CLOUD_LOAD');
        location.reload();
    }

    function fullSystemReset() { if(confirm("確定重置嗎？")) { localStorage.clear(); location.reload(); } }
    function resetField(id) { if(confirm("確定清空嗎？")) document.getElementById(id).value = ""; }
    function exportData() {
        const blob = new Blob([JSON.stringify({ settings: appData.settings, stats: appData.stats }, null, 2)], { type: 'application/json' });
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `Vercount_${new Date().toISOString().slice(0,10)}.json`; a.click();
    }
    function triggerImport() { document.getElementById('import-file').click(); }
    function handleFileImport(event) {
        const reader = new FileReader();
        reader.onload = (e) => {
            const d = JSON.parse(e.target.result);
            appData.stats = d.stats || {}; appData.settings = d.settings || appData.settings;
            localStorage.setItem(DATA_KEY, JSON.stringify(appData.stats));
            localStorage.setItem(STORAGE_KEY, JSON.stringify(appData.settings));
            localStorage.setItem(PENDING_KEY, 'true'); 
            location.reload();
        };
        reader.readAsText(event.target.files[0]);
    }
    window.onload = init;
</script>

<script>
(function() {
    // 這樣無論是 /web/ 還是 /web 都會統一變成 /web 
    const path = window.location.pathname.replace(/\/$/, ""); 
    const TIME_KEY = `VERCOUNT_TIME_${path}`; // 每個分頁獨立計算冷卻時間
    const VAL_KEY = `VERCOUNT_VAL_${path}`;   // 每個分頁獨立存儲 PV 數
    
    const COOL_DOWN = 30 * 60 * 1000; 
    const now = Date.now();
    const lastVisit = localStorage.getItem(TIME_KEY);
    
    // 計算剩餘秒數
    const timeLeft = lastVisit ? Math.ceil((parseInt(lastVisit) + COOL_DOWN - now) / 1000) : 0;

    if (timeLeft <= 0) {
        console.log(`%c[Vercount]%c 路徑 ${path} 冷卻結束，更新數據...`, "color:#00b894;font-weight:bold", "color:inherit");
        
        const script = document.createElement('script');
        script.src = "https://events.vercount.one/js";
        script.defer = true;
        
        script.onload = () => {
            setTimeout(() => {
                const pvVal = document.getElementById('busuanzi_value_page_pv')?.innerText;
                if (pvVal) {
                    localStorage.setItem(VAL_KEY, pvVal);
                    localStorage.setItem(TIME_KEY, now); // 成功抓到才更新時間
                }
            }, 1500);
        };
        document.head.appendChild(script);
    } else {
        const lastVal = localStorage.getItem(VAL_KEY) || "--";
        console.log(`%c[Vercount]%c ${path} 冷卻中（剩 ${timeLeft} 秒）。顯示舊值：${lastVal}`, "color:#f1c40f;font-weight:bold", "color:inherit");

        window.addEventListener('load', () => {
            const pvSpan = document.getElementById('busuanzi_value_page_pv');
            if (pvSpan) pvSpan.innerText = lastVal;
        });
    }
})();
</script>
    
</body>
</html>
