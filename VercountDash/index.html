        #busuanzi_container_page_pv { color: #888; font-size: 0.9rem; margin-left: 15px; border-left: 1px solid #ccc; padding-left: 15px; }

                <div style="margin-bottom:15px;">
                     <input type="text" id="set-bin-id" class="form-control" style="width:200px" placeholder="URL or JSONBinID"><button class="btn btn-reset" onclick="resetField('set-bin-id')">重置</button>

                    <input type="text" id="set-api-key" class="form-control" style="width:200px" placeholder="Token or X-Access-Key">
<button class="btn btn-reset" onclick="resetField('set-api-key')">重置</button>
        
                </div>

                    <div><label>雲端緩衝 (分)</label><input type="number" id="set-cloud-cd" style="width:60px" class="form-control"></div>

<script>

 
     // 預設範本：未來新增參數只需改這裡
    const DEFAULT_SETTINGS = {
        binId: '',
        apiKey: '',
        urls: [],
        cloudCD: 60,
        pvCD: 60,
        logDays: 14,         // 保存日期（趨勢天數），預設 14 天
        theme: 'light',      // 假設未來新增的參數
        autoRefresh: true    // 假設未來新增的參數
    };

    // --- Gzip 壓縮/解壓工具 ---
    const compressJSON = async (obj, indent = 0) => {
        const str = indent ? JSON.stringify(obj, null, indent) : JSON.stringify(obj);
        const stream = new Blob([str]).stream().pipeThrough(new CompressionStream('gzip'));
        const buf = await new Response(stream).arrayBuffer();
        return btoa(String.fromCharCode(...new Uint8Array(buf)));
    };

    const decompressJSON = async (base64) => {
        let cleanBase64 = String(base64).trim();
        if (cleanBase64.startsWith('"') && cleanBase64.endsWith('"')) {
            cleanBase64 = cleanBase64.slice(1, -1);
        }
        const bin = atob(cleanBase64);
        const buf = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
        const stream = new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'));
        return await new Response(stream).json();
    };

    const decompressBinary = async (arrayBuffer) => {
        const stream = new Blob([arrayBuffer]).stream().pipeThrough(new DecompressionStream('gzip'));
        const text = await new Response(stream).text();
        return JSON.parse(text);
    };

    const DEFAULT_DATA = {
        settings: DEFAULT_SETTINGS,
        stats: {}
    };
   
    const STORAGE_KEY = 'CHARLES_SETTINGS_V1';
    const DATA_KEY = 'CHARLES_STATS_V1';
    const PENDING_KEY = 'PUSH_PENDING';
    
    let appData = { 
        settings: { ...DEFAULT_SETTINGS }, 
        stats: {} 
    };


    async function init() {
        const savedSett = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
        const savedStats = JSON.parse(localStorage.getItem(DATA_KEY) || '{}');
        
        appData.settings = mergeDeep(DEFAULT_SETTINGS, savedSett);
        appData.stats = savedStats;

        const lastCloud = localStorage.getItem('LAST_CLOUD_LOAD');
        const isPushPending = localStorage.getItem(PENDING_KEY) === 'true'; // 這行是關鍵
        let isUrlEmpty = !appData.settings.urls || appData.settings.urls.length === 0;

        if (appData.settings.binId && appData.settings.apiKey) {
            if (isPushPending) {
                console.log("[VercountDash] 偵測到「儲存並同步」，以本地端資料為主更新雲端...");
                updateStatusUI('cache'); 
            } else {
                console.log("[VercountDash] 網頁載入，從雲端下載最新資料...");
                await loadFromCloud();
                
                // 重新判斷網址是否為空（可能從雲端抓下來了）
                isUrlEmpty = !appData.settings.urls || appData.settings.urls.length === 0;
            }
        } else {
            updateStatusUI('offline');
        }
        
        renderUI();
        
        // 如果是 Pending 狀態或是時間到了，執行更新並推送到雲端
        if (!isUrlEmpty) {
            const lastSync = localStorage.getItem('LAST_SYNC_TIME');
            if (isPushPending || !lastSync || (appData.settings.pvCD === 0) || (Date.now() - lastSync > appData.settings.pvCD * 60000)) {
                console.log("[VercountDash] 開始抓取最新 PV 與準備更新雲端...");
                await refreshPV(isPushPending); // 執行完後 refreshPV 內部應清除 PENDING_KEY
                localStorage.removeItem(PENDING_KEY); // 強制清除確保下次恢復正常雲端讀取
            }
        }
    }

    function mergeDeep(target, source) {
        if (!source) return target;
        
        const output = { ...target };
        Object.keys(target).forEach(key => {
            if (source.hasOwnProperty(key)) {
                // 如果是物件且不是陣列，遞迴合併
                if (typeof target[key] === 'object' && target[key] !== null && !Array.isArray(target[key])) {
                    output[key] = mergeDeep(target[key], source[key]);
                } else {
                    output[key] = source[key];
                }
            }
        });
        return output;
    }

    // 支援 Upstash 與 JSONBin 的通用雲端下載
    async function loadFromCloud() {
        console.log("[VercountDash] 開始執行雲端下載流程...");
        const { binId, apiKey } = appData.settings;
        if (!binId || !apiKey) return false;

        const isUpstash = binId.includes('upstash.io');
        const storageKey = 'vercount_v1';

        try {
            updateStatusUI('syncing');
            let cloudRecord = null;

            if (isUpstash) {
                console.log("[VercountDash] 連接至 Upstash 獲取資料...");
                const res = await fetch(`${binId}/get/${storageKey}`, {
                    headers: { 'Authorization': `Bearer ${apiKey}` }
                });
                console.log(`[VercountDash] Upstash 回應狀態碼: ${res.status}`);
                const data = await res.json();
                if (data.result) {
                    console.log("[VercountDash] 嘗試將 Upstash 取得資料進行 gzip 解壓縮...");
                    try { 
                        let dOutput = data.result;
                        if(typeof dOutput === 'string') {
                            dOutput = dOutput.trim();
                            if(dOutput.startsWith('"') && dOutput.endsWith('"')) {
                                dOutput = dOutput.slice(1, -1);
                            }
                        }
                        cloudRecord = await decompressJSON(dOutput); 
                        console.log("[VercountDash] 解壓縮成功。");
                    }
                    catch(e) { 
                        console.log("[VercountDash] 解壓縮失敗，退回使用 JSON.parse 解析。錯誤: ", e);
                        cloudRecord = JSON.parse(data.result); 
                        if (typeof cloudRecord === 'string') cloudRecord = JSON.parse(cloudRecord); // 針對防爆再解一次
                    }
                }
            } else {
                console.log("[VercountDash] 連接至 JSONBin 獲取資料...");
                const res = await fetch(`https://api.jsonbin.io/v3/b/${binId}/latest`, {
                    headers: { 'X-Access-Key': apiKey }
                });
                console.log(`[VercountDash] JSONBin 回應狀態碼: ${res.status}`);
                if (res.ok) {
                    const data = await res.json();
                    const raw = data.record;
                    if (raw && typeof raw.d === 'string') {
                        console.log("[VercountDash] 嘗試將 JSONBin 取得之 d 欄位進行 gzip 解壓縮...");
                        try { 
                            cloudRecord = await decompressJSON(raw.d); 
                            console.log("[VercountDash] 解壓縮成功。");
                        } catch(e) { 
                            console.log("[VercountDash] 解壓縮失敗，直接取原始內容。");
                            cloudRecord = raw; 
                        }
                    } else {
                        cloudRecord = raw;
                    }
                }
            }

            if (cloudRecord) {
                console.log("[VercountDash] 成功取得並解析雲端數據，正在同步至本地...");
                // 如果雲端為空但 parse 後是空物件，這裡做保護
                if (typeof cloudRecord === 'object' && cloudRecord !== null && !cloudRecord.settings) {
                    console.log("[VercountDash] 雲端格式好像不是 Vercount，可能剛建立");
                } else {
                    const remoteSettings = cloudRecord.settings || {};
                    const { binId: currentBin, apiKey: currentKey } = appData.settings; 
                    
                    appData.stats = cloudRecord.stats || {};
                    // 這裡使用 mergeDeep 確保雲端新增欄位也能進來
                    appData.settings = mergeDeep(DEFAULT_SETTINGS, remoteSettings);
                    
                    // 重要：還原目前的 Key，避免雲端舊備份把正在用的 Key 蓋掉
                    appData.settings.binId = currentBin;
                    appData.settings.apiKey = currentKey;

                    localStorage.setItem(DATA_KEY, JSON.stringify(appData.stats));
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(appData.settings));
                    localStorage.setItem('LAST_CLOUD_LOAD', Date.now());
                }
                
                updateStatusUI('online'); // 成功才顯示 online
                console.log("[VercountDash] 雲端下載並合併結束");
                return true;
            }
        } catch (e) {
            console.error("[VercountDash] 雲端讀取失敗:", e);
        }
        updateStatusUI('offline'); // 失敗顯示 offline
        return false;
    }

    // 立即更新與下載整合
    async function handleManualRefresh() {
        console.log("[VercountDash] 啟動強制要求：先下載後上傳");
        if (appData.settings.binId && appData.settings.apiKey) {
            await loadFromCloud();
        }
        await refreshPV(true);
    }

    // 支援 Upstash 與 JSONBin 的通用雲端上傳
    async function refreshPV(isManualUpload = false) {
        if (!appData.settings.urls || appData.settings.urls.length === 0) return;
        const todayStr = new Date().toLocaleDateString('zh-TW');
        const { binId, apiKey } = appData.settings;

        try {
            if(isManualUpload) updateStatusUI('syncing');
            
            // 1. 抓取每個網址的最新數據
            for (const url of appData.settings.urls) {
                try {
                    const res = await fetch(`https://events.vercount.one/log?url=${encodeURIComponent(url)}`);
                    const d = await res.json();
                    const entry = { time: new Date().toLocaleString('zh-TW'), pv: d.page_pv, site_pv: d.site_pv, uv: d.site_uv };
                    
                    if (!appData.stats[url]) appData.stats[url] = [];
                    const logs = appData.stats[url];
                    
                    // 同一天更新最後一筆，不同天則新增
                    if (logs.length > 0 && logs[logs.length-1].time.split(' ')[0] === todayStr) {
                        logs[logs.length-1] = entry;
                    } else {
                        logs.push(entry);
                        const maxDays = appData.settings.logDays || 14;
                        if (logs.length > maxDays) logs.shift();
                    }
                } catch (e) {}
            }
            
            localStorage.setItem(DATA_KEY, JSON.stringify(appData.stats));
            localStorage.setItem('LAST_SYNC_TIME', Date.now());

            // 2. 推送到雲端（gzip 壓縮後上傳）
            if (binId && apiKey) {
                console.log("[VercountDash] 準備推送數據至雲端...");
                const isUpstash = binId.includes('upstash.io');
                const storageKey = 'vercount_v1';
                const { binId: _, apiKey: __, ...safeSettings } = appData.settings;
                
                console.log("[VercountDash] 進行 Gzip 資料壓縮...");
                const compressed = await compressJSON({ settings: safeSettings, stats: appData.stats });

                let res;
                if (isUpstash) {
                    console.log("[VercountDash] 使用 Upstash 上傳介面...");
                    res = await fetch(`${binId}/set/${storageKey}`, {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${apiKey}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify(compressed)
                    });
                } else {
                    console.log("[VercountDash] 使用 JSONBin 上傳介面...");
                    res = await fetch(`https://api.jsonbin.io/v3/b/${binId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json', 'X-Access-Key': apiKey },
                        body: JSON.stringify({ d: compressed })
                    });
                }
                
                console.log(`[VercountDash] 推送結果: ${res.status}`);
                if (res.ok) {
                    console.log("[VercountDash] 雲端資料更新成功！");
                    updateStatusUI('online');
                } else {
                    console.error("[VercountDash] 雲端更新失敗!");
                }
            }
        } catch (e) {
            console.error("[VercountDash] 同步出錯:", e);
        } finally {
            renderUI();
        }
    }

    // --- 其餘輔助函數保持不變 ---
    function renderUI() {
        const tbody = document.getElementById('stats-body');
        tbody.innerHTML = "";
        // 更新趨勢欄標題為目前設定的天數
        const trendTh = document.getElementById('trend-th');
        if (trendTh) trendTh.textContent = `${appData.settings.logDays || 14}日趨勢`;
        if (!appData.settings.urls) return;
        appData.settings.urls.forEach((url, i) => {
            const logs = appData.stats[url] || [];
            const curr = logs[logs.length - 1] || {pv:0, site_pv:0, uv:0};
            const prev = logs.length > 1 ? logs[logs.length - 2] : {pv:0, site_pv:0, uv:0};
            
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><a href="${url}" target="_blank" class="url-link" style="text-decoration:none;"><div class="project-name">${url.split('/').filter(p=>p).pop() || url}</div><div class="project-url">${url}</div></a></td>
                <td><span class="num-main">${curr.pv}</span><span class="num-sub">(原${prev.pv})</span></td>
                <td style="text-align:right;"><span class="num-main" style="color:var(--info)">${curr.site_pv}</span><span class="num-sub">(原${prev.site_pv})</span></td>
                <td style="text-align:right;"><span class="num-main" style="color:#6c5ce7">${curr.uv}</span><span class="num-sub">(原${prev.uv})</span></td>
                <td><div class="trend-box"><canvas id="chart-${i}"></canvas></div></td>
            `;
            tbody.appendChild(tr);
            drawChart(`chart-${i}`, logs);
        });
    }

    function drawChart(id, logs) {
        const el = document.getElementById(id);
        if(!el) return;
        new Chart(el.getContext('2d'), {
            type: 'line',
            data: { labels: logs.map(l => l.time), datasets: [{ data: logs.map(l => l.pv), borderColor: '#4834d4', borderWidth: 2, pointRadius: 0, tension: 0.3 }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: false }, scales: { x: { display: false }, y: { display: false } } }
        });
    }

    function updateStatusUI(mode) {
        const statusEl = document.getElementById('status-bar');
        const map = {
            'offline': { bg: '#ff7675', text: '尚未設定/離線' },
            'cache': { bg: '#0984e3', text: '緩衝讀取中' },
            'online': { bg: '#065f46', text: '同步完成' },
            'syncing': { bg: '#f1c40f', text: '雲端同步中...' }
        };
        const s = map[mode] || map.offline;
        statusEl.innerHTML = `模式：<span class="badge" style="background:${s.bg}; color:white">${s.text}</span>`;
    }

    function toggleSettings(show) {
        if (show) {
            document.getElementById('set-urls').value = (appData.settings.urls || []).join('\n');
            document.getElementById('set-bin-id').value = appData.settings.binId || '';
            document.getElementById('set-api-key').value = appData.settings.apiKey || '';
            document.getElementById('set-cloud-cd').value = appData.settings.cloudCD;
            document.getElementById('set-pv-cd').value = appData.settings.pvCD;
            document.getElementById('set-log-days').value = String(appData.settings.logDays || 14);
            document.getElementById('settings-overlay').style.display = 'block';
        } else document.getElementById('settings-overlay').style.display = 'none';
    }

    function saveSettings() {
        // 拿目前的 settings 當基底，只更新 UI 有變動的欄位
        const s = {
            ...appData.settings, 
            urls: document.getElementById('set-urls').value.split('\n').map(u => u.trim()).filter(u => u),
            binId: document.getElementById('set-bin-id').value.trim(),
            apiKey: document.getElementById('set-api-key').value.trim(),
            cloudCD: parseInt(document.getElementById('set-cloud-cd').value) || 0,
            pvCD: parseInt(document.getElementById('set-pv-cd').value) || 0,
            logDays: parseInt(document.getElementById('set-log-days').value) || 14
        };
        
        if (s.urls.length > 0) localStorage.setItem(PENDING_KEY, 'true');
        else localStorage.removeItem(PENDING_KEY);
        
        localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
        localStorage.removeItem('LAST_CLOUD_LOAD');
        location.reload();
    }

    function fullSystemReset() {
        if (confirm("確定要重置所有資料嗎？")) {
            localStorage.removeItem(STORAGE_KEY);
            localStorage.removeItem(DATA_KEY);
            localStorage.removeItem('LAST_CLOUD_LOAD');
            localStorage.removeItem(PENDING_KEY);
            localStorage.removeItem('LAST_SYNC_TIME');

            location.reload();
        }
    }

    function resetField(id) { if(confirm("確定清空嗎？")) document.getElementById(id).value = ""; }
    
    async function exportData() {
        // 匯出時排除敏感的雲端金鑰，並且提供給 compressJSON 第 2 個參數進行縮排美化
        const { binId: _, apiKey: __, ...safeSettings } = appData.settings;
        const compressed = await compressJSON({ settings: safeSettings, stats: appData.stats }, 2);
        
        // 將 base64 字串存成二進位 .gz 檔案
        const raw = atob(compressed);
        const bytes = new Uint8Array(raw.length);
        for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
        const blob = new Blob([bytes], { type: 'application/gzip' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `Vercount_${new Date().toISOString().slice(0,10)}.json.gz`;
        a.click();
    }
    function triggerImport() { document.getElementById('import-file').click(); }


    function handleFileImport(event) {
        const file = event.target.files[0];
        if (!file) return;
        const isGz = file.name.endsWith('.gz');

        const applyImport = (d) => {
            appData.stats = d.stats || {};
            appData.settings = mergeDeep(DEFAULT_SETTINGS, d.settings || {});
            localStorage.setItem(DATA_KEY, JSON.stringify(appData.stats));
            localStorage.setItem(STORAGE_KEY, JSON.stringify(appData.settings));
            localStorage.setItem(PENDING_KEY, 'true');
            location.reload();
        };

        if (isGz) {
            // 讀取二進位 Gzip，解壓後還原
            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const d = await decompressBinary(e.target.result);
                    applyImport(d);
                } catch(err) {
                    alert('匯入失敗：無法解壓縮 .gz 檔案，請確認格式正確');
                }
            };
            reader.readAsArrayBuffer(file);
        } else {
            // 讀取純文字 JSON
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    applyImport(JSON.parse(e.target.result));
                } catch(err) {
                    alert('匯入失敗，請檢查 JSON 檔案格式');
                }
            };
            reader.readAsText(file);
        }
    }

    window.onload = init;
</script>
