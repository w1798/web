<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>數學算術 PK 大賽</title>



<script>
    document.documentElement.style.visibility = 'hidden';

    const APP_VER = "1.00f";

    var resources = {
        styles: [
            "style.css"
        ], 
        libs: [
            {
                url: 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js'
            }
        ],        
        scripts: [
            "../counter.js", 
            "../plugins.js", 
            "service.js", 
            "generator.js", 
            "ui.js", 
            "core.js"
        ]
    };

    const loader = document.createElement('script');
    loader.src = `../loadapp.js?ver=${APP_VER}`;
    document.head.appendChild(loader);
</script>

    
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧮</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <button id="btnHomeGlobal" class="btn-home" onclick="returnToHome()">🏠 回首頁</button>

    <!-- 主選單 -->
    <div id="mainMenu" class="screen active">
        <div class="menu-container glassmorphism">
            <h1>數學算術 PK 大賽</h1>
            <div class="stats-board">
                <div class="stat-item">P1 勝: <span id="p1Wins">0</span></div>
                <div class="stat-item">P2 勝: <span id="p2Wins">0</span></div>
            </div>
            <div class="menu-buttons">
                <button class="btn primary" onclick="goToCategory('parallel')">同向模式</button>
                <button class="btn secondary" onclick="goToCategory('face-to-face')">對向模式 (平板用)</button>
                <button class="btn settings" onclick="showScreen('settingsScreen')">⚙️ 遊戲設定</button>
            </div>
        </div>
    </div>

    <!-- 題型選擇頁面 -->
    <div id="categoryScreen" class="screen">
        <div class="menu-container glassmorphism" style="max-width: 600px; padding: 2rem;">
            <h2>選擇 PK 項目</h2>
            <div class="category-grid">
                <div class="category-section">
                    <h3 class="category-title">🟢 基礎加減</h3>
                    <div class="options-grid">
                        <button class="btn primary" onclick="setupReadyPhase(0)">10以內的加法</button>
                        <button class="btn primary" onclick="setupReadyPhase(3)">20以內的加法</button>
                        <button class="btn primary" onclick="setupReadyPhase(1)">10以內的減法</button>
                        <button class="btn primary" onclick="setupReadyPhase(4)">20以內的減法</button>
                        <button class="btn primary" onclick="setupReadyPhase(2)">10以內的加減法</button>
                        <button class="btn primary" onclick="setupReadyPhase(5)">20以內的加減法</button>
                    </div>
                </div>

                <div class="category-section">
                    <h3 class="category-title">🔵 乘除與挑戰</h3>
                    <div class="options-grid">
                        <button class="btn primary" onclick="setupReadyPhase(6)">十十乘法表 (1~10)</button>
                        <button class="btn primary" onclick="setupReadyPhase(8)">百位除法練習 (1~10)</button>
                        <button class="btn danger" style="grid-column: span 2;" onclick="setupReadyPhase(7)">三數加減挑戰 (0~20混合)</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 設定頁面 -->
    <div id="settingsScreen" class="screen">
        <div class="settings-container glassmorphism">
            <h2>⚙️ 遊戲設定</h2>
            
            <div class="setting-group-row">
                <label>使用 HP 血條模式</label>
                <input type="checkbox" id="setUseHp" checked>
            </div>

            <div class="setting-group-row">
                <label>搶答模式 (共用題)</label>
                <input type="checkbox" id="setRushMode">
            </div>

            <div class="setting-group-row">
                <label>震動特效</label>
                <input type="checkbox" id="setEnableShake" checked>
            </div>

            <div class="setting-group-row">
                <label>答題音效</label>
                <input type="checkbox" id="setEnableSound" checked>
            </div>

            <div class="setting-group">
                <label>錯誤容忍: <span id="valWrongTol">1</span>次</label>
                <select id="setWrongTol">
                    <option value="0">0</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                </select>
            </div>

            <div class="setting-group">
                <label>每題限時: <span id="valTimeLimit">無</span></label>
                <select id="setTimeLimit">
                    <option value="0">無</option>
                    <option value="1">1秒</option>
                    <option value="2">2秒</option>
                    <option value="3">3秒</option>
                    <option value="4">4秒</option>
                    <option value="5">5秒</option>
                    <option value="6">6秒</option>
                    <option value="7">7秒</option>
                    <option value="8">8秒</option>
                    <option value="9">9秒</option>
                    <option value="10">10秒</option>
                </select>
            </div>

            <div class="setting-group">
                <label>初始 HP: <span id="valMaxHp">100</span></label>
                <select id="setMaxHp">
                    <option value="100">100</option>
                    <option value="200">200</option>
                    <option value="300">300</option>
                    <option value="400">400</option>
                    <option value="500">500</option>
                    <option value="600">600</option>
                    <option value="700">700</option>
                    <option value="800">800</option>
                    <option value="900">900</option>
                </select>
            </div>

            <div class="setting-group">
                <label>總題數: <span id="valQCount">10</span>題</label>
                <select id="setQCount">
                    <option value="5">5</option>
                    <option value="10">10</option>
                    <option value="15">15</option>
                    <option value="20">20</option>
                    <option value="25">25</option>
                    <option value="30">30</option>
                    <option value="35">35</option>
                    <option value="40">40</option>
                    <option value="45">45</option>
                    <option value="50">50</option>
                </select>
            </div>

            <div class="setting-group">
                <label>答案選項: <span id="valAnsCount">6</span>個</label>
                <select id="setAnsCount">
                    <option value="2">2</option>
                    <option value="4">4</option>
                    <option value="6">6</option>
                    <option value="8">8</option>
                </select>
            </div>

            <div class="setting-group">
                <label>數字大小: <span id="valFontSizeLabel">中</span></label>
                <select id="setFontSize">
                    <option value="0.8">小</option>
                    <option value="1" selected>中</option>
                    <option value="1.5">大</option>
                </select>
            </div>

            <div class="setting-group">
                <label>打字鼠模式 (蓋牌): </label>
                <select id="setMole">
                    <option value="0">無</option>
                    <option value="1">揭示 0.5s (蓋 1s)</option>
                    <option value="2">揭示 0.75s (蓋 1s)</option>
                    <option value="3">揭示 1s (蓋 1s)</option>
                    <option value="4">揭示 1.5s (蓋 1s)</option>
                </select>
            </div>

            <div class="setting-buttons">
                <button class="btn danger" style="padding:8px;" onclick="resetStats()">重置</button>
                <button class="btn secondary" style="padding:8px;" onclick="generateQR()">產生分享碼</button>
                <button class="btn primary" style="padding:8px;" onclick="saveSettingsAndReturn()">保存並返回</button>
            </div>
        </div>
    </div>

    <!-- QR Code 彈窗 -->
    <div id="qrModal" class="modal-overlay" style="display:none;">
        <div class="modal-content glassmorphism">
            <h3>分享遊戲設定</h3>
            <p style="font-size:0.9rem; margin-bottom:1rem;">請學生掃描下方 QR Code：</p>
            <div id="qrcodeContainer">
                <div id="qrcode"></div>
            </div>
            <p id="shareUrlText" style="font-size:0.7rem; color:#aaa; margin:1rem 0; word-break:break-all; max-width:250px;"></p>
            <button class="btn danger" onclick="closeQRModal()">關閉視窗</button>
        </div>
    </div>

    <!-- 戰鬥場景 -->
    <div id="battleArena" class="screen">
        <div id="teacherTools" class="teacher-tools">
            <button class="btn-lock-gen" onclick="generateLockedQR()" title="產生限定此題型的練習碼">🚩QR Code</button>
        </div>
        <div class="arena-layout" id="arenaLayout">
            <!-- Player 1 區塊 -->
            <div id="p1Area" class="player-area">
                <div id="p1ReadyOverlay" class="ready-overlay">
                    <button id="p1GoBtn" class="btn-go" onpointerdown="setReady('p1')">GO!</button>
                </div>
                <div class="hp-bar-container" id="p1HpContainer">
                    <div id="p1HpBar" class="hp-bar"></div>
                    <div id="p1HpText" class="hp-text">100 / 100</div>
                </div>
                <div class="progress-text" id="p1Progress">題數 0 / 5</div>
                <div id="p1Combo" class="combo-text hidden">Combo x3!</div>
                <div class="question-box glassmorphism" id="p1Question">
                    <span id="p1QuestionText">Ready!</span>
                    <div class="q-timer-bar" id="p1TimerBar"></div>
                </div>
                <div class="options-grid" id="p1Options">
                    <!-- Javascript 生成選項 -->
                </div>
            </div>

            <!-- VS 分隔線 -->
            <div class="vs-divider">
                VS
            </div>

            <!-- Player 2 區塊 -->
            <div id="p2Area" class="player-area">
                <div id="p2ReadyOverlay" class="ready-overlay">
                    <button id="p2GoBtn" class="btn-go" onpointerdown="setReady('p2')">GO!</button>
                </div>
                <div class="hp-bar-container" id="p2HpContainer">
                    <div id="p2HpBar" class="hp-bar"></div>
                    <div id="p2HpText" class="hp-text">100 / 100</div>
                </div>
                <div class="progress-text" id="p2Progress">題數 0 / 5</div>
                <div id="p2Combo" class="combo-text hidden">Combo x3!</div>
                <div class="question-box glassmorphism" id="p2Question">
                    <span id="p2QuestionText">Ready!</span>
                    <div class="q-timer-bar" id="p2TimerBar"></div>
                </div>
                <div class="options-grid" id="p2Options">
                    <!-- Javascript 生成選項 -->
                </div>
            </div>
        </div>
    </div>

    <!-- 結算畫面 -->
    <div id="resultScreen" class="screen">
        <div class="result-nav">
            <button id="btnHomeGlobalFromRes" class="btn-home" onclick="returnToHome()">🏠 回首頁</button>
            <button class="btn success" onclick="rePlay()">🔄 重來一次</button>
        </div>
        <div class="arena-layout" id="resultLayout" style="width: 100%; height: 100%;">
            
            <!-- P1 結算 -->
            <div id="p1ResultArea" class="player-area" style="background: rgba(255,255,255,0.05); border-radius:12px; margin: 1rem;">
                <div class="res-card glassmorphism" style="width:90%;">
                    <div class="res-stats-header">
                        <h1 class="win-label" id="p1WinLabel">P1</h1>
                        <span class="hp-res-text" id="p1HpResult"></span>
                        <div class="stat-items">
                            <span>✅: <span id="p1Corrects">0</span></span>
                            <span>❌: <span id="p1Wrongs">0</span></span>
                        </div>
                    </div>
                    <div class="wrong-box" id="p1WrongList"></div>
                </div>
            </div>

            <!-- VS 分隔線 -->
            <div class="vs-divider"></div>

            <!-- P2 結算 -->
            <div id="p2ResultArea" class="player-area" style="background: rgba(255,255,255,0.05); border-radius:12px; margin: 1rem;">
                <div class="res-card glassmorphism" style="width:90%;">
                    <div class="res-stats-header">
                        <h1 class="win-label" id="p2WinLabel">P2</h1>
                        <span class="hp-res-text" id="p2HpResult"></span>
                        <div class="stat-items">
                            <span>✅: <span id="p2Corrects">0</span></span>
                            <span>❌: <span id="p2Wrongs">0</span></span>
                        </div>
                    </div>
                    <div class="wrong-box" id="p2WrongList"></div>
                </div>
            </div>

        </div>
    </div>

    <footer></footer>
  


</body>
</html>
