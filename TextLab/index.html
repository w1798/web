<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多功能文字處理器 by Charles Nextime</title>
    <style>
        :root {
            --primary: #818cf8;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f1f5f9;
            --border: #334155;
            --accent: #22c55e;
            --danger: #e11d48;
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: 'Inter', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg); color: var(--text);
            overflow: hidden;
        }

        .container { display: flex; flex-direction: column; height: 100vh; }

        header {
            padding: 15px 20px;
            background: var(--card-bg);
            border-bottom: 2px solid var(--border);
        }

        /* 第一層：標題與按鈕 */
        .top-bar {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 5px;
            flex-wrap: wrap;
        }
        .brand { font-weight: 900; font-size: 1.8rem; color: var(--primary); white-space: nowrap; }
        .btn-group { display: flex; flex-wrap: wrap; gap: 8px; flex: 1; }

        /* 第二層：執行區（輸入框） */
        .exec-zone {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            padding-top: 5px;
            border-top: 1px solid var(--border);
        }

        .tool-item { 
            display: flex; align-items: center; gap: 6px; 
            background: var(--bg); padding: 5px 10px; 
            border-radius: 6px; border: 1px solid var(--border); font-size: 16px; 
        }
        
        .tool-item input, .tool-item select { 
            background: #000; color: var(--primary); 
            border: 1px solid var(--border); padding: 4px; 
            border-radius: 4px; outline: none; font-size: 16px;
            text-align: center;
        }
        
        button {
            padding: 4px 14px; cursor: pointer; background: var(--primary); color: white;
            border: none; border-radius: 6px; font-size: 16px; 
            font-weight: 600; transition: 0.2s; white-space: nowrap;
        }
        button:hover { filter: brightness(1.2); transform: translateY(-1px); }
        button.secondary { background: #475569; }
        button.green { background: var(--accent); }
        button.red { background: var(--danger); }

        main { flex: 1; display: flex; padding: 15px; gap: 15px; box-sizing: border-box; min-height: 0; }
        .editor-box { flex: 1; display: flex; flex-direction: column; }
        textarea {
            flex: 1; padding: 18px; border: 1px solid var(--border); border-radius: 12px;
            resize: none; font-size: 18px; line-height: 1.6; outline: none;
            background: #000; color: #adbac7; font-family: 'Consolas', monospace;
        }
        .toolbar-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; font-size: 16px; }

        footer { height: 35px; display: flex; justify-content: center; align-items: center; background: var(--card-bg); border-top: 1px solid var(--border); font-size: 14px; }
        #busuanzi_container_page_pv { margin-left: 15px; color: rgba(255, 255, 255, 0.6); }

        @media (max-width: 1000px) {
            header { height: auto; overflow-y: auto; }
            main { flex-direction: column; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="top-bar">
            <div class="brand">多功能文字處理器</div>
            <div class="btn-group">
                <button class="secondary" onclick="process('indent')">增加縮排</button>
                <button class="secondary" onclick="process('outdent')">減少縮排</button>
                <button class="secondary" onclick="process('noEng')">去英文</button>
                <button class="secondary" onclick="process('noNum')">去數字</button>
                <button class="secondary" onclick="process('noSym')">去符號</button>
                <button class="secondary" onclick="process('noEmptyLine')">去空白行</button>
                <button class="secondary" onclick="process('addEmptyLine')">加空白行</button>
                <button class="secondary" onclick="process('trimSpace')">去頭尾空格</button>
                <button class="secondary" onclick="process('sort')">A-Z排序</button>
                <button class="secondary" onclick="process('noHTML')">去HTML</button>
                <button class="secondary" onclick="process('shuffle')">隨機打亂</button>
                <button class="secondary" onclick="process('capitalize')">首字大寫</button>
                <button class="secondary" onclick="process('upper')">全大寫</button>
                <button class="secondary" onclick="process('lower')">全小寫</button>
                <button class="secondary" onclick="process('findDup')">找重複</button>
                　　　<button class="red" onclick="undo()">⟲ 復原</button>
            </div>
        </div>
        
        <div class="exec-zone" id="execZone">
            <div class="tool-item">以 <input type="text" id="joinChar" style="width:30px" placeholder=" "> 串接 <button onclick="process('join')">執行</button></div>
            <div class="tool-item">以 <input type="text" id="splitChar" style="width:30px" value=","> 分割 <button onclick="process('split')">執行</button></div>
            <div class="tool-item">取代 <input type="text" id="regFind" style="width:40px" placeholder="找"> 換 <input type="text" id="regRep" style="width:40px"> <button onclick="process('regex')">執行</button></div>
            <div class="tool-item">首加 <input type="text" id="prefix" style="width:40px"> 尾加 <input type="text" id="suffix" style="width:40px"> <button onclick="process('addEdge')">執行</button></div>
            <div class="tool-item">刪除字元 <input type="text" id="delChar" style="width:40px"> <button onclick="process('delete')">執行</button></div>
            <div class="tool-item">含有 <input type="text" id="filterText" style="width:40px">行 <button onclick="process('keepLine')">保留</button> <button onclick="process('delLine')">刪除</button></div>
            <div class="tool-item">編號 <select id="numPad"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option></select> <button onclick="process('autoNum')">執行</button></div>
            　　　<button class="secondary" style="background:#dc2626" onclick="resetTools()">重置</button>
        </div>
    </header>

    <main>
        <div class="editor-box">
            <div class="toolbar-top">
                <span>原始資料 <small id="statIn"></small></span>
                <div><button class="secondary" onclick="pasteIn()">貼上</button> <button class="secondary" onclick="clearIn()">清空</button></div>
            </div>
            <textarea id="inputArea" oninput="updateStats()" placeholder="貼上資料..."></textarea>
        </div>
        <div class="editor-box">
            <div class="toolbar-top">
                <span>處理結果 <small id="statOut"></small></span>
                <div>
                    <button class="green" onclick="copyOut()">一鍵複製 Copy</button>
                    <button class="secondary" onclick="clearOut()">清空</button>
                    <button class="green" onclick="downloadTxt()">📥 下載 .txt</button>
                </div>
            </div>
            <textarea id="outputArea" placeholder="結果..."></textarea>
        </div>
    </main>

    <footer>
        <a href="https://w1798.github.io/web/" target="_blank" style="color:var(--text)">Completed by Charles Nextime with AI assistance, 2026</a>
        <span id="busuanzi_container_page_pv">閱讀量 <span id="busuanzi_value_page_pv"></span> 次</span>
    </footer>
</div>

<script>
    let history = [];
    const input = document.getElementById('inputArea');
    const output = document.getElementById('outputArea');

    function saveHistory() { history.push(output.value); if (history.length > 30) history.shift(); }
    function undo() { if (history.length > 0) { output.value = history.pop(); updateStats(); } }
    
    function resetTools() {
        document.getElementById('joinChar').value = '';
        document.getElementById('splitChar').value = ',';
        document.getElementById('numPad').value = '1';
        document.getElementById('filterText').value = '';
        document.getElementById('delChar').value = '';
        document.getElementById('prefix').value = '';
        document.getElementById('suffix').value = '';
        document.getElementById('regFind').value = '';
        document.getElementById('regRep').value = '';
    }

    function updateStats() {
        document.getElementById('statIn').innerText = `| 字: ${input.value.length} 行: ${input.value.split('\n').filter(s => s).length}`;
        document.getElementById('statOut').innerText = `| 字: ${output.value.length} 行: ${output.value.split('\n').filter(s => s).length}`;
    }

    async function pasteIn() { try { input.value = await navigator.clipboard.readText(); updateStats(); } catch(e) { alert("請手動貼上。"); } }
    function clearIn() { input.value = ''; updateStats(); }
    function clearOut() { saveHistory(); output.value = ''; updateStats(); }
    function copyOut() { navigator.clipboard.writeText(output.value); alert('已複製！'); }
    function downloadTxt() {
        const blob = new Blob([output.value], {type: 'text/plain'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `Export_${new Date().getTime()}.txt`;
        a.click();
    }

    function process(type) {
        saveHistory();
        let text = output.value || input.value;
        if (!text && input.value) text = input.value;
        let lines = text.split(/\r?\n/);

        switch(type) {
            case 'join': text = lines.join(document.getElementById('joinChar').value); break;
            case 'split': text = text.split(document.getElementById('splitChar').value).join('\n'); break;
            case 'delete': text = text.split(document.getElementById('delChar').value).join(''); break;
            case 'noEng': text = text.replace(/[a-zA-Z]/g, ''); break;
            case 'noNum': text = text.replace(/[0-9]/g, ''); break;
            case 'noSym': text = text.replace(/[^a-zA-Z0-9\s\u4e00-\u9fa5]/gi, ''); break;
            case 'noHTML': text = text.replace(/<\/?[^>]+(>|$)/g, ""); break;
            case 'noEmptyLine': text = lines.filter(l => l.trim() !== '').join('\n'); break;
            case 'addEmptyLine': text = lines.join('\n\n'); break;
            case 'trimSpace': text = lines.map(l => l.trim().replace(/\s+/g, ' ')).join('\n'); break;
            case 'upper': text = text.toUpperCase(); break;
            case 'lower': text = text.toLowerCase(); break;
            case 'capitalize': text = lines.map(l => l.charAt(0).toUpperCase() + l.slice(1)).join('\n'); break;
            case 'indent': text = lines.map(l => '    ' + l).join('\n'); break;
            case 'outdent': text = lines.map(l => l.replace(/^    |^  |^\t/, '')).join('\n'); break;
            case 'sort': text = lines.sort((a,b) => a.localeCompare(b, 'zh-Hant')).join('\n'); break;
            case 'shuffle': text = lines.sort(() => Math.random() - 0.5).join('\n'); break;
            case 'keepLine': 
                const kTerm = document.getElementById('filterText').value;
                text = lines.filter(l => l.includes(kTerm)).join('\n'); break;
            case 'delLine': 
                const dTerm = document.getElementById('filterText').value;
                text = lines.filter(l => !l.includes(dTerm)).join('\n'); break;
            case 'addEdge': 
                const pre = document.getElementById('prefix').value;
                const suf = document.getElementById('suffix').value;
                text = lines.map(l => pre + l + suf).join('\n'); break;
            case 'autoNum':
                const pad = parseInt(document.getElementById('numPad').value);
                text = lines.map((l, i) => (i + 1).toString().padStart(pad, '0') + l).join('\n'); break;
            case 'regex': 
                try {
                    const re = new RegExp(document.getElementById('regFind').value, 'g');
                    text = text.replace(re, document.getElementById('regRep').value);
                } catch(e) { alert('Regex 錯誤'); }
                break;
            case 'findDup':
                const counts = {};
                lines.filter(l => l !== '').forEach(l => counts[l] = (counts[l] || 0) + 1);
                text = Object.keys(counts).filter(l => counts[l] > 1).join('\n');
                if(!text) text = "無重複"; break;
        }
        output.value = text;
        updateStats();
    }
</script>


<style>
#busuanzi_container_page_pv {
    color: rgba(255, 255, 255, 0.7); /* 讓顏色跟作者資訊一致 */
    font-size: 0.9rem;
    margin-left: 15px; /* 與左邊文字隔開 */
    border-left: 1px solid rgba(128, 128, 128, 0.5); /* 加一條細細的分隔線 */
    padding-left: 15px;
}

#busuanzi_value_page_pv {
    color: #0984e3; 
    font-weight: bold;
}
</style>

<script>
    (function() {
        const primary = "https://events.vercount.one/js";
        const fallback = "https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js";
        let isSwitched = false;

        function load(src, isBackup = false) {
            if (isSwitched && !isBackup) return; // 避免重複觸發
            
            const script = document.createElement('script');
            script.src = src;
            script.async = true;

            // 觸發備援的機制
            const triggerFallback = () => {
                if (!isSwitched) {
                    isSwitched = true;
                    console.warn("切換至備援計數器...");
                    load(fallback, true);
                }
            };

            script.onerror = triggerFallback; // 載入失敗時
            const timer = setTimeout(triggerFallback, 3000); // 3秒沒反應時
            script.onload = () => clearTimeout(timer); // 成功則取消計時器

            document.head.appendChild(script);
        }

        load(primary);
    })();
</script>


</body>
</html>
