<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多功能文字處理器 by Charles Nextime</title>
<script>
    // 1. 版本控制
    const APP_VER = "1.00f";

    // 2. 資源清單：要增減檔案改這裡即可，不需要請刪除或註解即可
    const resources = {
        styles: [
            "style.css"
        ], 
        scripts: [
            "../counter.js",
            "script.js"
        ]
    };

    // --- 立即隱藏頁面 ---
    document.documentElement.style.visibility = 'hidden';

    /**
     * 核心邏輯：將資源標籤注入到 <head>
     */
    function injectResource(type, url, onCssLoaded) {
        const isCSS = type === 'css';
        const el = document.createElement(isCSS ? 'link' : 'script');
        const attr = isCSS ? 'href' : 'src';
        
        if (isCSS) {
            el.rel = 'stylesheet';
        } else {
            el.async = false;
        }

        el[attr] = `${url}?ver=${APP_VER}`;
        
        el.onload = () => {
            console.log(`%c[已載入] ${type.toUpperCase()}: ${url}`, "color: #00b894");
            // 若為 CSS，載入成功後執行進度檢查
            if (isCSS && onCssLoaded) onCssLoaded();
        };

        el.onerror = () => {
            console.error(`[載入失敗] ${url}`);
            // 若為 CSS，即便失敗也要解鎖，避免畫面永久白屏
            if (isCSS && onCssLoaded) onCssLoaded();
        };

        document.head.appendChild(el);
    }

    /**
     * 主程序：解析配置並執行載入
     */
    function loadApp() {
        console.log(`%c[Loader] 開始初始化資源 (版本: ${APP_VER})`, "color: #3498db; font-weight: bold;");

        const cssList = resources.styles || [];
        let cssLoadedCount = 0;

        // 【新增】檢查 CSS 載入進度
        const checkCssProgress = () => {
            cssLoadedCount++;
            if (cssLoadedCount >= cssList.length) {
                document.documentElement.style.visibility = 'visible';
                console.log("%c[Display] 樣式套用完成，解除頁面鎖定", "color: #9b59b6; font-weight: bold;");
            }
        };

        // 如果完全沒有 CSS，直接顯示
        if (cssList.length === 0) {
            document.documentElement.style.visibility = 'visible';
        }

        // 執行載入
        const configs = [
            { data: cssList, type: 'css', label: 'CSS' },
            { data: resources.scripts, type: 'js', label: 'JS' }
        ];

        configs.forEach(config => {
            if (config.data && config.data.length > 0) {
                config.data.forEach(url => {
                    // 只有 CSS 傳入回調函式
                    injectResource(config.type, url, config.type === 'css' ? checkCssProgress : null);
                });
            } else {
                console.log(`%c[Notice] 無外部 ${config.label} 資源需要載入`, "color: #e67e22");
            }
        });
    }

    // 啟動！
    loadApp();
</script>
</head>
<body>
<div class="container">
    <header>
        <div class="top-bar">
            <div class="brand">多功能文字處理器</div>
            <div class="btn-group">
                <button class="purple" onclick="dualProcess('join')">資1接資2</button>
                <button class="purple" onclick="dualProcess('interleave')">資1插資2</button>
                <button class="purple" onclick="dualProcess('compare')">資12比對</button>
                <span class="divider">|</span>
                <button class="green" onclick="process('trimSpace')">刪空格</button>
                <button class="secondary" onclick="process('noEng')">刪英文</button>
                <button class="secondary" onclick="process('noNum')">刪數字</button>
                <button class="secondary" onclick="process('noSym')">刪符號</button>
                <button class="secondary" onclick="process('noHTML')">刪HTML</button>
                <span class="divider">|</span>
                <button class="green" onclick="process('indent')">增縮排</button>
                <button class="secondary" onclick="process('outdent')">減縮排</button>
                <span class="divider">|</span>
                <button class="secondary" onclick="process('findDup')">資1找重複</button>
                <div class="break"></div>
                <button class="green" onclick="process('noEmptyLine')">刪空行</button>
                <button class="secondary" onclick="process('addEmptyLine')">加空行</button>
                <span class="divider">|</span>
                <button class="green" onclick="process('sort')">排序</button>
                <button class="secondary" onclick="process('shuffle')">隨機排</button>
                <span class="divider">|</span>
                <button class="secondary" onclick="process('capitalize')">首字大寫</button>
                <button class="secondary" onclick="process('upper')">全大寫</button>
                <button class="secondary" onclick="process('lower')">全小寫</button>
                <span class="divider">|</span>
                <button class="purple" onclick="process('smartFormat')">JSON/CSS格式化</button>

                <span class="divider">|</span>                       
                <div class="tool-item" style="background: none; border: none; padding: 0;">
                    <small style="color: #888; margin-right: 5px;">加入常用:</small>
                    <button class="secondary" style="padding: 2px 6px; font-size: 12px; margin-right: 4px;" onclick="insertSym('\\t')">Tab</button>
                    <button class="secondary" style="padding: 2px 6px; font-size: 12px;" onclick="insertSym('\\n')">換行</button>
                </div>                 
           
            </div>
        </div>
        <div class="exec-zone">
    
            <div class="tool-item">以 <input type="text" id="joinChar" style="width:30px" placeholder=" "> 串接 <button onclick="process('join')">執行</button></div>
            <div class="tool-item">以 <input type="text" id="splitChar" style="width:30px"> 分割 <button onclick="process('split')">執行</button></div>
            <span class="divider">|</span>
            <div class="tool-item">取代 <input type="text" id="regFind" style="width:40px" placeholder="找"> 換 <input type="text" id="regRep" style="width:40px"> <button onclick="process('regex')">執行</button></div>
            <span class="divider">|</span>
            <div class="tool-item">首加 <input type="text" id="prefix" style="width:40px"> 尾加 <input type="text" id="suffix" style="width:40px"> <button onclick="process('addEdge')">執行</button></div>
            <span class="divider">|</span>
            <div class="tool-item">刪除字元 <input type="text" id="delChar" style="width:40px"> <button onclick="process('delete')">執行</button></div>
            <span class="divider">|</span>
            <div class="tool-item">含有 <input type="text" id="filterText" style="width:50px"> <button onclick="process('keepLine')">保留行</button> <button onclick="process('delLine')">刪除行</button></div>
            <span class="divider">|</span>
            <div class="tool-item">
                頭<select id="headCount"></select>
                尾<select id="tailCount"></select>
                <button onclick="process('sliceKeep')">保留</button> <button onclick="process('sliceDel')">刪除</button>
            </div>
            <span class="divider">|</span>
            <div class="tool-item">編號 <select id="numPad"></select> <button onclick="process('autoNum')">執行</button></div>
            <span class="divider">|</span>
            <button class="secondary" style="background:#dc2626; margin-left: 10px;" onclick="resetTools()">重置參數</button>
            <span class="divider">|</span>
            <button class="red" onclick="undo()">⟲ 上一步</button>
            <span class="divider">|</span>
            <button class="secondary" id="themeBtn" onclick="toggleTheme()">☀️淺色模式</button>
        </div>
    </header>
    <main>
        <div class="box-25">
            <div class="toolbar-top"><span>原始資料1 <small id="stat1"></small></span><div><button class="secondary" onclick="pasteTo('inputArea')">貼上</button> <button class="secondary m-left" onclick="clearArea('inputArea')">清空</button></div></div>
            <textarea id="inputArea" placeholder="資料源1..."></textarea>
        </div>
        <div class="box-25">
            <div class="toolbar-top"><span>原始資料2 <small id="stat2"></small></span><div><button class="secondary" onclick="pasteTo('inputArea2')">貼上</button> <button class="secondary m-left" onclick="clearArea('inputArea2')">清空</button></div></div>
            <textarea id="inputArea2" placeholder="資料源2(用於左上資1資2功能)..."></textarea>
        </div>
        <div class="box-50">
            <div class="toolbar-top"><span>處理結果 <small id="statOut"></small></span>
                <div>
                    <button class="green" onclick="copyOut()">複製</button> 
                    <button class="green m-left" onclick="downloadTxt()">下載</button>
                    <button class="secondary m-left" onclick="clearArea('outputArea')">清空</button>
                    <button id="fullBtn" class="secondary m-left" onclick="toggleFullScreen()">⛶ 全屏</button>
                    <button class="secondary m-left" onclick="scrollArea('outputArea', 'top')">▲頂</button>
                    <button class="secondary" onclick="scrollArea('outputArea', 'bottom')">▼底</button>
                </div>
            </div>
            <textarea id="outputArea" placeholder="處理結果將顯示在此..."></textarea>
        </div>
    </main>
    <footer></footer>
</div>


    
</body>
</html>
