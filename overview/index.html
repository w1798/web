<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Charles Nextime 數據儀表板</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #4834d4; --success: #00b894; --info: #0984e3; --danger: #ff7675; --gray: #95a5a6; }
        body { font-family: -apple-system, system-ui, sans-serif; background: #f0f2f5; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #f1f2f6; padding-bottom: 15px; }
        .btn-group { display: flex; gap: 8px; }
        .btn-json { background: #636e72; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.85rem; transition: 0.2s; }
        .btn-key { background: #a29bfe; }
        .btn-sync { background: #00b894; display: none; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px; color: #7f8c8d; font-size: 0.75rem; border-bottom: 2px solid #eee; }
        td { padding: 14px 12px; border-bottom: 1px solid #f1f2f6; white-space: nowrap; }
        .badge { padding: 3px 6px; border-radius: 4px; font-size: 0.65rem; font-weight: bold; margin-right: 5px; }
        .bg-gh { background: #e3f2fd; color: #0d47a1; }
        .bg-bs { background: #fff3e0; color: #e65100; }
        .num-main { font-family: monospace; font-weight: 800; color: var(--success); font-size: 1.1rem; }
        .num-prev { font-size: 0.7rem; color: var(--gray); margin-left: 4px; }
        .trend-box { width: 160px; height: 45px; }
        .error-banner { display: none; background: #fab1a0; color: #d63031; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-weight: bold; text-align: center; border: 1px solid #ff7675; }
        footer { text-align: center; padding: 30px 0; margin-top: 20px; border-top: 1px solid #eee; font-size: 0.85rem; color: var(--gray); }
    </style>
</head>
<body>

<div class="container">
    <div id="error-banner" class="error-banner">⚠️ 金鑰驗證失敗，請檢查或清除金鑰！</div>

    <div class="header">
        <div>
            <h1 style="margin:0; font-size: 1.4rem;">📊 Charles Nextime 數據儀表板</h1>
            <div style="display: flex; align-items: center; gap: 10px; margin-top: 5px;">
                <p id="status" style="font-size:0.8rem; color:var(--gray); margin:0;">狀態：載入中...</p>
                <span id="mode-badge" style="font-size: 0.65rem; padding: 2px 6px; border-radius: 10px; background: #eee; color: #666;">檢查中</span>
            </div>
        </div>
        <div class="btn-group">
            <button id="btn-sync" class="btn-json btn-sync" onclick="forceSync()">⚡ 強制完全同步 (更新 PV)</button>
            <button class="btn-json btn-key" onclick="manageKey()">🔑 設定金鑰</button>
            <button class="btn-json" onclick="exportJSON()">📤 匯出備份 JSON</button>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th style="width: 20%;">專案路徑</th>
                <th>即時 PV (對比)</th>
                <th style="text-align:right;">全站 PV (對比)</th>
                <th style="text-align:right;">訪客 UV (對比)</th>
                <th style="text-align:center;">PV 歷史趨勢 (30天)</th>
            </tr>
        </thead>
        <tbody id="stats-body"></tbody>
    </table>
</div>

<footer>
    <p>Completed by Charles Nextime with AI assistance, 2026</p>
</footer>

<script>
    // === 配置區 ===
    const BIN_ID = '697aee71d0ea881f408f5c54';
    const BIN_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;
    const DEFAULT_READ_KEY = '$2a$10$FZ1PlHvMFsdY9owgPFrBJeBFRKsIO5kHKXjjcramkaVXdJ5im754G';
    const SAVED_KEY = localStorage.getItem('CHARLES_MASTER_KEY');
    const FINAL_KEY = SAVED_KEY || DEFAULT_READ_KEY;
    const CAN_WRITE = !!(SAVED_KEY && SAVED_KEY !== DEFAULT_READ_KEY);

    const targetUrls = [
        "https://nextime5.blogspot.com/",
        "https://w1798.github.io/web/homework",
        "https://w1798.github.io/web/evalprompt",
        "https://w1798.github.io/web/TextLab",
        "https://w1798.github.io/web/examboard",
        "https://w1798.github.io/web/markit",
        "https://w1798.github.io/web/jsonEditor",
        "https://w1798.github.io/web/comment",
        "https://w1798.github.io/web/"
    ];

    const STORAGE_KEY = 'CHARLES_STATS_V6';
    const CLOUD_TIME_KEY = 'CHARLES_CLOUD_FETCH'; // 控制 JSONBin 的時間
    const PV_TIME_KEY = 'CHARLES_PV_FETCH';       // 控制 Vercount 的時間
    
    // 設定冷卻時間 (毫秒)
    const CLOUD_COOLDOWN = 3600000; // 1 小時讀一次雲端
    const PV_COOLDOWN = 3600000;    // 1 小時更新一次 PV

    // 管理金鑰
    function manageKey() {
        const input = prompt("輸入 Master Key:", SAVED_KEY || "");
        if (input === null) return;
        if (input.trim() === "") localStorage.removeItem('CHARLES_MASTER_KEY');
        else localStorage.setItem('CHARLES_MASTER_KEY', input.trim());
        location.reload();
    }

    // 強制同步
    function forceSync() {
        localStorage.removeItem(CLOUD_TIME_KEY);
        localStorage.removeItem(PV_TIME_KEY);
        startFlow();
    }

    async function startFlow() {
        const statusText = document.getElementById('status');
        const modeBadge = document.getElementById('mode-badge');
        const syncBtn = document.getElementById('btn-sync');
        const now = new Date().getTime();

        modeBadge.innerText = CAN_WRITE ? "編輯模式" : "唯讀模式";
        modeBadge.style.background = CAN_WRITE ? "#d1fae5" : "#f1f2f6";
        if (CAN_WRITE) syncBtn.style.display = "inline-block";

        let history = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
        const lastCloud = localStorage.getItem(CLOUD_TIME_KEY);

        // --- 第一層：JSONBin 讀取判斷 ---
        if (!lastCloud || (now - lastCloud > CLOUD_COOLDOWN)) {
            statusText.innerText = "🌐 正在從雲端同步歷史紀錄...";
            try {
                const res = await fetch(`${BIN_URL}/latest`, { headers: { 'X-Access-Key': FINAL_KEY } });
                if (!res.ok) throw new Error("Key Error");
                const result = await res.json();
                history = result.record || {};
                localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
                localStorage.setItem(CLOUD_TIME_KEY, now);
                statusText.innerText = "✅ 雲端同步完成";
            } catch (e) {
                document.getElementById('error-banner').style.display = 'block';
                statusText.innerText = "❌ 雲端連接失敗，使用本地快取";
            }
        } else {
            statusText.innerText = "🕒 讀取雲端快取";
        }

        // 渲染初步資料 (不論是否有抓即時 PV)
        targetUrls.forEach((url, i) => renderRow(url, history[url] || [], i));

        // --- 第二層：Vercount 即時 PV 判斷 ---
        const lastPV = localStorage.getItem(PV_TIME_KEY);
        if (!lastPV || (now - lastPV > PV_COOLDOWN)) {
            statusText.innerText = "🔄 正在抓取最新 PV...";
            const todayStr = new Date().toLocaleDateString('zh-TW');

            for (let i = 0; i < targetUrls.length; i++) {
                const url = targetUrls[i];
                try {
                    const res = await fetch(`https://events.vercount.one/log?url=${url}`);
                    const data = await res.json();
                    const newEntry = {
                        time: new Date().toLocaleString('zh-TW', { hour12: true }),
                        pv: data.page_pv || 0,
                        site_pv: data.site_pv || 0,
                        uv: data.site_uv || 0
                    };
                    
                    if (!history[url]) history[url] = [];
                    const lastIdx = history[url].length - 1;
                    const lastDatePart = lastIdx >= 0 ? history[url][lastIdx].time.split(' ')[0] : null;

                    if (lastDatePart === todayStr) history[url][lastIdx] = newEntry;
                    else {
                        history[url].push(newEntry);
                        if (history[url].length > 30) history[url].shift();
                    }
                    renderRow(url, history[url], i);
                } catch (e) { console.error("PV Fetch Fail:", url); }
            }

            // 更新時間與儲存
            localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
            localStorage.setItem(PV_TIME_KEY, now);

            // 如果有寫入權限，同步回雲端
            if (CAN_WRITE) {
                await fetch(BIN_URL, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'X-Access-Key': FINAL_KEY },
                    body: JSON.stringify(history)
                });
                statusText.innerText = "✅ PV 更新並上傳成功";
            } else {
                statusText.innerText = "✅ PV 已更新 (唯讀模式未上傳)";
            }
        } else {
            statusText.innerText += " (PV 快取中)";
        }
    }

    function renderRow(url, logs, idx) {
        const body = document.getElementById('stats-body');
        let row = document.getElementById(`row-${idx}`);
        if (!row) { row = document.createElement('tr'); row.id = `row-${idx}`; body.appendChild(row); }
        const curr = logs[logs.length - 1] || {pv:0, site_pv:0, uv:0};
        const prev = logs.length > 1 ? logs[logs.length - 2] : curr;
        const isBlogspot = url.includes('blogspot');
        const displayName = url.replace('https://w1798.github.io/web/', '/').replace('https://nextime5.blogspot.com/', 'Blogspot');

        row.innerHTML = `
            <td>
                <span class="badge ${isBlogspot ? 'bg-bs' : 'bg-gh'}">${isBlogspot ? 'BLOG' : 'GHPG'}</span>
                <span style="font-size:0.9rem; font-weight:500;">${displayName}</span>
            </td>
            <td><span class="num-main">${curr.pv}</span><span class="num-prev">(原 ${prev.pv})</span></td>
            <td style="text-align:right;"><span style="color:var(--info); font-weight:600;">${curr.site_pv}</span><span class="num-prev">(原 ${prev.site_pv})</span></td>
            <td style="text-align:right;"><span style="color:#6c5ce7; font-weight:700;">${curr.uv}</span><span class="num-prev">(原 ${prev.uv})</span></td>
            <td><div class="trend-box"><canvas id="chart-${idx}"></canvas></div></td>
        `;
        
        setTimeout(() => {
            const ctx = document.getElementById(`chart-${idx}`).getContext('2d');
            if (window[`chartObj_${idx}`]) window[`chartObj_${idx}`].destroy();
            window[`chartObj_${idx}`] = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: logs.map(l => l.time),
                    datasets: [{ 
                        data: logs.map(l => l.pv), 
                        borderColor: '#4834d4', borderWidth: 2, pointRadius: 0, tension: 0.3, fill: true, backgroundColor: 'rgba(72, 52, 212, 0.1)' 
                    }]
                },
                options: { 
                    responsive: true, maintainAspectRatio: false, animation: false,
                    plugins: { legend: { display: false } }, 
                    scales: { x: { display: false }, y: { display: false } } 
                }
            });
        }, 0);
    }

    function exportJSON() {
        const history = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
        const blob = new Blob([JSON.stringify(history, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `stats_backup.json`;
        a.click();
    }

    window.onload = startFlow;
</script>
</body>
</html>
